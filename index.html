<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  /* dvh, not vh: on mobile 100vh is the LARGE viewport (as if the URL bar were
     hidden), so the bottom ~60-100px — the taskbar — sits under the browser
     chrome and off screen. dvh tracks the visible area. The vh line stays as a
     fallback for browsers without dvh; the later declaration wins where it's
     supported. window.innerHeight (computeDims) already matches dvh. */
  width:100%;height:100vh;height:100dvh;overflow:hidden;font-family:'Courier New',monospace;
  background:
    /* clouds */
    radial-gradient(ellipse 18vw 3vh at 16% 18%, rgba(255,255,255,0.88), rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 12vw 2.2vh at 22% 26%, rgba(255,255,255,0.7),  rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 22vw 3vh at 58% 12%, rgba(255,255,255,0.82), rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 14vw 2.5vh at 82% 22%, rgba(255,255,255,0.75), rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 10vw 2vh at 40% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%),
    /* rolling green hill — ellipse anchored below the viewport, its top arc is the horizon */
    radial-gradient(ellipse 130% 62% at 38% 128%, #7fae3a 0%, #5d9128 55%, #3f6a18 100%, rgba(0,0,0,0) 100%),
    /* sky */
    linear-gradient(180deg, #2c6cb8 0%, #5a9ddc 35%, #9ec9ea 60%, #d6e7f1 72%, #d6e7f1 100%);
}
#stage{position:relative;width:100%;height:100vh;height:100dvh}
#simCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
#birdCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;z-index:7}
#uiLayer{position:absolute;inset:0;pointer-events:none}

/* ── Win95 window chrome ── */
.win95{
  background:#c0c0c0;
  border:2px solid;
  border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 2px 2px 0 #000;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  color:#000;
  pointer-events:all;
}
.win95-title{
  background:linear-gradient(90deg,#000080 0%,#1084d0 100%);
  color:#fff;font-weight:700;font-size:11px;
  padding:2px 3px 2px 5px;
  display:flex;align-items:center;justify-content:space-between;
  user-select:none;touch-action:none;
}
.win95-title .tbtns{display:flex;gap:2px}
.win95-title .tbtn{
  width:15px;height:13px;background:#c0c0c0;color:#000;
  border:1px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  font-size:9px;font-weight:700;line-height:9px;text-align:center;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding-bottom:2px;touch-action:manipulation;
}
.win95-body{padding:6px 7px}

#hud{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  z-index:10;
}
#hud .win95-body{
  display:flex;gap:5px;align-items:center;
}
.hud-btn{
  background:#c0c0c0;color:#000;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  font-size:11px;padding:2px 10px;min-height:22px;
  cursor:pointer;white-space:nowrap;
}
.hud-btn:active,.hud-btn.on{
  border-color:#000000 #ffffff #ffffff #000000;
  box-shadow:inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
  padding:3px 9px 1px 11px;
}
.hud-btn.on{background:#a8a8a8}
.hud-sep{width:2px;height:18px;border-left:1px solid #808080;border-right:1px solid #ffffff;margin:0 2px}
.hud-label{font-size:11px;color:#000;font-family:'Tahoma','MS Sans Serif',sans-serif}

/* Win95-style slider */
#hud input[type=range]{
  -webkit-appearance:none;appearance:none;
  background:transparent;height:22px;margin:0;
}
#hud input[type=range]::-webkit-slider-runnable-track{
  height:4px;background:#808080;
  border:1px solid;border-color:#000 #fff #fff #000;
}
#hud input[type=range]::-moz-range-track{
  height:4px;background:#808080;
  border:1px solid;border-color:#000 #fff #fff #000;
}
#hud input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:10px;height:18px;background:#c0c0c0;margin-top:-8px;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  cursor:pointer;
}
#hud input[type=range]::-moz-range-thumb{
  width:10px;height:18px;background:#c0c0c0;border-radius:0;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  cursor:pointer;
}

#matPicker{
  position:absolute;top:14px;right:14px;
  z-index:10;width:154px;
}
#matPicker .win95-title{cursor:move}
#matPicker.is-min .win95-body{display:none}
#matPicker .win95-body{
  padding:3px;
}
#matPicker .mat-list{
  display:flex;flex-direction:column;gap:0;
  background:#fff;
  border:2px solid;border-color:#808080 #ffffff #ffffff #808080;
  box-shadow:inset 1px 1px 0 #000;
  padding:2px;
}
.mat-opt{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  font-family:'Tahoma','MS Sans Serif',sans-serif;font-size:11px;color:#000;
  padding:1px 4px;
}
.mat-opt:hover{background:#000080;color:#fff}
.mat-opt.active{background:#000080;color:#fff}
.mat-dot{width:9px;height:9px;flex-shrink:0;border:1px solid #000;image-rendering:pixelated}

#infoPanel{position:absolute;top:14px;left:14px;pointer-events:none;z-index:10}
.site-hint{font-size:8px;color:#303030;letter-spacing:0.08em}

#stats{
  /* sits above the foreground berm (see uBar in the fragment shader); the light
     halo keeps it legible whether it lands on meadow or on a dark blade */
  position:absolute;bottom:56px;right:14px;font-size:8px;color:#222;
  letter-spacing:0.08em;font-family:'Courier New',monospace;pointer-events:none;
  text-align:right;line-height:1.8;z-index:10;
  text-shadow:0 0 2px rgba(255,255,255,0.75);
}
#freezeRing{
  position:absolute;border:1px solid rgba(184,224,0,0.18);border-radius:50%;
  width:60px;height:60px;pointer-events:none;transform:translate(-50%,-50%);
  transition:opacity 0.3s;opacity:0;z-index:5;
}
#brushRing{
  position:absolute;border:1px solid rgba(255,255,255,0.35);border-radius:50%;
  box-shadow:0 0 0 1px rgba(0,0,0,0.22);
  pointer-events:none;transform:translate(-50%,-50%);
  transition:opacity 0.15s;opacity:0;z-index:5;
}
/* ── Resume overlay: real DOM content that particles collide with via [data-collide] ── */
#resume{
  position:absolute;inset:0;pointer-events:none;z-index:6;
  font-family:'Courier New',monospace;color:#1c1a22;
  padding:3.5vh 3.5vw;display:grid;
  grid-template-columns:1fr 1fr;gap:2vh 3vw;
  align-content:start;
}
#resume *{pointer-events:none} /* paint passes through; cards are purely visual + collision */
.r-name{
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  font-size:clamp(28px,4.2vw,62px);font-weight:700;line-height:1.05;letter-spacing:0.01em;
  color:#fff;
  background:linear-gradient(90deg,#000080 0%,#1084d0 100%);
  padding:10px 16px 12px;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 3px 3px 0 #000;
  display:inline-block;align-self:flex-start;
}
.r-tag{
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  font-size:clamp(11px,1.1vw,13px);color:#000;font-weight:700;letter-spacing:0.02em;
  background:#c0c0c0;display:inline-block;padding:3px 10px;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 2px 2px 0 #000;
}
.r-block{
  background:#c0c0c0;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  color:#000;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 3px 3px 0 #000;
  font-size:clamp(11px,1.05vw,13px);line-height:1.45;
  padding:0 0 10px 0;
  overflow:hidden;
}
.r-block h3{
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  font-size:clamp(11px,1.0vw,13px);font-weight:700;letter-spacing:0.02em;
  color:#fff;
  background:linear-gradient(90deg,#000080 0%,#1084d0 100%);
  padding:2px 4px 2px 6px;margin:2px 2px 8px 2px;
  border:none;
}
.r-block h3::after{
  content:"_ □ ✕";
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  font-size:9px;font-weight:700;color:#000;
  background:#c0c0c0;padding:1px 4px;letter-spacing:3px;line-height:1;
  border:1px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  margin-left:8px;
}
.r-block h3.no-deco::after{content:none}
.r-block h3{pointer-events:auto;cursor:default}
.r-block h3 .r-tbtns{
  display:flex;gap:2px;pointer-events:auto;margin-left:8px;
}
.r-block h3 .r-tbtns .tbtn{
  width:15px;height:13px;background:#c0c0c0;color:#000;
  border:1px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  font-size:9px;font-weight:700;line-height:9px;text-align:center;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding-bottom:2px;cursor:pointer;pointer-events:auto;
}
.r-block h3 .r-tbtns .tbtn:active{
  border-color:#000000 #ffffff #ffffff #000000;
  box-shadow:inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
}
.win95-title{cursor:default}
.win95-title .tbtn{cursor:pointer}
.win95{cursor:default}

/* ── Win95 taskbar ── */
#taskbar{
  position:absolute;bottom:0;left:0;right:0;height:30px;z-index:11;
  background:#c0c0c0;
  border-top:2px solid #ffffff;
  box-shadow:inset 0 1px 0 #dfdfdf;
  display:flex;align-items:center;gap:3px;padding:3px 3px 3px 3px;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  pointer-events:all;
}
.taskbar-start{
  background:#c0c0c0;color:#000;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  font-size:11px;font-weight:700;padding:1px 8px 2px;height:22px;
  display:flex;align-items:center;gap:5px;cursor:pointer;
}
/* the Start button wears the site's own cat rather than a knock-off
   flag; tabby orange so it reads against the #c0c0c0 button face. */
.taskbar-start .ts-logo{--accent:#f0a030}
.taskbar-sep{width:2px;height:22px;border-left:1px solid #808080;border-right:1px solid #ffffff;margin:0 2px;flex-shrink:0}
.taskbar-tasks{display:flex;align-items:center;gap:3px;flex:1;overflow:hidden}
.taskbar-btn{
  background:#c0c0c0;color:#000;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  font-size:11px;text-align:left;padding:1px 8px;
  height:22px;min-width:130px;max-width:170px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:pointer;display:flex;align-items:center;gap:5px;
}
.taskbar-btn:hover{background:#cacaca}
.taskbar-btn .tb-ico{display:inline-block;width:12px;height:12px;background:#000080;flex-shrink:0;border:1px solid #000}
.taskbar-clock{
  margin-left:auto;font-size:11px;color:#000;
  padding:2px 8px;height:22px;display:flex;align-items:center;
  border:1px solid;border-color:#808080 #ffffff #ffffff #808080;
  box-shadow:inset 1px 1px 0 #000;
  flex-shrink:0;
}
.r-block > *:not(h3){padding-left:10px;padding-right:10px}
.r-block .role{font-weight:700;margin-top:6px;color:#000}
.r-block .meta{color:#404040;font-size:0.92em;margin-bottom:4px}
.r-block ul{list-style:none;margin:4px 0 0 0;padding:0 10px}
.r-block li{padding-left:14px;position:relative;margin:2px 0}
.r-block li::before{content:"■";position:absolute;left:2px;color:#000080;font-size:0.6em;top:5px}
.r-left{display:flex;flex-direction:column;gap:1.2vh;align-self:start}
.r-right{display:flex;flex-direction:column;gap:1.2vh;align-self:start}
.r-header{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px}

/* ── Start menu ── */
#startMenu{
  position:absolute;bottom:30px;left:0;z-index:12;
  width:240px;background:#c0c0c0;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 2px 2px 0 #000;
  display:flex;font-family:'Tahoma','MS Sans Serif',sans-serif;
  pointer-events:all;
}
.smenu-side{
  width:24px;background:#808080;color:#fff;font-weight:700;font-size:18px;
  writing-mode:vertical-rl;transform:rotate(180deg);
  text-align:right;padding:8px 4px;letter-spacing:2px;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  background:linear-gradient(0deg,#000080 0%,#1084d0 100%);
  flex-shrink:0;
}
.smenu-side span{color:#c0c0c0;font-weight:400}
.smenu-body{flex:1;padding:2px;display:flex;flex-direction:column}
.smenu-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;font-size:12px;color:#000;cursor:pointer;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  position:relative;user-select:none;
}
.smenu-item:hover{background:#000080;color:#fff}
.smenu-item .smenu-ico{
  width:20px;height:20px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.smenu-item.smenu-cat::after{
  content:"▶";margin-left:auto;font-size:9px;
}
.smenu-sep{height:0;border-top:1px solid #808080;border-bottom:1px solid #ffffff;margin:2px 4px}
.smenu-sub{
  position:fixed;left:240px;top:0;
  width:220px;background:#c0c0c0;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 2px 2px 0 #000;
  padding:2px;display:none;
}
/* Hover bridges: a transparent pad on the parent row extending right into the
   submenu's column, plus a pad on the submenu extending left back over the
   parent. Lets the cursor travel diagonally without dropping the :hover. */
.smenu-item.smenu-cat::before{
  content:"";position:absolute;top:0;left:100%;width:16px;height:100%;
  pointer-events:auto;background:transparent;
}
.smenu-sub::before{
  content:"";position:absolute;top:-4px;bottom:-4px;left:-16px;width:18px;
  background:transparent;
}
/* Hover-to-open is gated behind a real hover pointer: on touch there is no
   hover, so category rows would open nothing at all. There, a tap sets
   .is-open on the row instead (see the click handler in the menu builder). */
@media (hover:hover){ .smenu-item:hover > .smenu-sub{display:block} }
.smenu-item.smenu-cat.is-open > .smenu-sub{display:block}
.smenu-item.smenu-cat.is-open{background:#000080;color:#fff}

/* ── Floating launched windows ── */
#windowsLayer{position:absolute;inset:0;pointer-events:none;z-index:8}
.win-app{
  position:absolute;pointer-events:all;
  background:#c0c0c0;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 2px 2px 0 #000;
  font-family:'Tahoma','MS Sans Serif',sans-serif;color:#000;
  display:flex;flex-direction:column;
  /* Every width is capped against the viewport so a launched window can never
     hang off the right edge — on a 375px phone the old flat 420px put the whole
     title bar, close button included, out of reach. */
  min-width:min(280px, calc(100vw - 16px));
  max-width:min(560px, calc(100vw - 16px));
  width:min(420px, calc(100vw - 16px));
  max-height:70vh;max-height:70dvh;
}
/* Scorch overlay for a window that fire, acid or lava has gotten into. Sized to
   the BORDER box (the -2px cancels the 2px chrome border) so its cells line up
   exactly with the holes the clip-path punches in the window. */
.win-app .burn-char{
  position:absolute;top:-2px;left:-2px;
  width:calc(100% + 4px);height:calc(100% + 4px);
  pointer-events:none;z-index:60;image-rendering:pixelated;
}
.win-app .win-title{
  background:linear-gradient(90deg,#7e7e7e 0%,#a8a8a8 100%);
  color:#fff;font-weight:700;font-size:11px;
  padding:2px 3px 2px 5px;
  display:flex;align-items:center;justify-content:space-between;
  user-select:none;cursor:move;flex-shrink:0;
  /* the drag handle owns the gesture: without this a title-bar drag on touch
     also scrolls the page / triggers pull-to-refresh */
  touch-action:none;
}
.win-app.is-focus .win-title{
  background:linear-gradient(90deg,#000080 0%,#1084d0 100%);
}
.win-app .win-title .tbtns{display:flex;gap:2px}
.win-app .win-title .tbtn{
  width:15px;height:13px;background:#c0c0c0;color:#000;
  border:1px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  font-size:9px;font-weight:700;line-height:9px;text-align:center;
  display:flex;align-items:center;justify-content:center;
  padding-bottom:2px;cursor:pointer;touch-action:manipulation;
}
.win-app .win-title .tbtn:active{
  border-color:#000000 #ffffff #ffffff #000000;
  box-shadow:inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
}
.win-app .win-body{
  padding:10px 12px;overflow-y:auto;font-size:12px;line-height:1.45;
  background:#c0c0c0;flex:1;
  /* stop a flick that runs past the end of the window from scrolling the page
     (and on iOS, from rubber-banding the whole document) behind it */
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.win-app .win-body h2{font-size:15px;margin:0 0 4px;color:#000080}
.win-app .win-body h3{font-size:12px;margin:10px 0 4px;color:#000;font-weight:700}
.win-app .win-body .sub{font-size:11px;color:#404040;margin-bottom:2px}
.win-app .win-body .meta{font-size:11px;color:#606060;margin-bottom:8px;font-style:italic}
.win-app .win-body p{margin:6px 0}
.win-app .win-body ul{list-style:none;margin:6px 0;padding-left:14px}
.win-app .win-body li{position:relative;margin:3px 0;padding-left:10px}
.win-app .win-body li::before{content:"■";position:absolute;left:-4px;color:#000080;font-size:0.6em;top:5px}
.win-app .win-body a{color:#000080;text-decoration:underline}
.win-app .win-body a:hover{color:#1084d0}
.win-app .win-body blockquote{
  margin:8px 4px;padding:6px 10px;background:#ffffe1;
  border:1px solid #000;font-style:italic;font-size:11px;
}
.win-app .win-body .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.win-app .win-body .tag{
  font-size:10px;padding:1px 6px;background:#c0c0c0;

/* ── 90s-flair atoms reused across themes ── */
@keyframes blink95{50%{opacity:0}}
.blink{animation:blink95 1s steps(1) infinite}
@keyframes rainbow95{
  0%{color:#ff0040}20%{color:#ff8800}40%{color:#ffe600}
  60%{color:#00cc44}80%{color:#0080ff}100%{color:#aa00ff}
}
.rainbow{animation:rainbow95 2s linear infinite;font-weight:700}
.marquee{
  overflow:hidden;white-space:nowrap;
  border:2px inset #808080;background:#000;color:#ffe600;
  font-family:'Courier New',monospace;font-size:11px;
  padding:3px 0;margin:6px 0;
}
.marquee span{display:inline-block;padding-left:100%;animation:marq 18s linear infinite}
@keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.hit-counter{
  display:inline-block;background:#000;color:#0f0;
  font-family:'Courier New',monospace;font-size:14px;font-weight:700;
  padding:2px 6px;border:1px solid #555;letter-spacing:3px;
}
.under-const{
  display:inline-block;background:#ffd700;color:#000;
  font-family:'Impact','Arial Black',sans-serif;font-size:10px;
  padding:2px 6px;border:2px dashed #000;letter-spacing:1px;
}
.badge90s{
  display:inline-block;font-size:9px;font-weight:700;
  padding:2px 6px;border:1px solid #000;background:#fff;color:#000;
  font-family:'Arial Black','Impact',sans-serif;letter-spacing:0.5px;
  margin:0 3px 3px 0;
}
/* Height cap as well as width: maximised, a window is wide enough that a
   full-bleed hero pushes every word of the write-up below the fold — and the
   portrait clips (Snaptrap) are the worst offenders. */
.shot{
  display:block;margin:6px 0;max-width:100%;max-height:44vh;width:auto;
  border:2px solid #000;box-shadow:3px 3px 0 #000;
}
.shot-vid{
  position:relative;display:block;margin:6px 0;width:100%;aspect-ratio:16/9;
  border:2px solid #000;box-shadow:3px 3px 0 #000;background:#000;
}
.shot-vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
/* clips replaced the demo GIFs: same look, ~10x less bytes, and unlike a GIF
   they can actually be paused when nobody is looking at them */
.shot-clip{
  display:block;margin:6px 0;max-width:100%;max-height:44vh;width:auto;
  border:2px solid #000;box-shadow:3px 3px 0 #000;background:#000;
}

/* ── THEME: gallery (My Work — the visual index of every project) ──
   Wider and taller than the other windows: this is the one that boots on load
   and the one holding thirteen tiles, so it gets its own budget. At the shared
   760x70dvh it showed three of thirteen on a 1440x900 laptop and left nearly
   half the desktop empty — the other ten sat behind a nested scroller with no
   cue that it scrolled. Four columns and a taller body put eight above the
   fold. Still capped so the sand world it floats over stays visible. */
.win-app.theme-gallery{
  width:min(990px, calc(100vw - 48px));
  max-width:min(1100px, calc(100vw - 48px));
  max-height:min(880px, calc(100vh - 90px));
  max-height:min(880px, calc(100dvh - 90px));
}
/* The materials picker owns the rightmost ~168px of the desktop. Between the
   phone breakpoint and ~1230px the full-width gallery lands on top of it and
   buries the sand sim's only control — so give those pixels back, with a 700px
   floor so the grid does not collapse to one column chasing the clearance.
   Below ~780px the two overlap no matter what; the old 760px window overlapped
   further than this does, so nothing there gets worse. */
@media (min-width:601px) and (max-width:1230px){
  .win-app.theme-gallery{ width:min(990px, max(700px, calc(100vw - 240px))); }
}
.win-app.theme-gallery .win-body{background:#c0c0c0}
/* Win95 tab control: the active tab loses its bottom border and grows a
   couple of pixels so it reads as continuous with the panel below it. */
.gal-tabs{display:flex;gap:2px;margin:8px 0 0;padding-left:3px;flex-wrap:wrap}
.gal-tab{
  font-family:'Tahoma','MS Sans Serif',sans-serif;font-size:11px;color:#000;
  padding:3px 11px 4px;background:#c0c0c0;cursor:pointer;position:relative;top:2px;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;border-bottom:none;
  box-shadow:inset 1px 1px 0 #dfdfdf;
}
.gal-tab.is-on{top:0;padding-bottom:6px;font-weight:700;z-index:2}
/* how many tiles are behind each tab. Doubles as the only cue on load that the
   grid runs past the bottom of the window. */
.gal-tab-n{margin-left:5px;font-size:9px;color:#4a4a4a;font-weight:400}
.gal-tab.is-on .gal-tab-n{color:#000080}
.gal-tab:focus-visible{outline:1px dotted #000;outline-offset:-3px}
.gal-panel{
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
  background:#c0c0c0;padding:8px;position:relative;z-index:1;
}
.gal-intro{font-size:11px;color:#404040;margin:0 2px 8px;font-style:italic}
/* identity block — the site boots here, so this is the masthead.
   These links used to sit as a row of raised buttons directly above the tab
   strip, which made two lookalike control rows with completely different jobs:
   one opens other windows, one filters the grid. Tabs now own the only button
   chrome in the window; these are ordinary links, sitting up beside the name
   under their own label so the two never read as peers. */
.gal-id{margin:0 0 2px}
.gal-id-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 18px}
.gal-id-who{min-width:180px}
.gal-id p{font-size:11px;line-height:1.4;margin:7px 0 0;max-width:64ch}
.gal-links{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;padding-top:3px;max-width:100%}
.gal-links-lbl{
  flex-basis:100%;font-size:9px;letter-spacing:.6px;text-transform:uppercase;
  color:#4a4a4a;font-weight:700;margin-bottom:1px;
}
.win-app .win-body .gal-links a{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;
  color:#000080;text-decoration:underline;cursor:pointer;
}
.win-app .win-body .gal-links a:hover{color:#1084d0}
.gal-links a:focus-visible{outline:1px dotted #000;outline-offset:1px}
/* Win95 etched groove: closes off the masthead so the tab strip below reads as
   belonging to the grid it is attached to, not to the identity block */
.gal-rule{height:2px;margin:10px 0 0;border-top:1px solid #808080;border-bottom:1px solid #fff}
/* 190px floor, not 168: at the new window width auto-fill would otherwise pack
   five or six columns and the tiles would come out smaller than they were at
   three. 190 tops out at four ~220px tiles and still fits three in the narrow
   tablet range, which a higher floor would have dropped to two. */
.gal-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));
  gap:8px;padding:8px;background:#fff;border:2px inset #808080;
}
/* the .win-body anchor rule outranks a bare .gal-card, and these cards ARE
   anchors — without matching its specificity every tile renders as blue
   underlined link text */
.win-app .win-body .gal-card{
  display:flex;flex-direction:column;cursor:pointer;text-decoration:none;
  color:#000;background:#c0c0c0;padding:4px;
  border:2px solid;border-color:#ffffff #000000 #000000 #ffffff;
  box-shadow:inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
}
.win-app .win-body .gal-card:hover{background:#d4d0c8;color:#000}
.gal-card:hover .gal-name{color:#000080;text-decoration:underline}
.gal-card:active{border-color:#000000 #ffffff #ffffff #000000}
.gal-card:focus-visible{outline:2px dotted #000;outline-offset:1px}
.gal-shot{
  position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;
  background:#000;border:1px solid #000;
  display:flex;align-items:center;justify-content:center;
}
.gal-shot img,.gal-shot video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
}
/* the clip sits on top of its own poster and only fades up once it is truly
   playing — swapping on the click alone shows a black frame while it buffers */
.gal-shot video{opacity:0;transition:opacity .2s}
.gal-card.is-playing .gal-shot video{opacity:1}
/* projects whose art has not landed yet: a deliberate empty slot rather than a
   broken image. Also the fallback if a remote poster fails to load. */
.gal-tbd{display:none}
.gal-shot.is-tbd{background:repeating-linear-gradient(45deg,#101034 0 7px,#181848 7px 14px)}
.gal-shot.is-tbd .gal-tbd{display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1}
.gal-shot.is-tbd .gal-tbd b{font-size:8px;letter-spacing:1px;color:#8a8ac8;font-weight:700}
.gal-shot.is-tbd .pxi{width:34px;height:34px;--ink:#8a8ac8;--paper:#101034;--face:#252560}
.gal-shot.is-tbd img,.gal-shot.is-tbd video{display:none}
/* Five tiles carry a clip that plays on hover and nothing marked them, so the
   feature went untriggered. Sits opposite the badge and gets out of the way the
   moment the clip is actually running. The word is hover-only: on touch the
   observer picks the tile for you, so "HOVER" would be a lie there. */
.gal-play{
  position:absolute;top:0;right:0;z-index:2;
  display:flex;align-items:center;gap:3px;
  font-family:'Tahoma','MS Sans Serif',sans-serif;
  font-size:8px;font-weight:700;letter-spacing:.5px;line-height:1;
  background:rgba(0,0,0,.72);color:#fff;padding:3px 5px;
  border-left:1px solid rgba(255,255,255,.4);border-bottom:1px solid rgba(255,255,255,.4);
  transition:opacity .2s;
}
.gal-play b{display:none;font-weight:700}
@media (hover:hover) and (pointer:fine){ .gal-play b{display:inline} }
.gal-card.is-playing .gal-play{opacity:0}
.gal-badge{
  position:absolute;left:0;bottom:0;z-index:2;max-width:100%;
  font-family:'Arial Black','Impact',sans-serif;font-size:8px;letter-spacing:.4px;
  background:#ffd700;color:#000;padding:2px 5px;
  border-top:1px solid #000;border-right:1px solid #000;
}
.win-app .win-body .gal-name{font-size:11px;font-weight:700;margin:5px 2px 0;line-height:1.25;color:#000;text-decoration:none}
.win-app .win-body .gal-blurb{font-size:10px;line-height:1.35;color:#202020;margin:3px 2px 4px;text-decoration:none}
.win-app .win-body .gal-meta{font-size:9px;color:#454545;font-style:italic;margin:auto 2px 1px;text-decoration:none}
@media (max-width:600px){
  .gal-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;padding:6px}
  .gal-tab{padding:3px 8px 4px;font-size:10px}
  /* the masthead has to stay short here or the first tile never shows on load */
  .gal-id p{font-size:10px;line-height:1.35}
  .gal-id-top{gap:4px}
  /* four links at this width need a tighter column gap than the desktop 12px,
     or the last one wraps to a second line and takes 17px off the top of the
     grid, which here is most of a tile row */
  .gal-links{padding-top:0;gap:1px 8px}
  .win-app .win-body .gal-links a{font-size:10px;gap:3px}
}

  font-family:'Comic Sans MS',cursive;font-size:24px;
}
.win-app.theme-personal h3{color:#00ffff}
.win-app.theme-personal p{margin:8px auto;max-width:90%}
.win-app.theme-personal a{color:#00ffff;font-weight:700}
.win-app.theme-personal .robot-stage{
  position:relative;width:200px;height:200px;margin:0 auto 4px;
}
.win-app.theme-personal .robot-stage::before{
  content:"";position:absolute;inset:6px;border-radius:50%;z-index:0;
  background:radial-gradient(ellipse at 50% 42%,rgba(120,170,255,0.35),rgba(60,90,200,0.12) 55%,transparent 72%);
  pointer-events:none;
}
.win-app.theme-personal .robot-canvas{
  position:relative;z-index:1;display:block;width:100%;height:100%;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,0.45));
}
.win-app.theme-personal .robot-stage::after{
  content:"";position:absolute;left:50%;bottom:10px;width:58%;height:12px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(0,0,0,0.45),transparent 72%);
  filter:blur(3px);pointer-events:none;z-index:0;
}

/* ── THEME: desktop (Overview — My Computer feel, default Win95) ── */
.win-app.theme-desktop .win-body{
  background:#c0c0c0;color:#000;
}
.win-app.theme-desktop h2{color:#000080}
.win-app.theme-desktop .icon-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
  gap:10px;margin-top:8px;padding:8px;
  background:#fff;border:2px inset #808080;
}
.win-app.theme-desktop .ic{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:4px;cursor:pointer;text-align:center;font-size:10px;
  color:#000;text-decoration:none;
}
.win-app.theme-desktop .ic:hover{background:#000080;color:#fff}
.win-app.theme-desktop .ic-award{
  font-size:8px;opacity:.7;line-height:1.2;margin-top:-2px;
}
.win-app.theme-desktop .ic:hover .ic-award{opacity:1}
.win-app.theme-desktop .ic-img{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
}

/* ══ EVIL CHEST ══
   The chest itself has no CSS at all — it is drawn straight onto the sprite
   canvas alongside the birds and the cat, one sim cell per sprite pixel, so
   it lives in the same pixel layer as the world. Only the rogue cursors it
   releases are DOM, because they have to visit real menu rows. */

/* ── rogue cursors ── */
#evilCursors{position:absolute;inset:0;pointer-events:none;z-index:12}
.evil-cursor{
  position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
  transition:opacity .45s;
}
.evil-cursor canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

/* ── material tag: the little tooltip that trails a cursor, shared by the
      rogue cursors and by your own ── */
.mat-tag{
  white-space:nowrap;display:flex;align-items:center;gap:3px;
  font:700 9px 'Tahoma','MS Sans Serif',sans-serif;color:#000;
  background:#ffffe1;border:1px solid #000;padding:1px 3px;
  box-shadow:1px 1px 0 rgba(0,0,0,.45);
}
.mat-tag i{width:7px;height:7px;border:1px solid #000;display:block}
.evil-cursor .mat-tag{position:absolute;left:15px;top:19px}
#userTag{
  position:absolute;left:0;top:0;z-index:12;pointer-events:none;
  opacity:0;transition:opacity .12s;will-change:transform;
}
/* touch: there is no cursor for it to trail, so it never shows */
@media (hover:none),(pointer:coarse){ #userTag{display:none} }
.mat-opt.evil-pick{background:#000080;color:#fff}
.mat-opt.evil-click{background:#b8e000;color:#000}

/* ══ TOUCH + SMALL SCREENS ══
   Two separate axes, deliberately not merged: pointer coarseness decides how
   BIG things need to be (a finger is a finger on a tablet too), viewport width
   decides how much room there is to put them. */

/* ── coarse pointer: grow the hit targets ── */
@media (hover:none),(pointer:coarse){
  /* 15x13px title buttons are untappable. Keep the drawn chrome modest but give
     each button a real finger-sized box. */
  .win-app .win-title .tbtn,
  .win95-title .tbtn{
    width:26px;height:22px;font-size:12px;line-height:12px;padding-bottom:3px;
  }
  .win-app .win-title .tbtns,
  .win95-title .tbtns{gap:4px}
  .win-app .win-title,
  .win95-title{padding:3px 3px 3px 6px;font-size:12px}
  .smenu-item{padding:10px 8px}
  .mat-opt{padding:5px 4px}
  .taskbar-start,.taskbar-btn{height:26px;touch-action:manipulation}
  .win-app .ic{padding:8px 4px}
  /* :hover sticks after a tap on touch, leaving rows stuck highlighted */
  .win-app .ic:hover{background:transparent}
  .win-app.theme-desktop .ic:hover{background:transparent;color:#000}
  .win-app.theme-corporate .ic:hover{background:transparent}
  .taskbar-btn:hover{background:#c0c0c0}
  .taskbar-btn.is-active:hover{background:#a8a8a8}
}

/* ── narrow viewport: fit the furniture ── */
@media (max-width:600px){
  .win-app{
    width:calc(100vw - 12px);
    max-width:calc(100vw - 12px);
    min-width:0;
    /* taskbar is 30px; leave it and a little air clear */
    max-height:calc(100dvh - 88px);
  }
  /* .win-app.theme-gallery outranks the bare .win-app above even in here, so
     the wide desktop gutter has to be handed back explicitly — left alone it
     cost 32px of width, which was enough to drop the grid from two columns to
     one and push all but two tiles off the first screen. */
  .win-app.theme-gallery{
    width:calc(100vw - 12px);
    max-width:calc(100vw - 12px);
    max-height:calc(100vh - 88px);
    max-height:calc(100dvh - 88px);
  }
  /* the fixed 130px floor overflowed the bar at two windows open. Buttons now
     share the space, down to a 44px floor — past that the strip scrolls rather
     than squeezing them into unreadable slivers. */
  .taskbar-btn{min-width:44px;max-width:none;flex:1 1 44px;padding:1px 5px}
  .taskbar-tasks{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain}
  .taskbar-tasks::-webkit-scrollbar{display:none}
  .taskbar-clock{padding:2px 5px}
  .taskbar-sep{margin:0 1px}
  #matPicker{top:8px;right:8px;width:146px}
  /* expanded, the 20-row list would run under the taskbar */
  #matPicker .mat-list{max-height:calc(100dvh - 110px);overflow-y:auto;overscroll-behavior:contain}
  #startMenu{width:min(240px,calc(100vw - 8px))}
  .smenu-sub{width:min(220px,calc(100vw - 12px))}
  /* the hover bridges are dead weight without a hover pointer and only
     get in the way of taps at this width */
  .smenu-item.smenu-cat::before,.smenu-sub::before{display:none}
  #hud{left:6px;right:6px;transform:none;bottom:36px}
  #hud .win95-body{flex-wrap:wrap;justify-content:center;row-gap:4px}
}

/* ── PIXEL SYSTEM ICONS ────────────────────────────────────
   Every icon on the site comes from the #icoSprite symbols:
   overview grid (32px), start menu (20px), titlebars and the
   taskbar (14px). No emoji — the OS rendered those three
   different ways and none of them matched the palette. */
.pxi{
  display:block;flex-shrink:0;width:32px;height:32px;
  shape-rendering:crispEdges;
  --ink:#000;--paper:#ffffff;--face:#c0c0c0;
}
.pxi-sm{width:20px;height:20px}
.pxi-xs{width:14px;height:14px}
.pxi-inline{display:inline-block;vertical-align:-3px;margin-right:5px;width:14px;height:14px}

/* base icon grid — theme rules layer on top of this */
.win-app .icon-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:10px;margin-top:10px;padding:8px;
}
.win-app .ic{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:5px 2px;cursor:pointer;text-align:center;
  font-size:11px;line-height:1.2;text-decoration:none;color:inherit;
}
.win-app .ic-img{
  width:32px;height:32px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.win-app .ic:hover{background:rgba(0,0,0,.08)}
.win-app.theme-corporate .icon-grid{
  background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;
}
.win-app.theme-corporate .ic{font-family:'Verdana',sans-serif}
.win-app.theme-corporate .ic:hover{background:#fffc00}

/* titlebar + taskbar icons */
.win-app .win-title .wt-name{
  display:flex;align-items:center;gap:5px;min-width:0;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.taskbar-btn .tb-ico.tb-ico-px{
  background:none;border:0;width:14px;height:14px;display:flex;
}

/* project bodies are near-black, so the icons' black keylines vanish
   into the background — give them a soft light halo instead, and lift
   the one icon whose dominant surface is navy. */
.win-app.theme-project .pxi{filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}
.win-app.theme-project use[href="#ico-floppy"]{--accent:#3454d8}
</style>
</head>
<body>

<div id="stage">

    <div id="resume"></div>

    <div id="evilCursors"></div>
    <div id="userTag" class="mat-tag"><i></i><b>sand</b></div>

    <div id="windowsLayer"></div>

    <div id="startMenu" style="display:none">
      <div class="smenu-side">Mitchell K<span></span></div>
      <div class="smenu-body" id="startMenuBody"></div>
    </div>

    <div id="freezeRing"></div>
    <div id="brushRing"></div>
    <div id="stats"></div>

    <div id="taskbar">
      <div class="taskbar-start"><svg class="pxi pxi-xs ts-logo" aria-hidden="true"><use href="#ico-cat"/></svg>Mitchell Kuppersmith</div>
      <div class="taskbar-sep"></div>
      <div class="taskbar-tasks" id="taskbarTasks"></div>
      <div class="taskbar-clock" id="taskbarClock">--:--</div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   SETUP
═══════════════════════════════════════════════════════ */
const canvas = document.getElementById('simCanvas');
// opaque context: the shader paints every pixel (sky included), so skipping
// page-compositing alpha blending is free performance
const gl = canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){document.body.innerHTML='<p style="color:#e05a1a;padding:2rem;font-family:monospace">WebGL2 required. Open in Chrome or Firefox.</p>';throw 0;}

// material ids
const EMPTY=0,SAND=1,WATER=2,FIRE=3,STONE=4,PLANT=5,ACID=6,OIL=7,SMOKE=8,ASH=9,
      TITLE=10,ACCENT=11,BODY=12,RIGID=13,
      POLLEN=14,MOSS=15,SEED=16,DIRT=17,GRASS=18,
      MASK=19, // invisible solid — stamped under HTML content so particles collide with it
      // ─── authored-sprite materials ───
      // Stamped as part of a sprite with frozen[i]=1 so the shape holds.
      // Decomposes back into the sim when fire/acid touches the cell, its
      // support vanishes, or something heavy lands on it.
      WOOD=20,LEAF=21,BRICK=22,THATCH=23,BERRY=24,GLASS=25,
      BIRD=26, // agent, not a grid cell — boids flock above the meadow
      // Drawable reactive cord and charge. FUSE crawls cell-to-cell once any
      // adjacent fire / lit fuse touches it. BOMB sizzles a few frames after
      // ignition then radial-blasts. variant bit 0x80 = "lit"; for BOMB bits
      // 4–6 carry the fuse-in countdown.
      FUSE=27,BOMB=28,
      // Thermal pair. LAVA is the heat source everything else answers to;
      // STEAM is the exhaust that carries the water back up to the sky.
      STEAM=29,LAVA=30;
const BOUND=255;
const isDebris=m=>m===WOOD||m===LEAF||m===BRICK||m===THATCH||m===BERRY||m===GLASS;
const isFlamSprite=m=>m===WOOD||m===LEAF||m===THATCH||m===BERRY;

let W,H,SCALE;
function computeDims(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const CELL_BUDGET=1300000;
  // Sprites are authored in cells, so a fixed SCALE pins their on-screen size
  // (the oak is 21x24 cells = 84x96px) no matter how big the window is — extra
  // width lands as bare meadow and the composition pulls apart. Growing SCALE
  // with the viewport keeps the grid near a constant cell count, so the scene
  // holds its proportions and simply zooms in.
  //
  // Drive it off the geometric mean of both axes, not width alone: a single
  // uniform SCALE cannot hold the sprites' share of the width AND their share
  // of the height fixed while the aspect ratio changes, so sizing on vw alone
  // makes wide-but-short viewports crush H and leave the trees looming. The
  // mean splits that error evenly between the two axes.
  //
  // TARGET_SPAN is calibrated so a 1920x1000 viewport lands on SCALE=4, which
  // is also the floor — it reads as deliberate pixel-art chunk size, and going
  // finer would make the sprites too small to read.
  const TARGET_SPAN=346;
  let s=Math.max(4,Math.round(Math.sqrt(vw*vh)/TARGET_SPAN));
  while((vw/s)*(vh/s)>CELL_BUDGET&&s<9)s++;
  const nW=Math.floor(vw/s),nH=Math.floor(vh/s);
  // Nothing to do if the grid lands on the same dimensions — assigning
  // canvas.width alone clears the canvas, and the caller would needlessly
  // reallocate and re-roll the whole scene for a few pixels of drag.
  if(s===SCALE&&nW===W&&nH===H)return false;
  SCALE=s;W=nW;H=nH;
  canvas.width=W;canvas.height=H;
  const bc=document.getElementById('birdCanvas');
  if(bc){bc.width=W;bc.height=H;}
  // Deliberately no inline CSS size: #simCanvas/#birdCanvas are width:100%
  // height:100% over #stage, so the element tracks the viewport every frame of
  // a drag. Pinning it to a px size here would freeze it at the pre-drag size
  // until the debounce fires. The backing store lags until then and the browser
  // nearest-neighbour-scales it (image-rendering:pixelated), so the world
  // stretches with the window and resolves on release instead of jumping.
  return true;
}
computeDims();

let grid,variant,frozen,updated,inChunk,maskOwner;
function allocArrays(){
  grid=new Uint8Array(W*H);
  variant=new Uint8Array(W*H);
  frozen=new Uint8Array(W*H);
  updated=new Int32Array(W*H); // last frame this cell was written
  inChunk=new Uint8Array(W*H); // cell belongs to a falling masonry chunk
  maskOwner=new Int16Array(W*H); // MASK cell → burnable DOM element id (0 = none)
}
allocArrays();

const idx=(x,y)=>y*W+x;
const mat=(x,y)=>(x<0||x>=W||y<0||y>=H)?BOUND:grid[idx(x,y)];
const isLiq=m=>m===WATER||m===OIL||m===ACID;
// Liquid densities. A heavier liquid sitting on a lighter one sinks through it,
// so oil poured into a pond rises into a slick instead of mixing — and that
// slick is what carries fire across open water.
const LDEN=new Uint8Array(256);
LDEN[OIL]=1;LDEN[ACID]=2;LDEN[WATER]=3;
const isStatic=m=>m===STONE||m===TITLE||m===ACCENT||m===BODY||m===RIGID||m===DIRT||m===GRASS||m===MASK;

/* ═══════════════════════════════════════════════════════
   CHUNK DIRTY-RECTANGLES (Noita-style)
   Each chunk tracks a bounding box of cells that need work.
   Sleeping chunks (empty rect) are skipped entirely.
═══════════════════════════════════════════════════════ */
const CW=32; // chunk size in sim cells
let ncx,ncy;
// current frame's work rects + next frame's accumulating rects
let dcMinX,dcMinY,dcMaxX,dcMaxY,dnMinX,dnMinY,dnMaxX,dnMaxY;
// render-dirty bboxes per chunk (cells whose pixels changed since last upload)
let rcMinX,rcMinY,rcMaxX,rcMaxY;
const BIG=1e9;
// Cells whose pixels changed since the last light pass. render() folds each
// dirty chunk's rect in here as it uploads (4 compares per chunk, not per
// cell), and buildLight consumes it — see the scan region there.
let edX0=BIG,edY0=BIG,edX1=-1,edY1=-1;

function allocChunks(){
  ncx=Math.ceil(W/CW);ncy=Math.ceil(H/CW);
  const n=ncx*ncy;
  dcMinX=new Int32Array(n);dcMinY=new Int32Array(n);dcMaxX=new Int32Array(n);dcMaxY=new Int32Array(n);
  dnMinX=new Int32Array(n);dnMinY=new Int32Array(n);dnMaxX=new Int32Array(n);dnMaxY=new Int32Array(n);
  rcMinX=new Int32Array(n);rcMinY=new Int32Array(n);rcMaxX=new Int32Array(n);rcMaxY=new Int32Array(n);
  for(let i=0;i<n;i++){
    dcMinX[i]=BIG;dcMinY[i]=BIG;dcMaxX[i]=-1;dcMaxY[i]=-1;
    rcMinX[i]=BIG;rcMinY[i]=BIG;rcMaxX[i]=-1;rcMaxY[i]=-1;
  }
  clearNext();
}
function clearNext(){
  for(let i=0;i<dnMinX.length;i++){dnMinX[i]=BIG;dnMinY[i]=BIG;dnMaxX[i]=-1;dnMaxY[i]=-1;}
}

// wake a single cell for NEXT frame's simulation pass (no pixel side-effect)
function wake(x,y){
  if(x<0||x>=W||y<0||y>=H)return;
  const c=((y/CW)|0)*ncx+((x/CW)|0);
  if(x<dnMinX[c])dnMinX[c]=x; if(y<dnMinY[c])dnMinY[c]=y;
  if(x>dnMaxX[c])dnMaxX[c]=x; if(y>dnMaxY[c])dnMaxY[c]=y;
}
// wake a 3x3 neighbourhood (used around any changed cell)
function wake3(x,y){
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)wake(x+dx,y+dy);
}
// wake a whole region for sim (used for spawn, resize, hover release, emitters)
function wakeRect(x0,y0,x1,y1){
  if(x0<0)x0=0;if(y0<0)y0=0;if(x1>=W)x1=W-1;if(y1>=H)y1=H-1;
  if(x1<x0||y1<y0)return;
  const cx0=(x0/CW)|0,cx1=(x1/CW)|0,cy0=(y0/CW)|0,cy1=(y1/CW)|0;
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){
    const c=cy*ncx+cx;
    const rx0=Math.max(x0,cx*CW),rx1=Math.min(x1,cx*CW+CW-1);
    const ry0=Math.max(y0,cy*CW),ry1=Math.min(y1,cy*CW+CW-1);
    if(rx0<dnMinX[c])dnMinX[c]=rx0; if(ry0<dnMinY[c])dnMinY[c]=ry0;
    if(rx1>dnMaxX[c])dnMaxX[c]=rx1; if(ry1>dnMaxY[c])dnMaxY[c]=ry1;
  }
}
// mark a single cell's pixel as needing re-upload
function pixDirty(x,y){
  if(x<0||x>=W||y<0||y>=H)return;
  const c=((y/CW)|0)*ncx+((x/CW)|0);
  if(x<rcMinX[c])rcMinX[c]=x; if(y<rcMinY[c])rcMinY[c]=y;
  if(x>rcMaxX[c])rcMaxX[c]=x; if(y>rcMaxY[c])rcMaxY[c]=y;
}
// mark a rectangle of pixels as needing re-upload
function pixDirtyRect(x0,y0,x1,y1){
  if(x0<0)x0=0;if(y0<0)y0=0;if(x1>=W)x1=W-1;if(y1>=H)y1=H-1;
  if(x1<x0||y1<y0)return;
  const cx0=(x0/CW)|0,cx1=(x1/CW)|0,cy0=(y0/CW)|0,cy1=(y1/CW)|0;
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){
    const c=cy*ncx+cx;
    const rx0=Math.max(x0,cx*CW),rx1=Math.min(x1,cx*CW+CW-1);
    const ry0=Math.max(y0,cy*CW),ry1=Math.min(y1,cy*CW+CW-1);
    if(rx0<rcMinX[c])rcMinX[c]=rx0; if(ry0<rcMinY[c])rcMinY[c]=ry0;
    if(rx1>rcMaxX[c])rcMaxX[c]=rx1; if(ry1>rcMaxY[c])rcMaxY[c]=ry1;
  }
}
allocChunks();

/* ═══════════════════════════════════════════════════════
   SIMULATION (in-place)
═══════════════════════════════════════════════════════ */
let simSpeed=2;
let frameId=1;
let stepDir=1;

/* ═══ NEIGHBOUR OFFSET TABLES ═══
   The material rules below scan their four neighbours constantly, and they used
   to do it over a fresh [[0,-1],[1,0],...] literal — five objects allocated per
   cell per sim step. Flat typed arrays measure ~8x faster over the same scan
   (0.24ms vs 1.98ms per 20k cells) and drop the garbage entirely.

   ORDER IS LOAD-BEARING. Several of these loops break or return on the first
   hit, and several draw a Math.random() per entry, so reordering a table
   changes what the simulation does — not just how fast it does it. Each table
   below lists its directions in the exact order the literal it replaced did.

   Tables used with the step direction `d` multiply only the x component: the
   x values are always 0/±1, so `NX[k]*d` reproduces the [d,0]/[-d,0] pairs. */
const NX_URLD=new Int8Array([0,1,-1,0]), NY_URLD=new Int8Array([-1,0,0,1]); // up, right, left, down
const NX_UDLR=new Int8Array([0,0,-1,1]), NY_UDLR=new Int8Array([-1,1,0,0]); // up, down, left, right
const NY_DXXU=new Int8Array([1,0,0,-1]);                 // down, d, -d, up   (x = NX_URLD*d)
const NX_DXX =new Int8Array([0,1,-1]),  NY_DXX =new Int8Array([1,0,0]);      // down, d, -d
const NX_DISP=new Int8Array([0,-1,1,-1,1,0]), NY_DISP=new Int8Array([-1,-1,-1,0,0,-2]);

// movement target tests (exclude frozen so hover-freeze pins matter)
function eFree(x,y){return x>=0&&x<W&&y>=0&&y<H&&grid[idx(x,y)]===EMPTY&&!frozen[idx(x,y)];}
function lFree(x,y){if(x<0||x>=W||y<0||y>=H)return false;const i=idx(x,y);return !frozen[i]&&isLiq(grid[i]);}

function moveSwap(x,y,nx,ny){
  const i=idx(x,y),j=idx(nx,ny);
  const gm=grid[j],gv=variant[j];
  grid[j]=grid[i];variant[j]=variant[i];
  grid[i]=gm;variant[i]=gv;
  updated[i]=frameId;updated[j]=frameId;
  wake3(x,y);wake3(nx,ny);
  pixDirty(x,y);pixDirty(nx,ny);
}
function setMat(x,y,m,v){
  if(x<0||x>=W||y<0||y>=H)return;
  const i=idx(x,y);
  grid[i]=m;variant[i]=(v===undefined?(Math.random()*8|0):v);
  updated[i]=frameId;wake3(x,y);pixDirty(x,y);
}

// A frozen sprite cell wakes when: fire/acid touches it, an upper neighbour
// just shed support, or all of its potential supports below have vanished.
// Once unfrozen it falls through the normal debris path below.
function tryDecompose(x,y,i,m){
  // returns 0 = stay frozen, 1 = fire/acid attack, 2 = lost support
  const up=mat(x,y-1),dn=mat(x,y+1),lf=mat(x-1,y),rt=mat(x+1,y);
  if(up===ACID||dn===ACID||lf===ACID||rt===ACID)return 1;
  if((isFlamSprite(m)||m===GLASS)&&(up===FIRE||dn===FIRE||lf===FIRE||rt===FIRE))return 1;
  // support: a frozen neighbour, terrain, or the floor underneath us is enough
  if(y+1>=H)return 0;
  const bi=idx(x,y+1),bm=grid[bi];
  if(frozen[bi]||isStatic(bm)||bm===STONE||bm===DIRT||bm===GRASS)return 0;
  // diagonal frozen support — pixel arches still hold
  if(x>0&&frozen[idx(x-1,y+1)])return 0;
  if(x+1<W&&frozen[idx(x+1,y+1)])return 0;
  return 2;
}

/* ═══ MASONRY CHUNKS ═══
   When structural material (BRICK/WOOD) loses support, the connected frozen
   region either (a) stays standing because some member is still grounded, or
   (b) detaches and falls as ONE coherent chunk — cells move together, the
   baked masonry pattern stays intact, and the chunk refreezes on landing.
   Hard landings crumble the impact row into loose debris. */
const chunks=[];
const CHUNK_MAX=2600;
const isChunkMat=m=>m===BRICK||m===WOOD;
function tryChunkDetach(sx,sy){
  const start=idx(sx,sy);
  const seen=new Set([start]);
  const stack=[start],cells=[];
  while(stack.length){
    const i=stack.pop();cells.push(i);
    if(cells.length>CHUNK_MAX)return false;      // huge region → legacy crumble
    const x=i%W,y=(i/W)|0;
    // grounded through any member? then the whole region stands
    if(y+1>=H)return true;
    const bi=i+W,bm=grid[bi];
    if(!seen.has(bi)&&!inChunk[bi]){
      if(isStatic(bm)||bm===STONE||bm===DIRT||bm===GRASS)return true;
      if(frozen[bi]&&!isChunkMat(bm))return true; // resting on a frozen sprite
    }
    if(x>0){const ni=i-1;if(!seen.has(ni)&&!inChunk[ni]&&frozen[ni]&&isChunkMat(grid[ni])){seen.add(ni);stack.push(ni);}}
    if(x+1<W){const ni=i+1;if(!seen.has(ni)&&!inChunk[ni]&&frozen[ni]&&isChunkMat(grid[ni])){seen.add(ni);stack.push(ni);}}
    if(y>0){const ni=i-W;if(!seen.has(ni)&&!inChunk[ni]&&frozen[ni]&&isChunkMat(grid[ni])){seen.add(ni);stack.push(ni);}}
    if(y+1<H){const ni=i+W;if(!seen.has(ni)&&!inChunk[ni]&&frozen[ni]&&isChunkMat(grid[ni])){seen.add(ni);stack.push(ni);}}
  }
  // truly orphaned: detach as a falling chunk, lowest cells first
  cells.sort((a,b)=>b-a);
  for(const i of cells)inChunk[i]=1;
  chunks.push({cells,set:seen,vy:0,acc:0});
  return true;
}
function updateChunks(){
  for(let k=chunks.length-1;k>=0;k--){
    const ch=chunks[k];
    // drop members that were burned/dissolved/erased while falling
    if(ch.cells.some(i=>!frozen[i]||!isChunkMat(grid[i]))){
      ch.cells=ch.cells.filter(i=>{
        if(frozen[i]&&isChunkMat(grid[i]))return true;
        ch.set.delete(i);inChunk[i]=0;return false;});
      if(!ch.cells.length){chunks.splice(k,1);continue;}
    }
    ch.vy=Math.min(ch.vy+0.18,3);ch.acc+=ch.vy;
    let steps=ch.acc|0;ch.acc-=steps;
    let landed=false;
    while(steps-->0&&!landed){
      let ok=true;
      for(const i of ch.cells){
        const bi=i+W;
        if(((i/W)|0)+1>=H||(grid[bi]!==EMPTY&&!ch.set.has(bi))){ok=false;break;}
      }
      if(!ok){landed=true;break;}
      // shift every cell down one row (cells sorted bottom-first)
      for(let n=0;n<ch.cells.length;n++){
        const i=ch.cells[n],bi=i+W;
        grid[bi]=grid[i];variant[bi]=variant[i];frozen[bi]=1;inChunk[bi]=1;
        grid[i]=EMPTY;variant[i]=0;frozen[i]=0;inChunk[i]=0;
        const x=i%W,y=(i/W)|0;
        pixDirty(x,y);pixDirty(x,y+1);wake3(x,y);
        ch.cells[n]=bi;
      }
      ch.set=new Set(ch.cells);
    }
    if(landed){
      const hard=ch.vy>1.3;
      for(const i of ch.cells){
        inChunk[i]=0;
        const x=i%W,y=(i/W)|0;
        // hard impact: contact-row cells shake loose as debris
        if(hard&&(y+1>=H||(grid[i+W]!==EMPTY&&!ch.set.has(i+W)))&&Math.random()<0.55){
          frozen[i]=0;
        }
        wake3(x,y);pixDirty(x,y);
      }
      chunks.splice(k,1);
    }
  }
}

function step(x,y){
  const i=idx(x,y);
  if(updated[i]===frameId)return;
  const m=grid[i];
  if(frozen[i]){
    if(inChunk[i])return;                 // a falling chunk owns this cell
    const why=isDebris(m)?tryDecompose(x,y,i,m):0;
    if(why===0)return;
    // support loss on structural material → try to detach the whole
    // connected region as one coherent chunk (or discover it's actually
    // held up elsewhere and leave it standing)
    if(why===2&&(m===BRICK||m===WOOD)&&tryChunkDetach(x,y))return;
    frozen[i]=0;
    wake3(x,y);pixDirty(x,y);
    // fall through into the falling-debris path below
  }
  if(m===EMPTY||isStatic(m))return;
  const d=stepDir;

  if(m===SAND||m===ASH){
    const thru=(m===SAND); // sand sinks through liquids, ash rests on them
    // free-fall double-step: when two cells of clear air are below, drop 2 —
    // grains read as accelerating instead of drifting down one cell per tick
    if(eFree(x,y+1)&&eFree(x,y+2)){moveSwap(x,y,x,y+2);return;}
    if(eFree(x,y+1)||(thru&&lFree(x,y+1))){moveSwap(x,y,x,y+1);return;}
    if(eFree(x+d,y+1)||(thru&&lFree(x+d,y+1))){moveSwap(x,y,x+d,y+1);return;}
    if(eFree(x-d,y+1)||(thru&&lFree(x-d,y+1))){moveSwap(x,y,x-d,y+1);return;}
    // settled ash slaked by water becomes fertile topsoil: burn a meadow down,
    // let the rain in, and the ground is ready to take seed again
    if(m===ASH){
      for(let k=0;k<4;k++){
        const ax=NX_URLD[k],ay=NY_URLD[k];
        if(mat(x+ax,y+ay)===WATER&&Math.random()<0.09){
          setMat(x+ax,y+ay,EMPTY);setMat(x,y,DIRT);return;
        }
      }
    }
    // settled, but if we're piling on top of a fragile frozen sprite cell,
    // sometimes shake it loose — pixel art crumbles under weight.
    if(y+1<H){
      const bi=idx(x,y+1);
      if(frozen[bi]){
        const bm=grid[bi];
        if((bm===LEAF||bm===THATCH||bm===BERRY)&&Math.random()<0.06){
          frozen[bi]=0;wake3(x,y+1);pixDirty(x,y+1);
        } else if(bm===GLASS&&Math.random()<0.04){
          frozen[bi]=0;wake3(x,y+1);pixDirty(x,y+1); // glass gives out under a pile
        }
      }
    }
    return; // settled → sleeps
  }

  // ─── sprite debris: behaves like sand once unfrozen, but each kind has its
  // own personality. WOOD and BRICK pile heavily; LEAF/THATCH drift down;
  // BERRY rolls easily; GLASS shatters into smaller motion than it falls.
  if(isDebris(m)){
    const light=(m===LEAF||m===THATCH);
    // light materials skip a third of frames so they look like they flutter
    if(light&&Math.random()<0.35){updated[i]=frameId;wake3(x,y);return;}
    // heavy debris free-falls two cells through clear air, like sand
    if(!light&&eFree(x,y+1)&&eFree(x,y+2)){moveSwap(x,y,x,y+2);return;}
    if(eFree(x,y+1)||lFree(x,y+1)){moveSwap(x,y,x,y+1);return;}
    if(eFree(x+d,y+1)||lFree(x+d,y+1)){moveSwap(x,y,x+d,y+1);return;}
    if(eFree(x-d,y+1)||lFree(x-d,y+1)){moveSwap(x,y,x-d,y+1);return;}
    // leaves drift sideways when blocked
    if(light){
      if(eFree(x+d,y)&&Math.random()<0.18){moveSwap(x,y,x+d,y);return;}
    }
    // catch fire from a neighbour
    if(isFlamSprite(m)){
      const burn=m===THATCH?0.28:m===LEAF?0.18:m===BERRY?0.12:0.05; // WOOD smolders
      for(let k=0;k<4;k++){
        const ax=NX_URLD[k],ay=NY_URLD[k];
        if(mat(x+ax,y+ay)===FIRE&&Math.random()<burn){setMat(x,y,FIRE);return;}
      }
    }
    return;
  }

  if(m===WATER||m===OIL||m===ACID){
    if(m===ACID){
      // dissolve structural/granular neighbours (the baked title text is
      // acid-proof for readability; the HTML windows are not)
      // down, d, -d, up
      // ...but water dilutes it. Enough rain on a pool and the acid fizzes out
      // into plain water, so flooding is a real answer to a spill.
      for(let k=0;k<4;k++){
        const ax=NX_URLD[k]*d,ay=NY_DXXU[k];
        if(mat(x+ax,y+ay)===WATER&&Math.random()<0.025){
          if(eFree(x,y-1)&&Math.random()<0.35)setMat(x,y-1,SMOKE);
          setMat(x,y,WATER);return;
        }
      }
      for(let k=0;k<4;k++){
        const ax=NX_URLD[k]*d,ay=NY_DXXU[k];
        const t=mat(x+ax,y+ay);
        // the page itself is not immune: a MASK cell belonging to a window
        // etches away and the hole opens in the real HTML behind it
        if(t===MASK&&Math.random()<0.16&&burnMask(x+ax,y+ay,1)){
          if(eFree(x,y-1)&&Math.random()<0.3)setMat(x,y-1,SMOKE);
          if(Math.random()<0.45){setMat(x,y,EMPTY);return;} // spent on the way through
          break;
        }
        if((t===STONE||t===SAND||t===PLANT||t===ASH||t===MOSS||t===SEED||t===DIRT||t===GRASS||t===WOOD||t===LEAF||t===THATCH||t===BERRY||t===BRICK||t===GLASS)&&Math.random()<0.10){
          setMat(x+ax,y+ay,EMPTY);
          if(Math.random()<0.4){setMat(x,y,EMPTY);return;}
          break;
        }
      }
    }
    if(eFree(x,y+1)){
      if(eFree(x,y+2)){moveSwap(x,y,x,y+2);return;} // free-fall double-step
      moveSwap(x,y,x,y+1);return;
    }
    if(eFree(x+d,y+1)){moveSwap(x,y,x+d,y+1);return;}
    if(eFree(x-d,y+1)){moveSwap(x,y,x-d,y+1);return;}
    // no air below, but a *lighter* liquid is: trade places. Water dropped into
    // an oil pool sinks and the oil beads up on top.
    if(y+1<H){
      const bi=i+W,bd=LDEN[grid[bi]];
      if(bd&&bd<LDEN[m]&&!frozen[bi]&&Math.random()<0.6){moveSwap(x,y,x,y+1);return;}
    }
    // horizontal dispersion: slide up to `disp` cells along the surface in one
    // tick, stopping early at the first ledge to spill over. Pools flatten in
    // a few frames instead of creeping one cell per tick, so liquids read as
    // fluid rather than viscous. Oil stays deliberately sluggish.
    const disp=(m===OIL)?2:5;
    let run=0;
    for(let k=1;k<=disp;k++){
      if(!eFree(x+k*d,y))break;
      run=k;
      if(eFree(x+k*d,y+1))break; // found a drop — go there and fall next tick
    }
    if(run){moveSwap(x,y,x+run*d,y);return;}
    for(let k=1;k<=disp;k++){
      if(!eFree(x-k*d,y))break;
      run=k;
      if(eFree(x-k*d,y+1))break;
    }
    if(run){moveSwap(x,y,x-run*d,y);return;}
    return; // settled
  }

  if(m===FIRE){
    // burning out leaves a residue as often as not — that ash is what the
    // water cycle later turns back into soil
    if(Math.random()<0.03){setMat(x,y,Math.random()<0.3?ASH:SMOKE);return;}
    for(let k=0;k<4;k++){
      const ax=NX_URLD[k],ay=NY_URLD[k];
      const t=mat(x+ax,y+ay);
      if((t===PLANT||t===MOSS||t===SEED||t===LEAF||t===THATCH||t===BERRY)&&Math.random()<0.18)setMat(x+ax,y+ay,FIRE);
      else if(t===WOOD&&Math.random()<0.05)setMat(x+ax,y+ay,FIRE);
      else if(t===OIL&&Math.random()<0.20)setMat(x+ax,y+ay,FIRE);
      else if(t===POLLEN&&Math.random()<0.55)setMat(x+ax,y+ay,FIRE); // dust flares
      else if(t===GRASS&&Math.random()<0.035)setMat(x+ax,y+ay,FIRE); // turf carries a fire line
      else if(t===MASK&&Math.random()<0.12)burnMask(x+ax,y+ay,0);    // paper burns: the HTML catches
      else if(t===SAND&&Math.random()<0.04){
        // sustained heat fuses sand into glass — and glass is what glows once
        // the sun goes down, so a beach bonfire leaves you a lantern
        setMat(x+ax,y+ay,GLASS,Math.random()*4|0);
        frozen[idx(x+ax,y+ay)]=1;
      }
      else if(t===WATER&&Math.random()<0.06){setMat(x+ax,y+ay,STEAM);setMat(x,y,STEAM);return;}
    }
    if(eFree(x,y-1)&&Math.random()<0.4){moveSwap(x,y,x,y-1);return;}
    updated[i]=frameId;wake3(x,y);pixDirty(x,y);return; // keep flickering & awake
  }

  if(m===SMOKE){
    if(Math.random()<0.02){setMat(x,y,EMPTY);return;}
    if(eFree(x,y-1)){moveSwap(x,y,x,y-1);return;}
    if(eFree(x+d,y-1)){moveSwap(x,y,x+d,y-1);return;}
    if(eFree(x-d,y-1)){moveSwap(x,y,x-d,y-1);return;}
    if(eFree(x+d,y)){moveSwap(x,y,x+d,y);return;}
    updated[i]=frameId;wake3(x,y);return;
  }

  if(m===STEAM){
    // the return leg of the water cycle: rises faster than smoke, smothers
    // flame on the way past, beads back into water against a ceiling, and
    // rains out once it reaches the top of the sky
    if(y<=2&&Math.random()<0.06){setMat(x,y,WATER);return;}
    for(let k=0;k<4;k++){ // up, d, -d, down
      const ax=NX_URLD[k]*d,ay=NY_URLD[k];
      if(mat(x+ax,y+ay)===FIRE&&Math.random()<0.09){setMat(x+ax,y+ay,SMOKE);setMat(x,y,EMPTY);return;}
    }
    if(Math.random()<0.006){setMat(x,y,WATER);return;}   // condenses mid-air
    if(Math.random()<0.010){setMat(x,y,EMPTY);return;}   // or just thins away
    if(eFree(x,y-1)){
      if(eFree(x,y-2)&&Math.random()<0.6){moveSwap(x,y,x,y-2);return;}
      moveSwap(x,y,x,y-1);return;
    }
    if(eFree(x+d,y-1)){moveSwap(x,y,x+d,y-1);return;}
    if(eFree(x-d,y-1)){moveSwap(x,y,x-d,y-1);return;}
    if(eFree(x+d,y)){moveSwap(x,y,x+d,y);return;}
    // trapped under something solid — beads into a droplet on the underside
    if(Math.random()<0.04){setMat(x,y,WATER);return;}
    updated[i]=frameId;wake3(x,y);return;
  }

  if(m===LAVA){
    // molten rock. It is the heat source the rest of the palette answers to:
    // it lights anything flammable, fuses sand to glass, and freezes into
    // stone the instant water reaches it — so water is the only real brake.
    for(let k=0;k<4;k++){
      const ax=NX_URLD[k],ay=NY_URLD[k];
      const nx=x+ax,ny=y+ay,t=mat(nx,ny);
      if(t===BOUND)continue;
      if(t===WATER){
        // quench: flash to steam, and the lava mostly crusts over into rock
        setMat(nx,ny,STEAM);
        if(Math.random()<0.6){setMat(x,y,STONE);return;}
      }
      else if(t===SAND&&Math.random()<0.12){
        setMat(nx,ny,GLASS,Math.random()*4|0);frozen[idx(nx,ny)]=1;
      }
      else if((t===PLANT||t===MOSS||t===SEED||t===GRASS||t===POLLEN||t===OIL||
               t===LEAF||t===THATCH||t===BERRY||t===WOOD||t===FUSE)&&Math.random()<0.45){
        setMat(nx,ny,FIRE);
      }
      else if(t===ACID&&Math.random()<0.35){setMat(nx,ny,SMOKE);}
      else if(t===MASK&&Math.random()<0.16){burnMask(nx,ny,2);} // molten rock melts straight through a window
    }
    // flames and fumes lick off the surface
    if(mat(x,y-1)===EMPTY&&Math.random()<0.05)setMat(x,y-1,Math.random()<0.55?FIRE:SMOKE);
    // viscous: it only advances on some ticks, so it creeps rather than pours
    if(Math.random()<0.55){updated[i]=frameId;wake3(x,y);pixDirty(x,y);return;}
    if(eFree(x,y+1)){moveSwap(x,y,x,y+1);return;}
    if(eFree(x+d,y+1)){moveSwap(x,y,x+d,y+1);return;}
    if(eFree(x-d,y+1)){moveSwap(x,y,x-d,y+1);return;}
    if(eFree(x+d,y)&&Math.random()<0.45){moveSwap(x,y,x+d,y);return;}
    // gone nowhere for a while: the flow crusts over on its own
    if(Math.random()<0.0018){setMat(x,y,STONE);return;}
    updated[i]=frameId;wake3(x,y);pixDirty(x,y);return;
  }

  if(m===PLANT){
    // roots drink: a plant with water beside it climbs an order of magnitude
    // faster and pulls the puddle down as it goes
    let drink=false;
    if(Math.random()<0.025){
      for(let k=0;k<3;k++){ // down, d, -d
        const ax=NX_DXX[k]*d,ay=NY_DXX[k];
        if(mat(x+ax,y+ay)===WATER){setMat(x+ax,y+ay,EMPTY);drink=true;break;}
      }
    }
    if(drink||Math.random()<0.004){
      const k=Math.random()*4|0, ax=NX_URLD[k], ay=NY_URLD[k];
      const t=mat(x+ax,y+ay);
      if(t===EMPTY||t===WATER||(t===GRASS&&Math.random()<0.25))setMat(x+ax,y+ay,PLANT);
      // bare soil next to living roots greens back over — this is how a burnt
      // meadow eventually turns back into turf
      else if(t===DIRT&&Math.random()<0.35)setMat(x+ax,y+ay,GRASS);
    }
    // a thicket dense enough to shade itself sets fruit; birds do the rest
    if(Math.random()<0.0008){
      let n=0;
      for(let k=0;k<4;k++)if(mat(x+NX_URLD[k],y+NY_URLD[k])===PLANT)n++;
      if(n>=3){setMat(x,y,BERRY,Math.random()*4|0);return;}
    }
    updated[i]=frameId;wake3(x,y);return; // stays awake to keep growing
  }

  if(m===POLLEN){
    // drifting motes: rise slowly with a sideways wander, fade over time,
    // and occasionally pollinate plant/moss into a fresh sprout
    if(Math.random()<0.006){setMat(x,y,EMPTY);return;}
    for(let k=0;k<4;k++){ // up, d, -d, down
      const ax=NX_URLD[k]*d,ay=NY_URLD[k];
      const t=mat(x+ax,y+ay);
      if((t===PLANT||t===MOSS)&&Math.random()<0.004){
        if(eFree(x,y-1))setMat(x,y-1,SEED);
        setMat(x,y,EMPTY);return;
      }
    }
    if(Math.random()<0.6&&eFree(x,y-1)){moveSwap(x,y,x,y-1);return;}
    if(eFree(x+d,y-1)){moveSwap(x,y,x+d,y-1);return;}
    if(eFree(x+d,y)){moveSwap(x,y,x+d,y);return;}
    if(eFree(x-d,y)){moveSwap(x,y,x-d,y);return;}
    updated[i]=frameId;wake3(x,y);return; // hang in the air, stay awake
  }

  if(m===MOSS){
    // nature reclaiming the structure: creeps slowly over adjacent stone —
    // but damp moss is a different animal. Water or steam next to it and the
    // creep goes five times as fast, takes hold on burnt ground, and starts
    // pushing real greenery up into the air.
    if(Math.random()<0.06){
      let damp=false;
      for(let k=0;k<4;k++){
        const t=mat(x+NX_URLD[k],y+NY_URLD[k]);
        if(t===WATER||t===STEAM){damp=true;break;}
      }
      if(damp||Math.random()<0.2){
        const k=Math.random()*4|0, ax=NX_URLD[k], ay=NY_URLD[k];
        const t=mat(x+ax,y+ay);
        if(t===STONE&&Math.random()<0.5)setMat(x+ax,y+ay,MOSS);
        else if(t===DIRT&&Math.random()<(damp?0.45:0.08))setMat(x+ax,y+ay,MOSS);
        else if(damp&&(t===ASH||t===SAND)&&Math.random()<0.10)setMat(x+ax,y+ay,MOSS);
        else if(damp&&ay===-1&&t===EMPTY&&Math.random()<0.06)setMat(x,y-1,PLANT);
      }
    }
    updated[i]=frameId;wake3(x,y);return;
  }

  if(m===SEED){
    // falls like a grain, then sprouts into a plant on fertile ground
    if(eFree(x,y+1)&&eFree(x,y+2)){moveSwap(x,y,x,y+2);return;}
    if(eFree(x,y+1)||lFree(x,y+1)){moveSwap(x,y,x,y+1);return;}
    if(eFree(x+d,y+1)){moveSwap(x,y,x+d,y+1);return;}
    if(eFree(x-d,y+1)){moveSwap(x,y,x-d,y+1);return;}
    const below=mat(x,y+1);
    if(below===STONE||below===SAND||below===MOSS||below===PLANT||below===DIRT||below===GRASS||below===ASH){
      // germination is slow on dry ground and near-instant on wet — watering a
      // scatter of seed is the fastest way to turn bare dirt into a thicket
      let wet=false;
      for(let k=0;k<4;k++){
        const t=mat(x+NX_URLD[k],y+NY_URLD[k]);
        if(t===WATER||t===STEAM){wet=true;break;}
      }
      if(Math.random()<(wet?0.35:0.02)){setMat(x,y,PLANT);return;}
      updated[i]=frameId;wake3(x,y);return; // keep trying until it takes
    }
    return; // settled on barren ground → sleeps
  }

  if(m===FUSE){
    // bit 0x80 = lit. Unlit cells wait for fire/lit-fuse to touch them.
    if(!(variant[i]&0x80)){
      for(let k=0;k<4;k++){
        const nx=x+NX_UDLR[k],ny=y+NY_UDLR[k];
        if(nx<0||nx>=W||ny<0||ny>=H)continue;
        const ni=idx(nx,ny),t=grid[ni];
        if(t===FIRE||(t===FUSE&&(variant[ni]&0x80))){
          variant[i]|=0x80;pixDirty(x,y);
          updated[i]=frameId;wake3(x,y);
          return;
        }
      }
      return;
    }
    for(let k=0;k<4;k++){
      const nx=x+NX_UDLR[k],ny=y+NY_UDLR[k];
      if(nx<0||nx>=W||ny<0||ny>=H)continue;
      const ni=idx(nx,ny),t=grid[ni];
      if(t===FUSE&&!(variant[ni]&0x80)&&Math.random()<0.45){
        variant[ni]|=0x80;wake3(nx,ny);pixDirty(nx,ny);updated[ni]=frameId;
      } else if(t===BOMB&&!(variant[ni]&0x80)){
        variant[ni]=0x80|(7<<4);
        wake3(nx,ny);pixDirty(nx,ny);updated[ni]=frameId;
      } else if(t===OIL&&Math.random()<0.35){setMat(nx,ny,FIRE);}
    }
    if(Math.random()<0.35&&eFree(x,y-1))setMat(x,y-1,SMOKE);
    if(Math.random()<0.10){setMat(x,y,SMOKE);return;}
    updated[i]=frameId;wake3(x,y);pixDirty(x,y);
    return;
  }

  if(m===BOMB){
    if(!(variant[i]&0x80)){
      for(let k=0;k<4;k++){
        const nx=x+NX_UDLR[k],ny=y+NY_UDLR[k];
        if(nx<0||nx>=W||ny<0||ny>=H)continue;
        const ni=idx(nx,ny),t=grid[ni];
        if(t===FIRE||(t===FUSE&&(variant[ni]&0x80))){
          variant[i]=0x80|(7<<4);
          pixDirty(x,y);updated[i]=frameId;wake3(x,y);
          return;
        }
      }
      return;
    }
    const ct=(variant[i]>>4)&7;
    if(ct===0){
      // detonate: snapshot every destructible cell in the blast disc, clear
      // it, then re-emit. Inner core → FIRE; everything else gets FLUNG
      // radially outward (with an upward bias) keeping its original material —
      // sand sprays as sand, dirt as chunks, wood as splinters.
      // Text/MASK survive so the page stays intact.
      const R_kill=10, R_push=22;
      const snap=[];
      for(let by=-R_push;by<=R_push;by++)for(let bx=-R_push;bx<=R_push;bx++){
        const d2=bx*bx+by*by;
        if(d2>R_push*R_push)continue;
        const nx=x+bx,ny=y+by;
        if(nx<0||nx>=W||ny<0||ny>=H)continue;
        const ni=idx(nx,ny),tm=grid[ni];
        if(tm===TITLE||tm===ACCENT||tm===BODY||tm===MASK||tm===RIGID)continue;
        snap.push({x:nx,y:ny,d2,m:tm,v:variant[ni]});
        grid[ni]=EMPTY;variant[ni]=0;frozen[ni]=0;
        updated[ni]=frameId;pixDirty(nx,ny);wake3(nx,ny);
      }
      // farthest cells settle first so closer flung pixels land into vacated air
      snap.sort((a,b)=>b.d2-a.d2);
      for(const c of snap){
        const d2=c.d2, srcM=c.m;
        if(d2<R_kill*R_kill){
          setMat(c.x,c.y,FIRE);continue;
        }
        // empty/smoke: dust the air so the shockwave reads even where there
        // was nothing to fling
        if(srcM===EMPTY||srcM===SMOKE||srcM===STEAM){
          if(d2<R_push*R_push*0.45){
            setMat(c.x,c.y,Math.random()<0.55?FIRE:SMOKE);
          } else if(Math.random()<0.35){
            setMat(c.x,c.y,SMOKE);
          }
          continue;
        }
        if(srcM===FUSE||srcM===BOMB)continue; // consumed by the blast
        // fling: project outward along the radial with an upward bias so
        // debris arcs up before gravity takes over
        const d=Math.sqrt(d2)||1;
        const dirX=(c.x-x)/d, dirY=(c.y-y)/d;
        const push=2+((R_push-d)*0.85|0)+(Math.random()*3|0);
        const tx=c.x+Math.round(dirX*push);
        const ty=c.y+Math.round(dirY*push)-((push*0.35)|0);
        let placed=false;
        for(let k=0;k<6;k++){
          const ox=k?((Math.random()*5|0)-2):0;
          const oy=k?((Math.random()*5|0)-2):0;
          const px=tx+ox, py=ty+oy;
          if(px<0||px>=W||py<0||py>=H)continue;
          const pi=idx(px,py);
          const pm=grid[pi];
          if(pm===EMPTY||pm===SMOKE||pm===STEAM){
            grid[pi]=srcM;
            variant[pi]=c.v&7; // strip lit/countdown bits
            frozen[pi]=0;
            updated[pi]=frameId;pixDirty(px,py);wake3(px,py);
            placed=true;break;
          }
        }
        if(!placed&&Math.random()<0.5)setMat(c.x,c.y,SMOKE);
      }
      return;
    }
    variant[i]=0x80|((ct-1)<<4);
    updated[i]=frameId;wake3(x,y);pixDirty(x,y);
    return;
  }
}

function simulate(){
  frameId++;
  stepDir=(frameId&1)?1:-1;
  // promote next→current, clear next
  let t;
  t=dcMinX;dcMinX=dnMinX;dnMinX=t;
  t=dcMinY;dcMinY=dnMinY;dnMinY=t;
  t=dcMaxX;dcMaxX=dnMaxX;dnMaxX=t;
  t=dcMaxY;dcMaxY=dnMaxY;dnMaxY=t;
  clearNext();

  // iterate chunk rows bottom→top so gravity propagates naturally
  for(let cyi=ncy-1;cyi>=0;cyi--){
    for(let cxi=0;cxi<ncx;cxi++){
      const c=cyi*ncx+cxi;
      let x0=dcMinX[c],y0=dcMinY[c],x1=dcMaxX[c],y1=dcMaxY[c];
      if(x1<x0)continue; // sleeping chunk
      if(x0<0)x0=0; if(y0<0)y0=0; if(x1>=W)x1=W-1; if(y1>=H)y1=H-1;
      for(let y=y1;y>=y0;y--){
        if(stepDir>0){for(let x=x0;x<=x1;x++)step(x,y);}
        else{for(let x=x1;x>=x0;x--)step(x,y);}
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════
   COLORS
═══════════════════════════════════════════════════════ */
// flatter palette — pixel art wants flat color fields, not per-pixel noise
// Flatter than before — pixel art wants deliberate color, not noise.
// Variants 0–3 are used for "shade levels" by sprite cells; 4–7 are zero so
// random sand/water/grass cells stay close to their base palette.
const JITTER=[0,-3,0,3,0,0,0,0];
// SHADE: for sprite materials we use variant as an explicit shade index.
// 0=base, 1=shadow, 2=highlight, 3=deep shadow. Values are RGB deltas.
const SHADE=[[0,0,0],[-22,-22,-18],[14,14,10],[-38,-36,-30]];
function matColor(m,v){
  const j=JITTER[v&7];
  switch(m){
    case EMPTY: return[0,0,0,0];
    case SAND:  return[205+j,170+j,82+j,255];
    case WATER: return[40+j,132+j,168+j,205];
    case FIRE:  return[235+j,70+(j>0?j*2:0),12,255];
    case STONE: return[66+j,64+j,70+j,255];
    case PLANT: return[44+j,150+j,46+j,255];
    case ACID:  return[170+j,212+j,22+j,235];
    case OIL:   return[70+j,58+j,30+j,240];
    case SMOKE: return[60+j,60+j,68+j,105];
    case STEAM: return[206+j,214+j,222+j,120];          // pale, barely-there vapour
    case LAVA:  return[236+j,96+j,26,255];              // molten orange
    case ASH:   return[96+j,88+j,82+j,255];
    case POLLEN:return[238+(j>0?j:0),205+j,96+j,210];  // glowing warm motes
    case MOSS:  return[78+j,124+j,58+j,255];            // soft reclaiming green
    case SEED:  return[126+j,92+j,44+j,255];            // amber seed
    case DIRT:  return[98+j,72+j,46+j,255];              // warm topsoil
    case GRASS: {                                        // meadow turf — variant picks the hue
      const s=v&3;
      if(s===0)return[68+j,138+j,50+j,255];
      if(s===1)return[54+j,122+j,42+j,255];
      if(s===2)return[82+j,152+j,56+j,255];
      return[46+j,104+j,36+j,255];
    }
    case TITLE: return[238,235,228,255];   // bright — name
    case ACCENT:return[184,224,0,255];     // lime — section labels
    case BODY:  return[28,26,34,255];       // near-black — readable against the bright sky
    case RIGID: return[0,0,0,0];           // drawn as a textured quad on top
    // ─── sprite materials ───
    case WOOD:  return[104+j,68+j,38+j,255];  // warm trunk brown
    case LEAF: {                              // canopy — variant picks shade
      const s=v&3;
