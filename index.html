/* ═══════════════════════════════════════════════════════
   SPECTACLES — the one sprite that is drawn to order

   Every other entry in SPRITES is a fixed grid of characters, and that works
   because a mushroom is a mushroom at any window size. This one is the largest
   object in the world and it has to stand BETWEEN two pillars of an arcade
   whose bay width falls out of the viewport: hand-authored at one size it
   would either overrun the colonnade on a wide window or come out as a pebble
   on a narrow one. So it is rasterised — hand it a width in cells and it
   returns exactly the same ASCII the hand-drawn sprites are, at that width,
   and every downstream pass (stampSprite, sbArt, the rigid-body solver) goes
   on treating it as an ordinary prop.

   FRONT ELEVATION, because that is the silhouette a pair of glasses has. A
   three-quarter view is what the product photography wants and it is also a
   bent wire at one cell per pixel — the two lenses and the brow across them
   are the whole recognition, and they only survive head-on.

   The frame is hand-shaded STONE: four flat tones running black (X) through a
   specular top edge (E), which is what glossy acetate does under a light from
   above. The lenses are GLASS, and GLASS emits underground (see glassLit) — so
   the room's existing rule makes the displays glow on their own, with no new
   material and no new line in the light path.
═══════════════════════════════════════════════════════ */
const SPECS_MIN=26;              // narrower than this and the shape stops reading
function specsArt(Wc){
  Wc=Math.max(20,Math.round(Wc));
  const Hc=Math.max(9,Math.round(Wc/3.0));    // the proportion the reference wears
  const m=Math.max(2,Math.round(Wc*0.022));   // just enough for the endpieces to stand proud
  const fw=Wc-2*m;
  const t=Math.max(2,Math.round(fw*0.055));   // rim
  const brow=Math.max(t+1,Math.round(fw*0.085));
  const bw=Math.max(2,Math.round(fw*0.10));   // the gap the bridge spans
  const lw=(fw-bw)>>1;
  const L0=m,L1=m+lw-1,R0=Wc-m-lw,R1=Wc-m-1;
  const y1=Hc-1;
  const RAD=Math.max(2,Math.round(Hc*0.30));
  const rad=Math.max(1,RAD-t);
  /* The bridge reaches to where each lens box's rounded corner gives way to
     its flat top. Anything less leaves a one-cell notch in the brow, which at
     this scale is not a highlight, it is a hole. */
  const bx0=L1-RAD, bx1=R0+RAD, by1=brow+Math.max(0,(t*0.5)|0);

  // rounded rect: clamp into the inner rect, then a radius test on what is left
  const rr=(x,y,x0,y0,x1,y1,r)=>{
    if(x<x0||x>x1||y<y0||y>y1)return false;
    const cx=Math.min(Math.max(x,x0+r),x1-r), cy=Math.min(Math.max(y,y0+r),y1-r);
    const dx=x-cx,dy=y-cy;
    return dx*dx+dy*dy<=r*r+r*0.5;
  };
  const box=(x,y,x0,x1)=>rr(x,y,x0,0,x1,y1,RAD);
  const ap =(x,y,x0,x1)=>rr(x,y,x0+t,brow,x1-t,y1-t,rad);
  const outer=(x,y)=>box(x,y,L0,L1)||box(x,y,R0,R1)||(x>=bx0&&x<=bx1&&y>=0&&y<=by1);
  const aper =(x,y)=>ap(x,y,L0,L1)||ap(x,y,R0,R1);

  // distance to a segment, for the temples and the strokes on the glass
  const seg=(px,py,ax,ay,bx,by,w)=>{
    const vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay;
    const L=vx*vx+vy*vy;let s=L?(wx*vx+wy*vy)/L:0;s=s<0?0:(s>1?1:s);
    const dx=wx-vx*s,dy=wy-vy*s;return dx*dx+dy*dy<=w*w;
  };

  /* ── THE ENDPIECES ──
     The hinge blocks, a couple of cells proud of the front on each side. Small
     on purpose: an arm long enough to read as an arm out here costs a quarter
     of the frame's width, and the frame is the thing that reads. */
  const hy=brow+(y1-t-brow)*0.26;              // hinge height, up in the top third
  const eh=Math.max(1.2,t*0.85);
  const nub=(x,y)=>(x<=L0+t*0.5||x>=R1-t*0.5)&&Math.abs(y-hy)<=eh&&x>=0&&x<Wc;
  const ah=y1-t-brow, aw=lw-2*t;

  /* ── THE TEMPLES ──
     Two rings and a bar is also a pair of binoculars, a mask, or a lorgnette.
     What settles it is the arms — and on a pair worn open and seen head-on the
     arms are not beside the front, they are BEHIND it, showing through the
     glass. That is what the reference photograph shows, and it is the version
     that costs the frame nothing: drawn outside, an arm long enough to read
     takes a quarter of the width away from the lenses.

     Stamped as stone rather than as a darker glass, for two reasons. Sprite
     glass shades differ by ~22 and the render posterizes anything under ~32
     into the same band, so a tinted-glass temple is a temple nobody can see.
     And glass EMITS down here — an opaque arm is one that keeps its shape
     against a lens that is lit from the inside, which is exactly how you read
     it as being behind the lens rather than etched into it.

     It enters at the outer edge, at the hinge, and tapers as it runs back
     toward the bridge — foreshortening, three segments of it. */
  const tw=Math.max(1.0,ah*0.115);
  const ARM=[[0,0],[0.20,0.06],[0.38,0.15],[0.50,0.22]];
  const temple=(x,y,ax,sx)=>{
    for(let i=0;i<ARM.length-1;i++){
      const a=ARM[i],b=ARM[i+1];
      if(seg(x,y,ax+sx*a[0]*aw,hy+a[1]*ah,ax+sx*b[0]*aw,hy+b[1]*ah,tw*(1-i*0.28)))return true;
    }
    return false;
  };
  const arm=(x,y)=>temple(x,y,L0+t,1)||temple(x,y,R1-t,-1);

  const gw=Math.max(0.6,aw*0.045);
  /* The long-stroke-plus-short-stroke glint every piece of pixel-art glass has,
     kept low and inboard so it falls clear of the temple above it. Both lenses
     take it in the same screen direction, because it is one light. */
  const glint=(x,y,ax)=>seg(x,y,ax+aw*0.24,brow+ah*0.46,ax+aw*0.46,brow+ah*0.92,gw)||
                       seg(x,y,ax+aw*0.42,brow+ah*0.44,ax+aw*0.52,brow+ah*0.66,gw*0.8);
  // and the round camera on each outer corner
  const cdr=Math.max(0.9,t*0.42), ccy=brow+ah*0.30;
  const cam=(x,y)=>Math.min((x-(L0+t*0.5))**2,(x-(R1-t*0.5))**2)+(y-ccy)**2<=cdr*cdr;

  const rows=[];
  for(let y=0;y<Hc;y++){
    let row='';
    for(let x=0;x<Wc;x++){
      let c='.';
      if(aper(x,y)){
        c=arm(x,y)?'S':((glint(x,y,L0+t)||glint(x,y,R0+t))?'*':'G');
      } else if(outer(x,y)||nub(x,y)){
        /* Shade off the silhouette rather than off a table: the top-facing
           cell of every column takes the specular, the one under it the
           falloff, the bottom-facing cell a weak bounce, and the ring against
           the glass a bevel. On a rounded frame that puts the highlight where
           the curve actually turns into the light, which a per-row gradient
           cannot do. */
        const up=outer(x,y-1)||nub(x,y-1), up2=outer(x,y-2)||nub(x,y-2);
        const dn=outer(x,y+1)||nub(x,y+1);
        const nearAp=aper(x,y-1)||aper(x,y+1)||aper(x-1,y)||aper(x+1,y);
        c=cam(x,y)?'E':(!up?'E':(!up2?'S':(!dn?'D':(nearAp?'S':'X'))));
      }
      row+=c;
    }
    rows.push(row);
  }
  return rows;
}

// Stamp a sprite anchored so its bottom-left lands at (gx, gy_bottom).
// Pixels are written FROZEN (the sprite holds its pixel-art shape) except
// for FIRE/WATER cells which need to keep behaving normally.
// Largest row width in a sprite — used for centered placement.
function spriteW(name){
  const art=SPRITES[name];if(!art)return 0;
  let w=0;for(let i=0;i<art.length;i++)if(art[i].length>w)w=art[i].length;
  return w;
}
function spriteH(name){const a=SPRITES[name];return a?a.length:0;}

/* ═══════════════════════════════════════════════════════
   ARTIFACTS — the work itself, rasterised into the grid

   An image is drawn into an offscreen canvas at EXACTLY the cell resolution it
   will occupy, so the browser's own downscaler does the averaging (drawImage
   with imageSmoothingQuality:'high' beats anything worth hand-writing here)
   and one source pixel-block becomes one sim cell. From there it is matter:
   frozen so it holds, ARTIFACT so it keeps its own colour, and in isDebris so
   fire, acid and gravity all get their say.

   Deliberately NOT the readable content. At this cell size a panel is legible
   as an image and nothing more — the words stay in the DOM, where they can be
   selected, indexed and read aloud. This is the picture on the wall, not the
   wall text.
═══════════════════════════════════════════════════════ */
const artifacts=[];   // {src,gx,gy,cw,ch,img} — kept so a reset can re-stamp
function rasterizeImage(img,cw,ch){
  const cv=Object.assign(document.createElement('canvas'),{width:cw,height:ch});
  const c=cv.getContext('2d',{willReadFrequently:true});
  c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  c.drawImage(img,0,0,cw,ch);
  return c.getImageData(0,0,cw,ch).data;
}
/* gx,gy is the TOP-LEFT in world cells. cw is the width in cells; the height
   follows from the image's aspect so nothing is squashed. */
function stampArtifact(img,gx,gy,cw){
  const ch=Math.max(1,Math.round(cw*(img.naturalHeight/img.naturalWidth)));
  const px=rasterizeImage(img,cw,ch);
  for(let dy=0;dy<ch;dy++)for(let dx=0;dx<cw;dx++){
    const sx=gx+dx,sy=gy+dy;
    if(sx<0||sx>=W||sy<0||sy>=H)continue;
    const si=(dy*cw+dx)*4;
    if(px[si+3]<128)continue;                    // transparent source → no cell
    const gi=idx(sx,sy);
    if(grid[gi]===STONE&&frozen[gi])continue;    // don't punch through bedrock
    grid[gi]=ARTIFACT;
    variant[gi]=0;                               // variant is the scorch level
    artRGB[gi]=(px[si]<<16)|(px[si+1]<<8)|px[si+2];
    frozen[gi]=1;
  }
  // A panel needs something to stand on or tryDecompose drops it the instant
  // physics starts. One row of stone under the footprint is the plinth.
  for(let dx=-1;dx<=cw;dx++){
    const sx=gx+dx,sy=gy+ch;
    if(sx<0||sx>=W||sy<0||sy>=H)continue;
    const gi=idx(sx,sy);
    if(grid[gi]===EMPTY){grid[gi]=STONE;variant[gi]=Math.random()*4|0;frozen[gi]=1;}
  }
  wakeRect(gx-1,gy-1,gx+cw+1,gy+ch+1);
  pixDirtyRect(gx-1,gy-1,gx+cw+1,gy+ch+1);
}
// Where each piece of work is buried. Depth is the ordering: recent work is
// near the surface, the older it is the further you dig.
// Nothing is stamped here any more. Project work lives in #worldLayer as real
// panels — see WORLD_PANELS — because at one pixel per sim cell a description
// is unreadable. ARTIFACT stays in the material set: it is the only way to put
// a specific colour into the grid, and the dig marker below uses it.
const ARTIFACT_PLAN=[];
/* Images decode asynchronously and spawnContent is synchronous, so each one
   stamps itself the moment it is ready. That is fine — a panel appearing a
   frame or two into the world is invisible, and it keeps image loading off the
   critical path of the first render. */
function spawnArtifacts(){
  artifacts.length=0;
  for(const a of ARTIFACT_PLAN){
    const img=new Image();
    img.decoding='async';
    img.onload=()=>{
      const gx=Math.round(a.at[0]*W);
      const gy=Math.round(a.at[1]*VH);
      const cw=Math.max(8,Math.round(a.w*W));
      if(gy+cw>=H)return;                        // world too short for this one
      artifacts.push({...a,img,gx,gy,cw});
      stampArtifact(img,gx,gy,cw);
    };
    img.src=a.src;
  }
}

/* ═══════════════════════════════════════════════════════
   THE SHAFT — a hole in the meadow, and a sign saying so

   At the top of the page the surface reads as a finished scene, so nothing
   tells you the world continues downward. The shaft is the affordance: a real
   hole carved through the turf into the first cave, with a red arrow parked
   over it. It is also the thing that makes the descent literal — sand poured
   into it falls past you while you scroll after it, which is the one move no
   amount of parallax can fake.
═══════════════════════════════════════════════════════ */
// (declared early: render() reads it to cut the berm, and runs before spawn)
/* Where the descent will be, before it has been dug.

   carveShaft runs AFTER the rooms are built, so a room builder that wants to
   keep out of the shaft's way cannot ask SHAFT — it is still null at that
   point, and a builder that asked got a confident "no shaft here" and put its
   centrepiece in the one column of the world that is a corridor. Both take
   their geometry from here instead. The ±3 is the wobble the walls are dug
   with, below. */
function shaftBand(){
  // On a phone the descent runs beside the exhibits, leaving one readable bay.
  const cx=Math.round(W*0.055), halfW=Math.max(3,Math.round(W*0.022));
  return {cx,halfW,x0:cx-halfW-3,x1:cx+halfW+3};
}
function carveShaft(){
  const {cx,halfW}=shaftBand();
  // find the turf: first solid cell going down from the sky
  let topY=0;
  for(let y=0;y<H;y++){const m=grid[idx(cx,y)];if(m!==EMPTY&&m!==PLANT&&m!==POLLEN&&!inWordmark(cx,y)){topY=y;break;}}
  /* Down to the floor of the last room. It used to stop at the cave band —
     right for a world that was one long stratum, wrong for one that is a
     stack of rooms, because a shaft that ends in rock leaves every room below
     it sealed and unreachable except by digging.

     It punches through each room's ceiling and floor on the way, which is the
     point: the hole reads as continuous, and anything spilled in the vaults
     finds its way down it to the arcade. */
  /* Ends just inside the last room's CEILING, not at its floor. Run to the
     floor, the shaft cut a ten-cell slot straight down the middle of the
     core's pediment and entablature — the facade came out as two halves with a
     gap where the apex should be. Stopping on the roof also reads better than
     passing through it: the descent ends by arriving above a buried building
     rather than by boring through one. */
  const bottomRoom=ROOM_BOX.core||ROOM_BOX.arcade;
  const botY=Math.min(H-1,bottomRoom?bottomRoom.ceil+2:VH+((VH*0.75)|0));
  for(let y=topY;y<=botY;y++){
    // the walls waver by a cell or two so it reads as dug rather than drilled
    const wob=Math.round(Math.sin(y*0.17)*1.6+Math.sin(y*0.055)*1.2);
    const x0=cx-halfW+wob, x1=cx+halfW+wob;
    for(let x=x0;x<=x1;x++){
      if(x<1||x>=W-1)continue;
      const gi=idx(x,y);
      grid[gi]=EMPTY;variant[gi]=0;frozen[gi]=0;
    }
    /* A rim on each wall so the shaft has an edge to read. Packed dirt near
       the surface, cut stone once it is into the rock — a dirt lip running
       down the inside of a brick vault reads as a rendering mistake rather
       than as the hole someone dug through it. Left as EMPTY where the shaft
       crosses a room, so it does not draw a wall across an open floor. */
    const deep=y>VH*1.02;
    for(const wx of [x0-1,x1+1]){
      if(wx<1||wx>=W-1)continue;
      const gi=idx(wx,y);
      if(grid[gi]===EMPTY)continue;
      grid[gi]=deep?STONE:DIRT;variant[gi]=Math.random()*5|0;frozen[gi]=deep?1:0;
    }
  }
  SHAFT={x0:cx-halfW,x1:cx+halfW,topY};
  wakeRect(cx-halfW-2,topY-1,cx+halfW+2,botY+1);
  pixDirtyRect(cx-halfW-2,topY-1,cx+halfW+2,botY+1);
}
/* The marker is built out of the world, not laid over it: a timber post
   carrying a painted board, both stamped as frozen cells. That matters for
   more than tone — because ARTIFACT and WOOD are both chunk materials and
   tryChunkDetach walks across the pair, the board is held up by the post the
   way a real sign is. Burn the post through and the whole sign detaches and
   falls as one piece; set fire to the board and it chars away and leaves the
   post standing. A div could not do either.

   The board face is drawn once to an offscreen canvas at exactly one pixel per
   cell, then baked into artRGB, which is the only way to get a specific colour
   into the grid. */
const ARROW_W=21, ARROW_H=27;               // cells
const ARROW_RED='#e02020', ARROW_EDGE='#7a0d0d';
/* Just the arrow — no board, no caption. Drawn on a transparent canvas and
   stamped by alpha, so what lands in the grid is the silhouette itself and the
   sky shows through around it.

   The one cell of darker edge is not decoration: the arrow has to read against
   pale sky at the top and against grass at the tip, and a flat fill loses its
   outline over one or the other. */
function makeArrowPixels(){
  const cv=Object.assign(document.createElement('canvas'),{width:ARROW_W,height:ARROW_H});
  const c=cv.getContext('2d',{willReadFrequently:true});
  c.imageSmoothingEnabled=false;
  const mid=ARROW_W>>1, shaftW=7, shaftH=14, headH=ARROW_H-shaftH;
  // laid out as rects so every edge falls on a cell boundary
  const paint=(col,inset)=>{
    c.fillStyle=col;
    c.fillRect(mid-(shaftW>>1)+inset,inset,shaftW-inset*2,shaftH);
    for(let row=0;row<headH-inset;row++){
      const hw=mid-Math.round(row*mid/(headH-1))-inset;
      if(hw<=0)break;
      c.fillRect(mid-hw,shaftH+row,hw*2,1);
    }
  };
  paint(ARROW_EDGE,0);
  paint(ARROW_RED,1);
  return c.getImageData(0,0,ARROW_W,ARROW_H).data;
}
/* A gallows signpost: upright, a bracing strut, an arm reaching out over the
   hole, and the arrow hung beneath the arm on two short droppers.

   The earlier version had the post directly beside the arrow, which read as an
   arrow bolted to a pole. What sells "hanging" is the GAP — daylight between
   the underside of the arm and the top of the arrow, crossed only by two thin
   droppers. The post also has to stand well back, so the arm is long enough to
   be read as an arm.

   Everything here is WOOD except the arrow, and both are chunk materials, so
   the flood fill in tryChunkDetach treats post + strut + arm + droppers +
   arrow as one structure: cut the upright and the whole assembly goes. */
const SIGN_ARM_H=2, SIGN_HANG=3, SIGN_REACH=12;
function stampSignpost(){
  if(!SHAFT)return;
  const cx=Math.round((SHAFT.x0+SHAFT.x1)/2);
  const ax=cx-(ARROW_W>>1);                   // arrow centred over the hole
  const postX=Math.max(1,ax-SIGN_REACH);      // stand back, so the arm reads
  let groundY=H-1;
  for(let y=0;y<H;y++){
    const m=grid[idx(postX,y)];
    // the wordmark's own turf/soil/bedrock bands are sky, not ground
    if((m===GRASS||m===DIRT||m===STONE)&&!inWordmark(postX,y)){groundY=y;break;}
  }
  const ay=Math.max(1+SIGN_HANG+SIGN_ARM_H,groundY-26-ARROW_H); // arrow top
  const armY=ay-SIGN_HANG-SIGN_ARM_H;                           // arm top
  const mid=ARROW_W>>1;
  const wood=(x,y,shade)=>{
    if(x<0||x>=W||y<0||y>=H)return;
    const gi=idx(x,y);
    if(grid[gi]===ARTIFACT)return;            // never overwrite the arrow
    grid[gi]=WOOD;variant[gi]=shade||0;frozen[gi]=1;
  };

  // ── the arrow, hung below where the arm will be ──
  const px=makeArrowPixels();
  for(let dy=0;dy<ARROW_H;dy++)for(let dx=0;dx<ARROW_W;dx++){
    const si=(dy*ARROW_W+dx)*4;
    if(px[si+3]<128)continue;                 // transparent → leave the sky
    const x=ax+dx,y=ay+dy;
    if(x<0||x>=W||y<0||y>=H)continue;
    const gi=idx(x,y);
    grid[gi]=ARTIFACT;variant[gi]=0;
    artRGB[gi]=(px[si]<<16)|(px[si+1]<<8)|px[si+2];
    frozen[gi]=1;
  }

  // ── upright ──
  for(let y=armY;y<=groundY+1;y++){wood(postX,y,0);wood(postX+1,y,1);}
  // ── arm: out from the post to just past the far dropper ──
  const armX1=ax+mid+4;
  for(let y=armY;y<armY+SIGN_ARM_H;y++)for(let x=postX;x<=armX1;x++)wood(x,y,y===armY?0:1);
  // ── corner strut, the diagonal that makes it look built rather than glued ──
  for(let k=0;k<6;k++)wood(postX+2+k,armY+SIGN_ARM_H+5-k,1);
  // ── two droppers, at the shoulders of the arrow's shaft ──
  for(const hx of [ax+mid-3,ax+mid+3])
    for(let y=armY+SIGN_ARM_H;y<ay;y++)wood(hx,y,1);

  wakeRect(postX-2,armY-2,armX1+2,groundY+2);
  pixDirtyRect(postX-2,armY-2,armX1+2,groundY+2);
}

/* The sign over each room's door. Stamped as particles into the lintel rather
   than set as DOM, because it is the room talking rather than the work — and a
   label made of the same stone as the wall it is cut into cannot be mistaken
   for another panel. */
const ROOM_SIGNS={
  workshop:{text:'ABOUT ME',               m:SAND},
  crypt: {text:'SPECTACLES VAULT',         m:GLASS},
  arcade:{text:'GAMES & SIDE PROJECTS',    m:GLASS},

/* Cut the room's name into the rock just under its ceiling.

   The sign material is the same one that lights the room, so each label reads
   in its room's own colour without a single new palette entry: moss-green in
   the vaults, acid-green in the lab, glass-white in the arcade, lava-orange at
   the core. Frozen, so a sign is masonry and not a cloud of loose grains that
   drifts to the floor on the first physics tick. */
/* The rows a room's name will be cut into, before it has been cut.

   Room signs are stamped with the panels, long after the room builders have
   run, and the recess they clear takes whatever is in it. In the vaults that
   was the crowns of the two arches under the sign — the arcade has always had
   a hole in the middle of it for exactly this reason. A builder that wants to
   keep its masonry out of the way can ask here. */
function roomSignBand(ceilY){
  const gy=ceilY+Math.max(4,(VH*0.02)|0), gh=Math.max(9,(VH*0.045)|0);
  return {y0:gy-2,y1:gy+gh+1};
}
function stampRoomSign(box,spec){
  if(!box||!spec)return;
  const gh=Math.max(9,(VH*0.045)|0);
  const gw=Math.min(W-4,(W*0.34)|0);
  const gx=Math.max(2,((box.x0+box.x1)/2-gw/2)|0);
  const gy=box.ceil+Math.max(4,(VH*0.02)|0);
  // clear a recess for it first: text stamped straight onto rock is unreadable
  const band=roomSignBand(box.ceil);
  slab(gx-2,band.y0,gx+gw+1,band.y1,EMPTY);
  stampText(spec.text,spec.m,gx,gy,gw,gh,0,{bold:true});
  for(let y=gy;y<gy+gh;y++)for(let x=gx;x<gx+gw;x++){
    if(x<0||x>=W||y<0||y>=H)continue;
    const gi=idx(x,y);
    if(grid[gi]===spec.m)frozen[gi]=1;
  }
  wakeRect(gx-3,gy-3,gx+gw+2,gy+gh+2);
  pixDirtyRect(gx-3,gy-3,gx+gw+2,gy+gh+2);
}
/* Hollow out the rock a panel sits in.

   Without this a panel is embedded in solid stone, and two things go wrong at
   once: it reads as a sticker laid over the rock rather than something down
   there, and it cannot burn — updateWindowMasks only stamps MASK into cells
   that are EMPTY, so a panel with stone behind it never acquires a maskOwner
   and fire has nothing to take hold of. The chamber gives it both: a void to
   stand in, and a footprint the burn system can own.

   Reading the element's own rect rather than a guessed size means the chamber
   always matches the panel, including after a reflow at a different width. */
function carveChamber(el){
  const r=el.getBoundingClientRect();
  if(r.width<=0||r.height<=0)return;
  const cr=canvas.getBoundingClientRect();
  const pad=3;
  const x0=Math.max(1,Math.floor((r.left-cr.left)/SCALE)-pad);
  const x1=Math.min(W-2,Math.ceil((r.right-cr.left)/SCALE)+pad);
  const y0=Math.max(1,Math.floor((r.top-cr.top)/SCALE)+camY-pad);
  const y1=Math.min(H-2,Math.ceil((r.bottom-cr.top)/SCALE)+camY+pad);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const gi=idx(x,y);
    grid[gi]=EMPTY;variant[gi]=0;frozen[gi]=0;
  }
  // a stone lintel and floor, so the chamber reads as cut rather than dissolved
  for(let x=x0-1;x<=x1+1;x++)for(const y of [y0-1,y1+1]){
    if(x<0||x>=W||y<0||y>=H)continue;
    const gi=idx(x,y);
    if(grid[gi]===EMPTY)continue;
    grid[gi]=STONE;variant[gi]=Math.random()*4|0;frozen[gi]=1;
  }
  wakeRect(x0-2,y0-2,x1+2,y1+2);
  pixDirtyRect(x0-2,y0-2,x1+2,y1+2);
}

/* Open one work's record over the room's grid.

   The record is a panel that already exists at the grid's exact footprint, so
   opening is a visibility change rather than a layout one: nothing is carved,
   no frame is re-stamped, and the zone bands derived from this room's height
   stay valid. The diorama redraws to the opened work, which is the one thing
   that should change about the room itself — the scene is the world's copy of
   what you are reading. */
function openRoomRecord(section,p,initial=false){
  ROOM_SELECTION[p.zone]=p.id;
  section.dataset.project=p.id;
  const record=section.querySelector('.room-record');
  if(!record)return; // A destroyed record stays destroyed until world reset.
  // Keep the burn overlay and damage on the equipment when its display changes.
  record.querySelector('.record-content')?.remove();
  record.insertAdjacentHTML('afterbegin',roomRecordHTML(p));
  record.scrollTop=0;
  record.hidden=false;
  record.setAttribute('aria-label',p.name+' project');
  section.querySelectorAll('.room-card').forEach(el=>{
    el.setAttribute('aria-expanded',String(el.dataset.project===p.id));
  });

function closeRoomRecord(section){
  const record=section.querySelector('.room-record');
  if(!record||record.hidden)return;
  record.hidden=true;
  delete ROOM_SELECTION[section.dataset.zone];
  section.dataset.project='';
  section.querySelectorAll('.room-card').forEach(el=>el.setAttribute('aria-expanded','false'));
  // The room falls back to its own scene rather than keeping the last work's.
  const lead=WORLD_PANELS.find(p=>p.zone===section.dataset.zone);

}

/* ═══ DEPTH CORE SAMPLE ═══
   Navigation for a world whose structure IS its depth. The rail is a section
   through the whole descent: one band per zone at its true share of the
   column, filled with the colour of the rock behind that room, a notch for
   every exhibit in it, and a lens tracking the camera's window.

   That is deliberately one object doing three jobs — table of contents,
   progress indicator, and the "everything at once" view a visitor wants before
   committing to a ten-screenful scroll. A list of buttons can only do the
   first, and it cannot say how much world is left.

   Band colours come from ZONES[].back, the same pair the shader crossfades
   behind that room, so the rail restates the descent rather than inventing a
   key for it. They are lifted through a gamma because colours picked to sit
   BEHIND lit masonry are near-black at 30px wide. The meadow has no `back` —
   ugK is zero above the horizon — so it takes the sky and turf colours the
   shader and the palette actually use up there. */
const NAV_LABELS={surface:'THE MEADOW',workshop:'THE WORKSHOP',crypt:'THE VAULTS',
  arcade:'GAMES & SIDE PROJECTS',core:'THE CORE'};
const NAV_SURFACE=['rgb(115,173,230)','rgb(68,138,50)'];   // daytime sky over turf
const navRock=c=>'rgb('+c.map(v=>Math.round(255*Math.pow(v,0.62))).join(',')+')';
const navZoneRock=z=>z.id==='surface'?NAV_SURFACE:[navRock(z.back[0]),navRock(z.back[1])];

/* Which stratum the rail calls "here" is decided by the same anchors its
   buttons scroll to, not by probing a row a quarter-screen down. A room's
   carved ceiling can sit slightly ABOVE its zone band — buildExhibitShell puts
   it at 18% of a screenful into the band, while the jump parks the camera 44px
   above that — so a probe at a fixed depth landed a click on `crypt` inside
   `workshop`. Reading both off one number makes the highlight true by
   construction: after you press a band, you are in it. */
let NAV_ANCHORS=[];

function activeZoneId(){
  let id=ZONES[0].id;

  for(const a of NAV_ANCHORS)if(camY+1>=a.row)id=a.id;

function buildDepthNav(){

  // Shares are read off DEPTH_LAYOUT rather than the ZONES literals: those are
  // the pre-resize fractions, and worldBands has since restretched every band
  // to fit the room inside it at this width.
  const total=DEPTH_LAYOUT.total;
  nav.innerHTML='<div class="cs-core">'+ZONES.map(z=>{
    const rock=navZoneRock(z),projects=WORLD_PANELS.filter(p=>p.zone===z.id);
    return '<div class="cs-band" data-depth="'+z.id+'" style="--share:'+((z.bot-z.top)/total).toFixed(4)+
      ';--rock-top:'+rock[0]+';--rock-bot:'+rock[1]+'">'+

      // depth. Spreading them down the band is a reading of the stratum's
      // contents, and it is the only place the whole portfolio is visible.
      projects.map((p,i)=>'<button type="button" class="cs-tick" data-depth="'+z.id+
        '" data-project="'+p.id+'" style="--at:'+((i+1)/(projects.length+1)*100).toFixed(1)+
        '%" data-label="'+p.name+'" aria-label="'+p.name+' — '+NAV_LABELS[z.id]+'"></button>').join('')+
      '</div>';
  }).join('')+'<div class="cs-lens" aria-hidden="true"></div></div>';
  // Anchors are cached here, where ROOM_BOX is known to be populated, so the
  // per-scroll sync never touches it — spawnStrata fills ROOM_BOX long after
  // the first setCam could fire.
  NAV_ANCHORS=ZONES.map(z=>{
    const box=ROOM_BOX[z.id];
    return {id:z.id,row:box?Math.max(0,box.ceil-Math.round(44/SCALE)):0};
  });
  nav.dataset.active='';_navLens='';
  syncDepthNav();syncDepthTicks();
}
/* A notch click selects the work AND travels to it: the rail is an index, and
   an index that only got you to the right room would make you hunt again. */
function onDepthNavClick(e){
  const tick=e.target.closest('.cs-tick'),button=tick||e.target.closest('.cs-jump');
  if(!button)return;
  const id=button.dataset.depth;
  if(tick){
    const section=document.querySelector('.room-exhibit[data-zone="'+id+'"]');
    const p=WORLD_PANELS.find(p=>p.id===tick.dataset.project);
    if(section&&p&&section.dataset.project!==p.id)openRoomRecord(section,p);
  }
  window.scrollTo({top:navAnchorRow(id)*SCALE,
    behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
}
/* Which notch is lit changes only when a room's selection does, so it is
   driven from openRoomRecord/closeRoomRecord rather than from the scroll. */
function syncDepthTicks(){
  const nav=document.getElementById('depthNav');
  if(!nav)return;
  for(const tick of nav.querySelectorAll('.cs-tick'))
    tick.classList.toggle('is-on',ROOM_SELECTION[tick.dataset.depth]===tick.dataset.project);
}
let _navLens='';
function syncDepthNav(){
  const nav=document.getElementById('depthNav');
  if(!nav)return;
  const lens=nav.querySelector('.cs-lens');
  if(lens){
    // Percentages of the whole world, so the lens is a true scale reading of
    // how much of the descent one screenful covers.
    const at=(camY/H*100).toFixed(2),span=(Math.min(VH,H-camY)/H*100).toFixed(2);
    if(_navLens!==at+'/'+span){
      _navLens=at+'/'+span;
      lens.style.setProperty('--at',at+'%');
      lens.style.setProperty('--span',span+'%');
    }
  }
  const zone=activeZoneId();
  if(nav.dataset.active===zone)return;
  nav.dataset.active=zone;
  for(const band of nav.querySelectorAll('.cs-band')){
    const here=band.dataset.depth===zone;
    band.classList.toggle('is-here',here);
    const jump=band.querySelector('.cs-jump');
    if(here)jump.setAttribute('aria-current','location');
    else jump.removeAttribute('aria-current');
  }
}

function stampSprite(name,gx,gyBottom){
  const art=SPRITES[name];
  if(!art)return;
  const h=art.length;
  const gy=gyBottom-h+1;
  for(let dy=0;dy<h;dy++){
    const row=art[dy];
    for(let dx=0;dx<row.length;dx++){
      const spec=SPRITE_MATS[row[dx]];
      if(!spec)continue;
      const nx=gx+dx,ny=gy+dy;
      if(nx<0||nx>=W||ny<0||ny>=H)continue;
      const gi=idx(nx,ny);
      // never overwrite bedrock, terrain text, or another sprite already stamped
      const cur=grid[gi];
      if(cur===STONE||frozen[gi])continue;
      grid[gi]=spec.m;
      variant[gi]=spec.v;
      // FIRE and WATER are stamped live so they burn and flow on arrival;
      // FUSE joins them because its whole point is that it can be lit, and
      // step() returns immediately on any frozen cell that is not debris.
      if(spec.m!==FIRE&&spec.m!==WATER&&spec.m!==FUSE)frozen[gi]=1;
    }
  }
}

/* ═══════════════════════════════════════════════════════
   WORDMARK — the name, hung in the sky, made of the world

   The masthead is not HTML floating over the canvas: it is matter in the grid,
   on the same first screen as the meadow, so the sim's own rules apply to it.
   Sand for the letterface, ash for the rim.

   Those two materials and not the prettier sprite set, because a frozen cell
   only reaches tryDecompose() if isDebris() claims it — and WOOD, BRICK and
   LEAF all do. Hung in mid-air with nothing under them they lose support on
   the first tick and the name rains onto the meadow before anyone reads it.
   SAND and ASH are not debris, so step() returns on them immediately and the
   letters hold.

   Held is not the same as safe. Acid eats sand and ash, a bomb flings both,
   and FIRE fuses sand into GLASS — so burning the name does not erase it, it
   leaves it behind in the one material that lights itself after dusk.

   Authored at cap-height 9 and stamped at an integer scale, so the same
   letterforms serve a 97-cell phone (k=1) and a 360-cell desktop (k=3). The
   bevel and the whole rim are derived AFTER scaling, at one-cell resolution,
   which is what keeps a k=3 letter reading as a bevelled display face rather
   than a sprite someone blew up.
═══════════════════════════════════════════════════════ */
const WM_ROWS=9;
const WM_GLYPHS={
  M:['##.....##','###...###','####.####','##.###.##','##..#..##','##.....##','##.....##','##.....##','##.....##'],
  I:['##','##','##','##','##','##','##','##','##'],
  T:['########','########','...##...','...##...','...##...','...##...','...##...','...##...','...##...'],
  C:['.#####.','##...##','##.....','##.....','##.....','##.....','##.....','##...##','.#####.'],
  H:['##...##','##...##','##...##','##...##','#######','#######','##...##','##...##','##...##'],
  E:['######','######','##....','##....','#####.','##....','##....','######','######'],
  L:['##....','##....','##....','##....','##....','##....','##....','######','######'],
  K:['##...##','##..##.','##.##..','####...','###....','####...','##.##..','##..##.','##...##'],
  U:['##...##','##...##','##...##','##...##','##...##','##...##','##...##','##...##','.#####.'],
  P:['######.','##...##','##...##','##...##','######.','##.....','##.....','##.....','##.....'],
  R:['######.','##...##','##...##','##...##','######.','##.##..','##..##.','##...##','##...##'],
  S:['.#####.','##...##','##.....','###....','.#####.','....###','.....##','##...##','.#####.'],
};
const WM_LINES=['MITCHELL','KUPPERSMITH'];
/* The name hangs in the sky with nothing under it, so every probe that walks a
   column down from y=0 looking for GROUND has to fall straight through it —
   the shaft would otherwise start its dig at the top of the M, and the cat
   would spawn eight rows up in the air on the crossbar of an H. One rect the
   probes test against is cheaper and far less error-prone than teaching each
   of them what sand in mid-air means. */
let WORDMARK_BOX=null;
const inWordmark=(x,y)=>!!WORDMARK_BOX&&x>=WORDMARK_BOX.x0&&x<=WORDMARK_BOX.x1&&y>=WORDMARK_BOX.y0&&y<=WORDMARK_BOX.y1;
function wmGlyphW(ch){const g=WM_GLYPHS[ch];return g?g[0].length:0;}
function wmLineW(str,track){
  let w=0;
  for(let i=0;i<str.length;i++){w+=wmGlyphW(str[i]);if(i)w+=track;}
  return w;
}
/* ─── THE NAME AS A CUT BANK ───
   One material per letter was the first try and it read as a ransom note:
   nineteen hues at nineteen different weights, each letter arguing for itself
   instead of the word. So the materials band HORIZONTALLY across the whole
   lockup instead, and every letter shares the same section — which makes the
   two lines read as one object that happens to be made of layered ground.

   The order is the world's own: turf over sand, cut the way the shaft cuts it.
   The seam falls inside the given name, so MITCHELL carries the turf line and
   the surname below it is all sand — the masthead is a core sample of the
   place it is hanging over.

   Two bands, down from the six it started with. Topsoil, the vaults' brick,
   bedrock and a seam of the core's lava were the others, and they are why the
   early versions read as busy: every material carries its own micro-texture in
   matTexel, and brick's mortar courses stacked on dirt's speckle stacked on
   stone's flecks put three competing patterns inside a letter twenty-seven
   cells tall — with the lava seam glowing under all of it. Sand's 2x2 bedding
   is the quietest thing in the palette, so it takes the bulk of the name.

   The cost of dropping lava is that nothing in the name emits any more, so
   after dusk it goes to silhouette along with the meadow. That is the honest
   behaviour for turf and sand, and the rim keeps the shape readable against a
   night sky; the alternative — a glass seam, the world's other emitter — buys
   the night back but renders at alpha 200, so it spends the day as a pale
   scratch under the surname.

   `at` is where the band starts as a fraction of the block's height. `hi` is
   the variant that reads as that material's lit face — 6 is sand's bright
   quartz, 2 is the grass/leaf palette's highlight, 3 is +3 on the shared
   jitter ramp everything else uses — so every band gets the same one-cell lit
   top edge even though only SAND, STONE and DIRT carry RELIEF and would have
   earned one for free.

   Glass is deliberately absent. It is the prettiest material down there and
   the only other emitter, but it renders at alpha 200 over a pale sky, so by
   daylight a glass band is a hole through the middle of someone's name. */
const WM_BANDS=[
  {at:0.00, m:GRASS, hi:2},   // turf
  {at:0.34, m:SAND,  hi:6},   // the site's own material, and the bulk of the name
];
/* The seams waver across the width for the same reason the shaft's walls do:
   a ruled horizontal line reads as a mistake in a world where nothing else is
   ruled. Under a cell of travel now rather than two — at this letter size a
   fuller wave broke the bands into separate incidents per letter instead of
   one section running through all of them. Two incommensurate sines, no
   random, so the same wordmark comes back identical on every reset. */
function wmBandAt(x,t){
  const w=t+(Math.sin(x*0.13)*0.9+Math.sin(x*0.041+1.7)*0.7)*0.006;
  let b=WM_BANDS[0];
  for(const band of WM_BANDS)if(w>=band.at)b=band;
  return b;
}
/* The world row the name has to start below to clear the materials picker.

   The name is centred and runs to very nearly the full width of the world, so
   its right end passes under the picker in the top-right corner however it is
   tracked or scaled — vertical is the only axis with any give.

   Measured, not assumed. The picker is ~245px tall on a desktop, shorter at
   the phone breakpoint where it narrows to 146px, taller again when its list
   is scrolled open, and it collapses to just its title bar when minimised. A
   hard-coded row would be wrong for three of those four. */
function wmClearTop(){
  const base=Math.max(0,(VH*0.13)|0);
  const mp=document.getElementById('matPicker');
  if(!mp)return base;
  const r=mp.getBoundingClientRect(), cr=canvas.getBoundingClientRect();
  if(!r.height||!cr.height)return base;                  // not laid out yet
  /* The gutter is in cells and is generous on purpose: the lockup's rim grows
     upward into its own padding, so a clearance measured to the letterforms
     leaves the bevel all but touching the picker's bottom edge. */
  return Math.max(base,Math.ceil((r.bottom-cr.top)/SCALE)+11);
}
function stampWordmark(){
  const [L1,L2]=WM_LINES;
  WORDMARK_BOX=null;
  if(wmLineW(L2,1)>W-2)return;                  // narrower than the name: leave the sky alone
  // one integer step per screen size — k=1 on a phone, 2–3 on a desktop
  const k=Math.max(1,Math.min(3,Math.floor((W*0.78)/wmLineW(L2,1))));
  /* At k=1 the rim becomes a one-cell drop shadow rather than a keyline (see
     below), and a shadow cast into a one-cell gap welds neighbouring letters
     together — so the tracking opens to two there when the width allows it. */
  let T2=1;
  if(k===1&&wmLineW(L2,2)<=W-2)T2=2;
  const base2=wmLineW(L2,T2);
  /* The given name is three letters shorter than the surname, so set flush it
     sits centred and stubby over a line half again its width. Tracking it out
     to the surname's measure is the ordinary fix, and it is also the reason
     the two lines can share one integer scale instead of needing two. */
  const T1=Math.max(T2,Math.min(3,Math.round((base2-wmLineW(L1,0))/(L1.length-1))));
  const baseW=Math.max(wmLineW(L1,T1),base2);
  const gapY=3*k;
  const blockW=baseW*k, blockH=WM_ROWS*2*k+gapY;
  const pad=3;                                  // room for the rim to grow into
  const bw=blockW+pad*2, bh=blockH+pad*2;
  // rasterise both lines into a local bitmap first: the rim, the lit top edge
  // and the footing are all neighbourhood tests, and they want the finished
  // shape of the whole lockup to read from rather than one glyph at a time
  const bm=new Uint8Array(bw*bh);
  function draw(str,track,oy){
    let cx=pad+(((blockW-wmLineW(str,track)*k)/2)|0);
    for(const ch of str){
      const g=WM_GLYPHS[ch];
      if(!g){cx+=track*k;continue;}
      for(let ry=0;ry<WM_ROWS;ry++){
        const row=g[ry];
        for(let rx=0;rx<row.length;rx++){
          if(row[rx]!=='#')continue;
          for(let sy=0;sy<k;sy++)for(let sx=0;sx<k;sx++){
            const bx=cx+rx*k+sx, by=oy+ry*k+sy;
            if(bx>=0&&bx<bw&&by>=0&&by<bh)bm[by*bw+bx]=1;
          }
        }
      }
      cx+=g[0].length*k+track*k;
    }
  }
  draw(L1,T1,pad);
  draw(L2,T2,pad+WM_ROWS*k+gapY);

  const B=(x,y)=>(x<0||x>=bw||y<0||y>=bh)?0:bm[y*bw+x];
  const gx0=(((W-blockW)>>1))-pad;
  /* Below the picker, but never so far down that the name lands in the
     scenery. The clamp matters at the phone breakpoint, where the picker's
     list can run most of the viewport height: overlapping the picker is bad,
     and burying the name in the hill is worse, so the sky floor wins. */
  const skyFloor=Math.max(0,((VH*0.66)|0)-bh);
  const gy0=Math.min(skyFloor,Math.max(0,wmClearTop()-pad));
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    const wx=gx0+x, wy=gy0+y;
    if(wx<0||wx>=W||wy<0||wy>=H)continue;
    const gi=idx(wx,wy);
    if(grid[gi]!==EMPTY)continue;
    if(B(x,y)){
      /* THE FOOTING — a one-cell ash sole under every stroke.

         Turf and sand both hold on their own (neither is debris, so step()
         returns on them the moment it sees frozen), so this is not holding the
         name up today: it is the letter's dark underside, sitting between the
         sand and its own drop shadow so the stroke has an edge to end on
         rather than fading into the rim.

         It is also what makes the palette safe to change. Add wood, brick or
         leaf to WM_BANDS and every cell of that band is debris hung in mid-air
         — tryDecompose is satisfied by any frozen cell below, and this is it.
         Without the sole, a brick band would detach on its first tick. */
      if(!B(x,y+1)){grid[gi]=ASH;variant[gi]=1;frozen[gi]=1;continue;}
      const band=wmBandAt(x,(y-pad)/blockH);
      grid[gi]=band.m;
      // one lit cell along the top of every stroke, so six materials with six
      // different ideas of shading still share one light source
      variant[gi]=B(x,y-1)?0:band.hi;
      frozen[gi]=1;
      continue;
    }
    /* The rim is what stops a pale band from dissolving into a cloud. At k>=2
       it is a keyline: one cell all round, two below and to the right, so the
       letters read as standing slightly in front of the sky. At k=1 there is
       no room for that — the counter of an H is three cells wide and a keyline
       down both sides closes it — so it drops to the bottom-right half only,
       which is a plain drop shadow. */
    let rim=false;
    if(k===1){
      rim=!!(B(x-1,y)||B(x,y-1)||B(x-1,y-1));
    }else{
      for(let dy=-1;dy<=1&&!rim;dy++)for(let dx=-1;dx<=1;dx++)if(B(x+dx,y+dy)){rim=true;break;}
      if(!rim)rim=!!(B(x-2,y)||B(x,y-2)||B(x-1,y-2)||B(x-2,y-1)||B(x-2,y-2));
    }
    if(rim){grid[gi]=ASH;variant[gi]=1;frozen[gi]=1;}
  }
  WORDMARK_BOX={x0:gx0,y0:gy0,x1:gx0+bw-1,y1:gy0+bh-1};
}

/* ═══ DEPTH STRATA ═══
   What fills the seven screens under the meadow. This used to be a geological
   ramp — subsoil, rock, moss, bedrock — and the panels buried in it read as
   fossils in undifferentiated dirt, because a gradient has no places in it.

   Now the depth is ARCHITECTURE. Each zone in ZONES owns a band of world rows
   and builds a room there; the rock between rooms is what is left over. The
   descent runs backward in time, so the current work is the first room you
   reach and school is the last.

   strataMat still answers "what is the bulk material at this row", but the
   answer is now the rock AROUND a room rather than the whole of the depth.
   d = cells below the local surface, y = absolute world row. */
/* ═══ GROUND NOISE ═══
   Everything below this point places material by asking a FIELD what is at a
   position, never by flipping a coin per cell. That one change is what
   separates rock from static: a threshold on a smooth field produces connected
   regions with ragged rims, while an independent draw per cell produces
   isolated pixels at exactly the density you asked for and no shape at all.

   Value noise rather than gradient noise. It is a few lines, it is built on the
   hash the masonry bakers already use, and its slightly blocky character is an
   asset here — this is a world of one-cell pixels and a field with visible
   cell structure quantises more honestly than a smooth one. */
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  // smoothstep the cell fractions so the lattice does not show as a grid
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const h=(a,b)=>(hash2i(a,b)&0xffff)/65535;
  const a=h(xi,yi),   b=h(xi+1,yi);
  const c=h(xi,yi+1), d=h(xi+1,yi+1);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
/* Fractal sum. Four octaves is the point where another one stops being visible
   at one cell per pixel and starts being cost. */
function fbm2(x,y,oct){
  let s=0,amp=0.5,f=1,norm=0;
  for(let i=0;i<(oct||4);i++){
    s+=vnoise(x*f,y*f)*amp; norm+=amp;
    amp*=0.5; f*=2.03;                    // 2.03, not 2 — an exact octave makes
  }                                       // the lattices line up and streak
  return s/norm;
}
/* Domain warp: push the sample point around by another noise field before
   reading. This is the cheapest way to stop a threshold from looking like a
   contour map — it turns concentric blobs into lobed, fingered shapes that
   read as something that grew or seeped rather than something that was
   plotted. */
function warp2(x,y,amt,scale){
  const wx=x+(fbm2(x*scale+31.7,y*scale-11.3,2)-0.5)*amt;
  const wy=y+(fbm2(x*scale-57.1,y*scale+43.9,2)-0.5)*amt;
  return [wx,wy];
}

/* ═══ THE BEDDING ═══
   Sedimentary rock is laid down in courses, and the single strongest reason a
   rock face reads as rock is that those courses are CONTINUOUS across it,
   parallel to each other, and not level. `seam` gave horizontal bands from two
   sines, which is the right instinct, but every band ran dead flat across the
   whole world at the same thickness and the same spacing forever.

   Real bedding dips, thickens and thins, and pinches out. bedAt returns a
   continuous bed coordinate: its integer part identifies WHICH bed a cell is
   in, its fractional part says how far through that bed the cell sits. Both
   halves get used — the identity picks the material, the position within the
   bed lets a bed be graded from coarse at its base to fine at its top, the way
   a real one is. */
function bedAt(x,y){
  // the whole sequence dips gently and undulates, so no bed is a ruled line
  const dip=x*0.045;
  const fold=(fbm2(x*0.012,y*0.004,3)-0.5)*26;
  return (y+dip+fold)/BED_H;
}
const BED_H=18;                            // broad strata leave room for quiet faces

/* ═══ MATERIAL SUITES ═══
   What each zone's rock is MADE OF, declared rather than branched.

   The old strataMat was a switch with one expression per zone, so every zone
   said its piece in a different vocabulary and nothing could be shared, tuned
   or reasoned about across the set. A suite is data:

     matrix    the bulk rock — what you get when no other rule fires
     beds      bands in the sequence. `every` is the bed period, `of` how many
               beds out of that period this material takes, so {every:5,of:1}
               is one band in five. `p` lets a band be patchy along its length,
               which is what makes a bed pinch out instead of running forever.
     veins     deposits that cut ACROSS the bedding — threshold on a warped
               field, so they come out as lobed bodies rather than blobs.
     damp      how readily this rock grows things where it meets a void. Used
               by the contact pass, which is the only rule that needs to know
               where the air is and therefore cannot run here.

   The point is not that the data is shorter. It is that "the vaults are older
   masonry buried in limestone with moss where the water gets in" is now a
   sentence the code can hold, and the lab differs from the arcade by the
   numbers in its suite rather than by a different hand-written expression. */
const SUITES={
  /* Under the turf: soil grading into weathered rock, the way ground actually
     does. No masonry — nothing was ever built this shallow. */
  subsoil:{matrix:DIRT, beds:[{m:STONE,every:3,of:1,p:0.55}], veins:[], damp:0.30},
  /* THE WORKSHOP — the cellar of a house. Ordinary ground with the builder's
     rubble in it: brick courses close to the surface where somebody dug, and
     clay lenses. It is the only suite with DIRT for a matrix underground, and
     that is the point — this room is domestic, and the rock around it should
     feel like a garden dug into rather than a mine. */
  workshop:{matrix:DIRT,
            beds:[{m:STONE,every:4,of:1,p:0.70},{m:BRICK,every:9,of:1,p:0.20}],
            veins:[{m:STONE,scale:0.055,cover:0.30,warp:9}], damp:0.45},
  /* THE VAULTS — limestone with occasional buried masonry. Keep most rock
     quiet so the constructed arches stand out; moss belongs at wet contacts. */
  crypt:{matrix:STONE,
         beds:[{m:BRICK,every:8,of:1,p:0.30},{m:DIRT,every:7,of:1,p:0.20}],
         veins:[], damp:0.95},
  /* THE ARCADE — fill, not bedrock: this is ground that was dumped rather than
     laid, so it gets an earth matrix with rubble through it and beds that
     barely hold together. It is the only zone whose bulk is DIRT below the
     subsoil, and that is what makes the arcade's surroundings read as
     backfill rather than as bedrock. */
  arcade:{matrix:DIRT,
          beds:[{m:STONE,every:4,of:1,p:0.65},{m:BRICK,every:9,of:1,p:0.25}],
          veins:[{m:STONE,scale:0.08,cover:0.16,warp:11}], damp:0.25},
  /* THE CORE — hot rock. The beds are nearly gone, cooked out; what is left is
     a matrix shot through with mineral. Moss high in the zone where it is
     still damp, and none of it low down where the magma is. */
  core:{matrix:STONE,
        beds:[{m:BRICK,every:11,of:1,p:0.22}],
        veins:[{m:DIRT,scale:0.04,cover:0.08,warp:12}], damp:0.35},
  default:{matrix:STONE, beds:[{m:DIRT,every:5,of:1,p:0.45}], veins:[], damp:0.35},
};
const suiteFor=id=>SUITES[id]||SUITES.default;

/* What the bulk rock is at a cell.

   Order of precedence is geological and matters: the matrix is the oldest
   thing, beds were laid down into it, and veins cut across the beds — so a
   vein wins over a bed, and a bed wins over the matrix. Reading them in the
   other order gives a rock where the youngest event is buried by the oldest,
   which is subtly wrong in a way that is hard to name but easy to see.

   d = cells below the local surface, y = absolute world row. */
function strataMat(d,y,x){
  x=x||0;
  const s=(d<VH*0.10)?SUITES.subsoil:suiteFor(zoneAt(y).id);
  // veins first — youngest, so they cut everything
  for(const v of s.veins){
    const [wx,wy]=warp2(x,y,v.warp,v.scale*0.7);
    if(fbm2(wx*v.scale,wy*v.scale,3)>1.0-v.cover)return v.m;
  }
  // then the bedding
  const bed=bedAt(x,y);
  const bi=Math.floor(bed);
  for(const b of s.beds){
    if(((bi%b.every)+b.every)%b.every<b.of){
      /* Patchiness along the bed, from a field rather than a coin flip — this
         is what lets a bed thin out and disappear over a stretch and come back
         further along, instead of dissolving into speckle. */
      if(fbm2(x*0.035,bi*2.7,2)<b.p)return b.m;
    }
  }
  return s.matrix;
}

/* Cave-wall noise. hillNoise is a 1-D function of x and gives every row the
   same wobble, which on a cave rim reads as vertical banding; this needs both
   axes. Three sines at incommensurate frequencies is enough turbulence for a
   silhouette that never repeats over the world's depth, at no setup cost. */
function caveNoise(x,y){
  return Math.sin(x*0.21+y*0.13)*0.50
        +Math.sin(x*0.07-y*0.31)*0.32
        +Math.sin(x*0.53+y*0.41)*0.18;
}

/* ═══════════════════════════════════════════════════════
   ROOM PRIMITIVES
   The three things every buried room is made of. Kept
   separate from the zone builders so a room is a short
   list of intentions rather than four nested loops.
═══════════════════════════════════════════════════════ */
/* How far inside its zone band a room's ceiling and floor sit — i.e. how much
   solid rock is left above and below it. The gap between two rooms is one
   room's `bot` plus the next one's `top`, so these two numbers are what set
   the rhythm of the whole descent. */
const ROOM_INSET={get top(){return (VH*0.30)|0;},get bot(){return (VH*0.30)|0;}};
// Fill a rect with one material, frozen so it holds as built.
function slab(x0,y0,x1,y1,m,v){
  /* Structural material is textured from its BIRTH POSITION, not filled with a
     random shade index. That one line is the difference between a wall and a
     rectangle: courses line up across a whole room, across the seam where
     carveRoom's lining meets a pillar, and across an arch springing off it,
     because every cell derives its role from where it sits in the world rather
     than from a coin flip. The random path it replaces put ±38 of per-cell
     salt-and-pepper on every wall in the underground, which swamped the mortar
     courses the renderer was already drawing underneath it. */
  const st=STRUCT_MAT[m], tone=st?toneOf(v):0;
  for(let y=Math.max(0,y0);y<=Math.min(H-1,y1);y++)
    for(let x=Math.max(0,x0);x<=Math.min(W-1,x1);x++){
      const gi=idx(x,y);
      grid[gi]=m;
      variant[gi]=st?builtVariant(m,x,y,tone):(v===undefined?(Math.random()*4|0):v);
      frozen[gi]=(m===EMPTY)?0:1;
    }
}
/* Hollow a room out of the rock and line it.

   `shell` is what the walls are made of and is the single biggest cue for what
   kind of place this is — raw STONE reads as a cave, BRICK as something built.
   The lining is two cells thick because one cell of frozen brick against a
   void gets eaten by the first thing that falls on it, and a room whose
   ceiling collapses on load is a bug rather than a feature. */
function carveRoom(x0,y0,x1,y1,shell){
  slab(x0-2,y0-2,x1+2,y1+2,shell);          // the lining, solid
  slab(x0,y0,x1,y1,EMPTY);                  // then the void inside it
  wakeRect(x0-3,y0-3,x1+3,y1+3);
  pixDirtyRect(x0-3,y0-3,x1+3,y1+3);
}
/* Stand a sprite on a floor, centred on a world column.

   The meadow's `place` is the wrong tool underground: it samples the terrain
   surface array to find the ground, and inside a carved room there is no
   surface — the floor is a slab the builder just laid, at a row it already
   knows. This takes that row directly.

   Returns false rather than clipping when the prop will not fit inside the
   room, so a builder can lay out props by fraction of the room's width and let
   the ones that fall off the end at a narrow window simply not appear. */
function prop(name,cx,bottomY,box){
  const w=spriteW(name),h=spriteH(name);
  if(!w||!h)return false;
  const gx=Math.round(cx-w/2);
  if(box&&(gx<box.x0+1||gx+w>box.x1-1))return false;
  if(gx<1||gx+w>=W-1||bottomY-h<1||bottomY>=H-1)return false;
  stampSprite(name,gx,bottomY);
  wakeRect(gx-1,bottomY-h-1,gx+w+1,bottomY+1);
  pixDirtyRect(gx-1,bottomY-h-1,gx+w+1,bottomY+1);
  return true;
}

/* A round-headed arch springing between two pillars.

   Drawn as a ring rather than a filled dome: the void under the arch is the
   point, and a filled semicircle would just be a lower ceiling. Thickness is
   in cells, and the test is on radius rather than on a scanline, which is what
   keeps the voussoirs stepping evenly around the curve instead of bunching at
   the crown the way a per-row width would. */
/* `rise` is optional and defaults to the half-span, which is a semicircle and
   exactly what this drew before. Pass a smaller one and it becomes a SEGMENTAL
   arch: the same ring, struck from a longer radius whose centre sits below the
   springline, so a wide bay can be spanned without the crown rising into the
   ceiling. That is the whole reason the vault can have a bay twice the width
   of its neighbours — a semicircle over a double span would want twice the
   headroom, and there are seven cells of masonry up there. */
function arch(cx,springY,halfSpan,m,thick,rise){
  thick=thick||2;
  const rs=(rise===undefined?halfSpan:Math.max(2,rise));
  const r=(halfSpan*halfSpan+rs*rs)/(2*rs);   // radius of the striking circle
  const cy=springY+(r-rs);                     // its centre, at or below the spring
  for(let y=springY-rs-thick;y<=springY;y++){
    for(let x=cx-halfSpan-thick;x<=cx+halfSpan+thick;x++){
      if(x<0||x>=W||y<0||y>=H)continue;
      const dx=x-cx,dy=y-cy;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<r||dist>r+thick)continue;
      const gi=idx(x,y);
      /* Voussoirs, not a strip of wall bent round a corner. The ring is
         unrolled into (arc length, depth) and the masonry is baked in THAT
         space, so the joints run radially — perpendicular to the curve — the
         way an arch is actually cut. Baking on (x,y) leaves horizontal bed
         joints sliding across the curve, which reads as a hole punched in a
         wall rather than as something built to stand up over one. */
      const arc=Math.round(Math.atan2(cy-y,x-cx)*r);
      grid[gi]=m;
      variant[gi]=STRUCT_MAT[m]?builtVariant(m,arc,Math.round(dist-r),0):(Math.random()*4|0);
      frozen[gi]=1;
    }
  }
}
/* A mounting for a world panel: two short posts and a lintel, stamped at the
   panel's own measured rect.

   carveChamber (below) already clears the rock a panel sits in, and inside a
   room there is no rock to clear — so a panel in a built room would float. The
   bracket is what puts it on the wall: the same read as a framed board bolted
   into a vault, and it costs the panel nothing because the frame sits OUTSIDE
   its footprint and never overlaps the text. */
function panelBracket(el,m){
  const r=el.getBoundingClientRect();
  if(r.width<=0||r.height<=0)return;
  const cr=canvas.getBoundingClientRect();
  const x0=Math.floor((r.left-cr.left)/SCALE)-3;
  const x1=Math.ceil((r.right-cr.left)/SCALE)+3;
  const y0=Math.floor((r.top-cr.top)/SCALE)+camY-3;
  const y1=Math.ceil((r.bottom-cr.top)/SCALE)+camY+3;
  slab(x0,y0,x1,y0+1,m);            // lintel over the top
  slab(x0,y1-1,x1,y1,m);            // a shelf under the bottom
  slab(x0,y0,x0+1,y1,m);            // and a post down each side
  slab(x1-1,y0,x1,y1,m);
  wakeRect(x0-1,y0-1,x1+1,y1+1);
  pixDirtyRect(x0-1,y0-1,x1+1,y1+1);
}

/* ═══════════════════════════════════════════════════════
   THE ROOMS
   One builder per zone. Each is handed its own row band and
   owns everything inside it.
═══════════════════════════════════════════════════════ */

/* ── THE VAULTS (Snap) ────────────────────────────────────
   A brick undercroft: pillars, round arches, moss in the joints, water finding
   its way in. Lit by glass sconces, which underground now glow (see glassLit)
   and give the room a cold pale light with no new material and no new code in
   the light path. The ghost is Snap's, and the room is built to earn it. */
// Rooms are built around their content envelope. Peripheral architecture stays
// outside the equipment; it no longer divides the work into arbitrary bays.
function buildExhibitShell(zone,y0,y1){
  const bounds=exhibitBounds(W,SCALE);
  const x0=Math.max(2,Math.floor(bounds.x/SCALE)-7),x1=Math.min(W-3,Math.ceil((bounds.x+bounds.width)/SCALE)+7);
  const ceil=y0+Math.floor(VH*.18),floor=ceil+Math.ceil(DEPTH_LAYOUT.bands[zone].minRoom/SCALE);
  const material=PANEL_FRAME[zone];
  carveRoom(x0,ceil,x1,floor,material);
  slab(x0,floor-1,x1,floor+1,material,2);
  slab(x0,ceil,x1,ceil+1,material,2);
  for(const x of [x0+1,x1-1]){
    slab(x,ceil+3,x,floor-3,material,1);
    for(let y=ceil+10;y<floor-5;y+=24){slab(x-1,y,x+1,y+3,STONE,2);slab(x,y+1,x,y+2,GLASS,0);}
  }
  if(zone==='workshop'){
    for(let x=x0+6;x<x1-4;x+=14)slab(x,ceil+2,x+1,ceil+4,WOOD,3);
    slab(x0,floor+2,x1,floor+3,BRICK,1);
  }else if(zone==='crypt'){
    for(let x=x0+5;x<x1-4;x+=20){slab(x,ceil+2,x+2,ceil+4,BRICK,2);}
    for(let x=x0+4;x<x1-3;x+=9)slab(x,floor-2,x+2,floor-2,MOSS,1);
  }else if(zone==='arcade'){
    // A fuse line under the ceiling: the merged room keeps the lab's one real
    // light source, so the cabinets are not the only thing lighting it.
    for(let x=x0+3;x<x1-2;x++){
      const i=idx(x,ceil+3);grid[i]=FUSE;variant[i]=0;frozen[i]=0;
    }
    for(let x=x0+3;x<x1-2;x+=8){slab(x,ceil+3,x+4,ceil+3,GLASS,1);}
    for(let y=floor-2;y<=floor;y++)for(let x=x0;x<=x1;x++){
      const m=((Math.floor(x/3)+Math.floor(y/3))&1)?BRICK:STONE;slab(x,y,x,y,m,2);
    }
  }else{
    slab(x0+2,floor-2,x1-2,floor-1,STONE,2);
    const lavaY=Math.min(H-4,floor+Math.floor(VH*.15));
    slab(x0,lavaY,x1,lavaY+3,LAVA,0);
    for(let y=lavaY;y<=lavaY+3;y++)for(let x=x0;x<=x1;x++)frozen[idx(x,y)]=0;
  }
  return {ceil,floor,x0,x1,exhibit:true};
}
function buildCrypt(y0,y1){
  return buildExhibitShell('crypt',y0,y1);
}

/* ── THE LAB (hackathons & awards) ────────────────────────
   Cut, not found: flat floor, tiled bands, no growth anywhere. The light is
   acid in glass — the only green emitter in the material set — so the room is
   lit by the thing it is full of. Overhead runs a fuse conduit, stamped live,
   which means the ceiling is a circuit: put fire to one end and the whole
   room's wiring runs. */
/* ── THE ARCADE (games) ───────────────────────────────────
   Low ceiling, checkerboard floor, a row of cabinets facing out. The screens
   are glass and therefore the light: the room is lit entirely by the things
   you would have been playing, which is the whole joke. */
function buildArcade(y0,y1){
  return buildExhibitShell('arcade',y0,y1);
}

/* ── THE WORKSHOP (about me) ──────────────────────────────
   The first room under the turf, and the only one that is not about work.
   Timber and lamplight directly below the cottage on the meadow, so it reads
   as that cottage's cellar — which is what lets it be personal without a
   label saying so, and what makes the cold brick of the vaults underneath it
   land as a change of subject rather than as more of the same.

   Every other room is cut out of rock. This one is BUILT: a timber shell with
   joists overhead and a packed-earth floor, so even the construction says
   somebody lives here. */
function buildWorkshop(y0,y1){
  return buildExhibitShell('workshop',y0,y1);
}
/* Lamps, a bench, and the clutter of somebody's workroom. */
function furnishWorkshop(box){
  const {ceil,floor,x0,x1,bay,hearthX}=box;
  // hanging lanterns on alternate joists — glass, so they actually light it
  for(let x=x0+2+bay,k=0;x<=x1-2;x+=bay*2,k++){
    const ly=ceil+((VH*0.09)|0);
    if(blocked(x-3,ceil+3,x+3,ly+3))continue;
    for(let y=ceil+4;y<ly-2;y++){          // the chain
      const gi=idx(x,y);
      grid[gi]=WOOD;variant[gi]=3;frozen[gi]=1;
    }
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      if(dx*dx+dy*dy>5)continue;
      putCell(x+dx,ly+dy,GLASS,dx===0&&dy===0?2:0);
      frozen[idx(x+dx,ly+dy)]=1;
    }
    wakeRect(x-3,ceil+3,x+3,ly+3);
    pixDirtyRect(x-3,ceil+3,x+3,ly+3);
  }
  // the desk, kept off the hearth wall, and the rest of the room's clutter
  propClear('console',  ((x0+x1)/2)|0,       floor-2,box);
  propClear('crates',   x0+((x1-x0)*0.72)|0, floor-2,box);
  propClear('bookstack',x0+((x1-x0)*0.86)|0, floor-2,box);
  propClear('bookstack',hearthX+14,          floor-2,box);
  propClear('candelabra',x0+((x1-x0)*0.34)|0,floor-2,box);
}

/* ═══ CLASSICAL ORDER ═══
   The core is the room about school, so it is built like a school: a fluted
   colonnade under an entablature under a pediment. These three are the whole
   vocabulary, and they are worth having as primitives rather than as one long
   builder because a column has to be placeable one at a time — the panel in
   that room takes a bay out of the middle, and the colonnade has to skip it
   the way a real facade would have a doorway. */

// One fluted column, capital to base, standing between topY and botY.
function column(cx,topY,botY){
  /* Seven cells across, not five. At five the shaft carried one shadowed flute
     either side of a highlight and read, at this dither, as a dark line — two
     of them in a room this size looked like scaffolding rather than an order.
     Seven gives three flutes and, more importantly, enough lit surface that
     the column reads as pale stone standing in a warm room. */
  const HW=3;
  /* Tone across the seven cells of the shaft: dark at both arrises, lit either
     side of centre. At this width a column cannot have both real flutes and a
     cylinder, and the cylinder is the one that makes it read as a column — so
     the shaft is drum-coursed ashlar with a round light on it.

     What was here alternated variants 1 and 7, which after JITTER amounted to
     a 3/255 difference. That is why the colonnade rendered as seven flat bars:
     the shading was there in the source and had never once reached a pixel. */
  const CYL=[1,0,2,2,0,1,1];
  for(let y=topY+3;y<=botY-2;y++){
    if(y<0||y>=H)continue;
    for(let dx=-HW;dx<=HW;dx++){
      const x=cx+dx;
      if(x<0||x>=W)continue;
      const gi=idx(x,y);
      grid[gi]=STONE;variant[gi]=stoneVariant(x,y,CYL[dx+HW]);frozen[gi]=1;
    }
  }
  slab(cx-HW-1,topY+1,cx+HW+1,topY+2,STONE,7);   // capital
  slab(cx-HW-2,topY-1,cx+HW+2,topY,STONE,7);     // abacus
  slab(cx-HW-1,botY-1,cx+HW+1,botY,STONE,7);     // base
  slab(cx-HW-2,botY+1,cx+HW+2,botY+2,STONE,7);   // plinth
  wakeRect(cx-HW-3,topY-2,cx+HW+3,botY+3);
  pixDirtyRect(cx-HW-3,topY-2,cx+HW+3,botY+3);
}
// Cornice, dentil course, architrave. `y` is the top of the band.
function entablature(x0,x1,y){
  slab(x0,y,x1,y+1,STONE,7);
  for(let x=x0;x<=x1;x+=3)slab(x,y+2,x+1,y+2,STONE,1);   // dentils
  slab(x0,y+3,x1,y+4,STONE,7);
}
/* The gable over it: a pale triangle with a recessed tympanum inside.

   Two things had to change from the obvious version. The raking cornice was
   three cells thick, which at this dither is below the width where a pale line
   survives — so all you saw was the dark tympanum, and a dark triangle with a
   thin apex reads as two wings sloping away from a notch rather than as one
   roof. And the tympanum ran the full height, which is what put that notch at
   the apex in the first place. Thicker cornice, and the recess stops well short
   of the top so the apex stays solid. */
function pediment(cx,baseY,halfW){
  const h=Math.max(5,(halfW*0.45)|0);
  const CORNICE=5;
  for(let r=0;r<h;r++){
    const w=Math.round(halfW*(1-r/h));
    slab(cx-w,baseY-r,cx+w,baseY-r,STONE,7);
  }
  for(let r=2;r<h*0.62;r++){
    const w=Math.round(halfW*(1-r/h))-CORNICE;
    if(w>0)slab(cx-w,baseY-r,cx+w,baseY-r,STONE,1);
  }
  wakeRect(cx-halfW-1,baseY-h-1,cx+halfW+1,baseY+1);
  pixDirtyRect(cx-halfW-1,baseY-h-1,cx+halfW+1,baseY+1);
}

/* ── THE CORE (education) ─────────────────────────────────
   The bottom of the shaft: a lecture hall built over magma. It is the only
   room lit by the world rather than by anything installed in it, and the only
   one with a facade — the descent ends at a building rather than at a cavity.

   The lava is a SEAM, not a floor. A solid slab saturates the light buffer and
   the whole frame blows out to white — the glow has to have rock under it to
   read as heat rather than as a blank exposure. */
function buildCore(y0,y1){
  return buildExhibitShell('core',y0,y1);
}
/* The colonnade, plus the furniture of a room for sitting still in.

   Columns are furnished rather than built because the panel takes a bay out of
   the middle of them, and a facade that simply stops where a doorway is is
   more convincing than one carved through afterwards. */
function furnishCore(box){
  const {floor,x0,x1,colTop,colBot}=box;
  /* Spanned rather than spaced. Seven columns at seven fixed fractions, each
     vetoed if anything overlapped it, left two standing — the plaque hangs
     across the middle of this room and took the other five with it. Dividing
     the free runs instead gives a colonnade either side of the plaque, which
     is what a facade with a doorway in it looks like anyway. */
  const COL_HW=5, PITCH=13;
  for(const [sx0,sx1] of freeSpans(x0+COL_HW+2,x1-COL_HW-2,colTop-2,colBot+3,COL_HW*2+4)){
    const n=Math.max(1,Math.round((sx1-sx0)/PITCH));
    for(let k=0;k<n;k++){
      const cx=Math.round(sx0+(sx1-sx0)*(n===1?0.5:k/(n-1)));
      if(blocked(cx-COL_HW,colTop-2,cx+COL_HW,colBot+3))continue;
      column(cx,colTop,colBot);
    }
  }
  /* A lectern and two stacks of books: the only room in the world furnished
     for sitting still, directly above the only room lit by magma. Which is the
     joke, and also why the books are BERRY — berry is flammable sprite debris,
     so they can in fact burn. */
  /* Placed into the free floor rather than at fixed fractions, for the same
     reason the columns are: at 0.18 and 0.82 both stacks landed inside a
     column plinth, where stampSprite skipped most of their cells and left two
     red stubs at the base of the order. */
  const spots=freeSpans(x0+8,x1-8,floor-16,floor-4,14);
  const kit=['bookstack','lectern','bookstack'];
  spots.forEach(([sx0,sx1],i)=>propClear(kit[i%kit.length],((sx0+sx1)/2)|0,floor-6,box));
}

/* Caves in the rock BETWEEN rooms.

   Deliberately kept out of the rooms themselves: a room is a built thing and
   should have straight walls. The caves are what makes the rock between them
   read as rock rather than as the gap between two sets, and some of them chain
   into a route down that is not the shaft. */
function spawnCaves(y0,y1){
  const stepY=Math.max(8,(VH*0.30)|0);
  for(let y=y0;y<y1;y+=stepY){
    const n=1+(Math.random()*2|0);
    for(let k=0;k<n;k++){
      const cx=((Math.random()*0.80+0.10)*W)|0;
      const cy=y+((Math.random()*2-1)*stepY*0.4)|0;
      const rx=Math.max(4,(W*(0.06+Math.random()*0.09))|0);
      const ry=Math.max(3,(VH*(0.030+Math.random()*0.045))|0);
      for(let py=cy-ry*2;py<=cy+ry*2;py++){
        if(py<y0||py>=y1||py<0||py>=H)continue;
        for(let px=cx-rx*2;px<=cx+rx*2;px++){
          if(px<1||px>=W-1)continue;
          const dx=(px-cx)/rx,dy=(py-cy)/ry;
          // the noise pushes the rim in and out by a third of its radius, which
          // is what turns an oval into something that reads as eaten out of rock
          if(dx*dx+dy*dy>1.0+caveNoise(px,py)*0.38)continue;
          putCell(px,py,EMPTY,0);
          frozen[idx(px,py)]=0;
        }
      }
    }
  }
}

/* ═══ CONTACTS ═══
   What happens where rock meets air.

   This is the half of the grammar that strataMat cannot express, and the
   reason it is a separate pass rather than another rule in the suite: a suite
   is a function of position only, and "is there a void next to me, and is it
   above me or below me" is a question about the world AFTER the rooms and
   caves have been cut. So it runs last, once, over everything.

   It is also the rule that does the most visible work. Every void in this
   world is carved by thresholding a noise field, which gives a clean one-cell
   rim everywhere — mathematically a surface, visually a cut. Real rock does
   not end at a line: it weathers where the air touches it, it grows things
   where the water sits, and the debris off the face piles at the bottom. Those
   three are what turn a hole into a place.

   Only UNFROZEN cells are touched, which is exactly the natural rock: every
   wall, pillar, arch and floor a room builder laid is frozen and comes through
   this pass untouched. A vault does not grow moss on its own masonry here —
   the room builders place that deliberately where they want it. */
function faceOf(x,y){
  // which way the air is, if any. Bit per direction, cheap and enough.
  let f=0;
  if(y>0   &&grid[idx(x,y-1)]===EMPTY)f|=1;   // air above → this is a floor
  if(y<H-1 &&grid[idx(x,y+1)]===EMPTY)f|=2;   // air below → this is a ceiling
  if(x>0   &&grid[idx(x-1,y)]===EMPTY)f|=4;
  if(x<W-1 &&grid[idx(x+1,y)]===EMPTY)f|=8;
  return f;
}
/* Is there standing water within `r` cells? Moss answers to water far more
   than to anything else, and a room with a drip in it should be visibly
   greener around that drip than at the far end. */
function nearWater(x,y,r){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(nx<0||nx>=W||ny<0||ny>=H)continue;
    if(grid[idx(nx,ny)]===WATER)return true;
  }
  return false;
}
function spawnContacts(){
  const y0=Math.max(0,(VH*0.9)|0);
  for(let y=y0;y<H;y++){
    const z=zoneAt(y), s=suiteFor(z.id);
    for(let x=0;x<W;x++){
      const gi=idx(x,y);
      const m=grid[gi];
      if(frozen[gi])continue;                       // architecture is not weather
      if(m!==STONE&&m!==DIRT&&m!==BRICK)continue;   // only the bulk rock
      const f=faceOf(x,y);
      if(!f)continue;                               // buried: nothing reaches it

      /* Coherent along the face. The field is sampled in world coords at a
         scale of a few cells, so growth and weathering come in patches that
         run along a rim — which is what they do — instead of alternating
         cell by cell the way an independent draw would. */
      const n=fbm2(x*0.11,y*0.11,3);

      /* ── damp growth ──
         Strongest on undersides, because that is where water hangs and where
         it reads best: moss on a ceiling breaks the hard carved rim and hangs
         INTO the void, which is the one place the eye is already looking.
         Water nearby overrides the zone's own dampness entirely — a drip makes
         its own microclimate. */
      const wet=nearWater(x,y,4);
      let dampness=wet?0.95:s.damp;
      if(f&2)dampness*=1.15;                        // ceiling: drips form here
      else if(f&1)dampness*=0.80;                   // floor: water runs off it
      else dampness*=0.90;                          // wall
      if(m!==BRICK&&n>1.0-dampness*0.42){
        grid[gi]=MOSS;variant[gi]=hash2i(x,y)&3;
        continue;
      }

      /* ── weathered rind ──
         Dry rock does not grow anything, but it does break down where it is
         exposed. A patchy fringe of DIRT along a face is enough: it puts a
         second value against the rim so the face stops reading as one flat
         plane meeting one flat void. Stone only — dirt weathering into dirt
         is not a visible event. */
      if(m===STONE&&n<0.30-s.damp*0.12){
        grid[gi]=DIRT;variant[gi]=hash2i(x+7,y)&3;
      }
    }
  }
  wakeRect(0,y0,W-1,H-1);
  pixDirtyRect(0,y0,W-1,H-1);
}

/* Build every room, then the rock between them.

   ROOM_BOX is kept because three later passes need to know where the void
   actually ended up: the shaft has to stop at a floor rather than run through
   it, the panels have to be hung inside their own room, and the caves have to
   avoid the rooms entirely. */
const ROOM_BOX={};
function spawnStrata(surf){
  const build={workshop:buildWorkshop,crypt:buildCrypt,arcade:buildArcade,core:buildCore};
  const order=[];
  for(const z of ZONES){
    const fn=build[z.id];
    if(!fn)continue;
    const {y0,y1}=zoneRows(z);
    ROOM_BOX[z.id]=fn(y0,y1);
    order.push(z.id);
  }
  // caves in the leftover rock — the band between one room's floor and the
  // next room's ceiling, wherever that band is thick enough to hold one
  for(let k=0;k<order.length-1;k++){
    const a=ROOM_BOX[order[k]],b=ROOM_BOX[order[k+1]];
    if(b.ceil-a.floor>VH*0.18)spawnCaves(a.floor+((VH*0.06)|0),b.ceil-((VH*0.06)|0));
  }
  /* A perched water table in the rock above the first room: dig into it from
     the side and it drains down the shaft, which is the one thing up here that
     rewards breaking a wall on purpose.

     It has to sit BELOW the meadow surface, which is around 0.95–0.99 of the
     first screen — at 0.72 it was in open sky over the footpath, and the whole
     pocket fell as rain and pooled between the cottage and the signpost. Keyed
     off the first room's ceiling now, so it stays buried however the zone
     bands are rebalanced. */
  {
    const firstRoom=ROOM_BOX[ZONES[1]&&ZONES[1].id];
    const wy=Math.round(firstRoom?firstRoom.ceil-VH*0.14:VH*1.18);
    const cx=(W*0.30)|0,rx=(W*0.15)|0,ry=Math.max(3,(VH*0.045)|0);
    for(let py=wy-ry;py<=wy+ry;py++)for(let px=cx-rx;px<=cx+rx;px++){
      if(px<1||px>=W-1||py<0||py>=H)continue;
      const dx=(px-cx)/rx,dy=(py-wy)/ry;
      if(dx*dx+dy*dy>1.0+caveNoise(px,py)*0.25)continue;
      putCell(px,py,py>wy-ry*0.3?WATER:EMPTY,0);
      frozen[idx(px,py)]=0;
    }
  }
  // contacts last: it is the only rule that needs the voids to already exist
  spawnContacts();
  wakeRect(0,VH,W-1,H-1);
}

/* ═══════════════════════════════════════════════════════
   FURNISHING — what goes in a room once the work is hung

   Split out of the builders, and it has to be: the builders run inside
   spawnStrata, which happens BEFORE the panels exist, and carveChamber then
   hollows a panel-sized hole through whatever the builder had just put there.

   That was not cosmetic. Every one of the lab's five acid tanks fell inside a
   panel's chamber, so on load the chambers cut the tanks open, the breach rule
   in step() correctly noticed each column now had air beside it, and 483 of
   514 acid cells unfroze and ran across the floor before anyone had scrolled
   to them. The room was flooding itself.

   So: architecture first (walls, floors, pillars, conduit), then the panels,
   then furniture placed around what is now actually there. Furniture is the
   only layer that has to yield, which is also the right order for a room.
═══════════════════════════════════════════════════════ */

/* Footprints nothing may be placed into: the hung panels, and the shaft.

   Recorded in world cells with a margin, at the moment each panel is measured,
   because a DOM rect is the only thing that knows how tall a panel came out at
   this window width. */
const PANEL_RECTS=[];
function blocked(bx0,by0,bx1,by1){
  for(const r of PANEL_RECTS){
    if(bx1>=r.x0&&bx0<=r.x1&&by1>=r.y0&&by0<=r.y1)return true;
  }
  // and the shaft, which is a route rather than a shelf
  if(SHAFT&&bx1>=SHAFT.x0-2&&bx0<=SHAFT.x1+2)return true;
  return false;
}
/* The horizontal runs of a room left over once the panels are hung, within a
   given band of rows.

   Placing furniture at fixed fractions of the room and rejecting whatever
   collides does not work when the panels are 39% of the room's width each:
   the lab asked for five tanks at five fixed columns and got none, because
   every one of them was under a panel somewhere. Asking what space is actually
   free and then dividing THAT is the difference between a room that adapts to
   its contents and a room that comes out empty at some window widths. */
function freeSpans(x0,x1,y0,y1,minW){
  const busy=new Uint8Array(Math.max(0,x1-x0+1));
  const mark=(a,b)=>{for(let x=Math.max(x0,a);x<=Math.min(x1,b);x++)busy[x-x0]=1;};
  for(const r of PANEL_RECTS)if(y1>=r.y0&&y0<=r.y1)mark(r.x0,r.x1);
  if(SHAFT)mark(SHAFT.x0-2,SHAFT.x1+2);
  const spans=[];
  let run=-1;
  for(let i=0;i<busy.length;i++){
    if(!busy[i]){if(run<0)run=i;}
    else{if(run>=0&&i-run>=minW)spans.push([x0+run,x0+i-1]);run=-1;}
  }
  if(run>=0&&busy.length-run>=minW)spans.push([x0+run,x0+busy.length-1]);
  return spans;
}
