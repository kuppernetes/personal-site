/* prop(), but it declines rather than overwrites. Returns whether it landed,
   so a caller can fall through to its next candidate position. */
function propClear(name,cx,bottomY,box){
  const w=spriteW(name),h=spriteH(name);
  if(!w||!h)return false;
  const gx=Math.round(cx-w/2);
  if(blocked(gx-1,bottomY-h-1,gx+w+1,bottomY+1))return false;
  if(!prop(name,cx,bottomY,box))return false;
  // A room's furniture is furniture: register it as a body so it can be knocked
  // over, rather than leaving it as masonry that happens to be chair-shaped.
  // Dormant on arrival — see makeSpriteBody.
  if(SB_KINDS.has(name))makeSpriteBody(name,gx,bottomY);
  return true;
}

/* ═══════════════════════════════════════════════════════
   SPRITE BODIES — the props, as rigid bodies whose PIXELS are the shape
═══════════════════════════════════════════════════════ */
/* There were already two halves of this in the file and they had never been
   introduced to each other.

   The oriented-box solver above (makeBody / contact / resolveWorld) has real
   rotation, impulse dynamics with restitution and friction, sleeping, and —
   the part that matters — restampBodies, which writes a body's footprint into
   the CA grid so sand piles on a body that is turning. That is the whole trick
   a falling-sand world needs from its rigid bodies. It has been dead code
   since the project panels moved to the DOM, and it was box-only: hw/hh, four
   corners, and a decorative texture on a quad. The pixels were not the shape.

   tryChunkDetach has the other half: a connected-component flood fill that
   drops a region of masonry as one coherent piece, carrying each cell's baked
   variant along so the coursing survives the fall. Pixel-accurate shape and
   material identity — but it can only translate.

   This is the union. The sprite's own cells are the body: they decide its
   silhouette, they carry their own material and shade into the grid, and when
   one of them is burnt or dissolved the body loses that pixel and carries on
   with a hole in it.

   Two decisions are load-bearing:

   ROTATION IS QUANTISED to SB_ANGLES steps. These sprites are 7-24 cells tall.
   Rotating that by an arbitrary angle and resampling into a one-cell-per-pixel
   grid shimmers badly and eats the silhouette, which is the only thing a prop
   this size has. Sixteen pre-rasterised angles cost a few KB, never shimmer,
   and read as deliberate. Each angle is built by INVERSE mapping — for every
   target cell, rotate backwards and sample the source — because forward
   mapping leaves holes wherever two source cells round to the same target.

   A BODY STAMPS ITS OWN MATERIALS, not a placeholder. RIGID renders as nothing
   and is drawn over the top as a textured quad, which opts a body out of the
   entire palette: no coursing, no relief, no light. Writing real WOOD/GLASS/
   STONE means a toppled cabinet is lit, shaded and posterized by exactly the
   same code as the wall behind it — and burns and dissolves by the same rules
   too. */
const SB_ANGLES=16;
const spriteBodies=[];
/* Which props are furniture rather than architecture. The sarcophagus is
   deliberately absent: a stone chest on a brick plinth should read as part of
   the room, and a tomb that skids across the floor is a different joke. */
const SB_KINDS=new Set(['crates','console','cylinder','cabinet','lowboy',
                        'vending','lectern','bookstack','candelabra','urn',
                        'specs']);

/* Per-sprite geometry, built once and shared by every instance of it. */
const SB_ART={};
function sbArt(name){
  if(SB_ART[name]!==undefined)return SB_ART[name];
  const art=SPRITES[name];
  if(!art){SB_ART[name]=null;return null;}
  const h=art.length, w=spriteW(name);
  const ox=w>>1, oy=h>>1;
  // source cells in local coords, plus a lookup so the inverse map is O(1)
  const src=[], srcAt=new Int16Array(w*h).fill(-1);
  for(let ry=0;ry<h;ry++){
    const row=art[ry];
    for(let rx=0;rx<row.length;rx++){
      const spec=SPRITE_MATS[row[rx]];
      if(!spec)continue;
      srcAt[ry*w+rx]=src.length;
      src.push({lx:rx-ox,ly:ry-oy,m:spec.m,v:spec.v});
    }
  }
  if(!src.length){SB_ART[name]=null;return null;}
  const R=Math.ceil(Math.sqrt(ox*ox+oy*oy))+2;
  const ang=[];
  for(let k=0;k<SB_ANGLES;k++){
    const th=k*2*Math.PI/SB_ANGLES, c=Math.cos(th), sn=Math.sin(th);
    const cells=[];
    const low=new Map();                       // lowest cell per column
    for(let ty=-R;ty<=R;ty++)for(let tx=-R;tx<=R;tx++){
      // a world offset maps back into sprite space by the INVERSE rotation
      const sx=Math.round(tx*c+ty*sn), sy=Math.round(-tx*sn+ty*c);
      const ax=sx+ox, ay=sy+oy;
      if(ax<0||ax>=w||ay<0||ay>=h)continue;
      const si=srcAt[ay*w+ax];
      if(si<0)continue;
      cells.push(tx,ty,si);
      const cur=low.get(tx);
      if(cur===undefined||ty>cur)low.set(tx,ty);
    }
    /* Contact probes. A body rests correctly on uneven ground only if it is
       tested at the LOWEST cell of several columns; probing a bounding box's
       corners instead is what makes a physics prop hover over a step or sink
       into one. Nine columns spread across the width, plus the extremes of the
       silhouette so a body wedged into a wall gets pushed back out of it. */
    const cols=[...low.keys()].sort((a,b)=>a-b);
    const probes=[];
    const NP=Math.min(9,cols.length);
    for(let i=0;i<NP;i++){
      const tx=cols[NP===1?0:Math.round(i*(cols.length-1)/(NP-1))];
      probes.push(tx,low.get(tx));
    }
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(let i=0;i<cells.length;i+=3){
      if(cells[i]<x0)x0=cells[i]; if(cells[i]>x1)x1=cells[i];
      if(cells[i+1]<y0)y0=cells[i+1]; if(cells[i+1]>y1)y1=cells[i+1];
    }
    const my=((y0+y1)/2)|0;
    probes.push(x0,my, x1,my, ((x0+x1)/2)|0,y0);
    ang.push({cells:new Int16Array(cells),probes:new Int16Array(probes),
              hw:Math.max(-x0,x1),hh:Math.max(-y0,y1)});
  }
  const A={src,ang,w,h,ox,oy,rad:R};
  SB_ART[name]=A;
  return A;
}

/* A prop, registered where prop() has just stamped it.

   Born DORMANT: its cells are ordinary frozen sprite pixels in the grid, it
   owns no dynamics, and it costs exactly what the prop cost before. It becomes
   a live body only when something disturbs it — its support goes, a blast
   reaches it, or the visitor picks it up. That is both the cheap way to carry
   thirty of these and the honest one: a cabinet standing on a floor is not
   doing any physics. */
function makeSpriteBody(name,gx,bottomY){
  const A=sbArt(name);
  if(!A)return null;
  const n=A.src.length;
  const mass=Math.max(1,n*0.010);
  let r2=0; for(const c of A.src)r2+=c.lx*c.lx+c.ly*c.ly;
  const b={
    name, art:A,
    // world position of the sprite's local origin. prop() put its bottom row
    // on bottomY and its left column on gx, so this backs that out.
    x:gx+A.ox, y:bottomY-(A.h-1)+A.oy,
    a:0, ang:0, vx:0, vy:0, va:0,
    invM:1/mass, invI:1/Math.max(1,mass*(r2/n)*0.5),
    e:0.05, fric:0.66,
    live:false, sleeping:true, sleepT:0, dragging:false,
    alive:new Uint8Array(n).fill(1),
    owned:[],
  };
  spriteBodies.push(b);
  return b;
}

/* What a body lands ON. Deliberately wider than solidT, which only knows
   STONE/DIRT/GRASS: every floor underground is brick, dressed stone or timber,
   and a body that collided only with terrain fell through all five rooms. */
function sbSolid(x,y){
  if(x<0||x>=W||y<0||y>=H)return false;
  const i=idx(x,y), m=grid[i];
  if(m===STONE||m===DIRT||m===GRASS||m===MASK)return true;
  return (m===BRICK||m===WOOD||m===GLASS||m===THATCH)&&frozen[i]===1&&inChunk[i]===0;
}

/* Lift a live body's cells back out of the grid, noticing on the way which of
   them did not survive. Anything that is no longer OUR material was burnt,
   dissolved or blasted while it sat there — that pixel is struck off the body
   for good, which is how a body damaged in flight keeps the damage. */
function sbUnstamp(b){
  const src=b.art.src;
  for(let k=0;k<b.owned.length;k+=2){
    const gi=b.owned[k], si=b.owned[k+1];
    if(grid[gi]===src[si].m){
      grid[gi]=EMPTY;variant[gi]=0;frozen[gi]=0;inChunk[gi]=0;
      pixDirty(gi%W,(gi/W)|0);
    } else {
      b.alive[si]=0;
    }
  }
  b.owned.length=0;
}

function sbStamp(b){
  const A=b.art;
  const k=((Math.round(b.a/(2*Math.PI)*SB_ANGLES)%SB_ANGLES)+SB_ANGLES)%SB_ANGLES;
  b.ang=k;
  const cells=A.ang[k].cells, src=A.src;
  const bx=Math.round(b.x), by=Math.round(b.y);
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let i=0;i<cells.length;i+=3){
    const si=cells[i+2];
    if(!b.alive[si])continue;
    const gx=bx+cells[i], gy=by+cells[i+1];
    if(gx<1||gx>=W-1||gy<0||gy>=H)continue;
    const gi=idx(gx,gy), g=grid[gi];
    if(isStatic(g))continue;            // terrain and page text are not ours to move
    if(g!==EMPTY)displace(gx,gy);       // shove loose grains out of the way
    const s=src[si];
    grid[gi]=s.m;variant[gi]=s.v;frozen[gi]=1;
    /* inChunk is what keeps step() off these cells: a frozen cell that a
       falling chunk owns returns immediately. Without it the sim spends every
       frame trying to decompose a body that is mid-air, and a tumbling crate
       sheds itself into splinters before it ever lands. */
    inChunk[gi]=1;
    b.owned.push(gi,si);
    if(gx<x0)x0=gx; if(gy<y0)y0=gy; if(gx>x1)x1=gx; if(gy>y1)y1=gy;
  }
  if(x1>=x0){wakeRect(x0-1,y0-1,x1+1,y1+1);pixDirtyRect(x0-1,y0-1,x1+1,y1+1);}
}

/* Wake a dormant prop into a body.

   Its pixels are read out of the grid rather than assumed, so a prop that has
   already had half of it burnt away wakes up as the half that is left. */
function sbActivate(b){
  if(b.live)return;
  const A=b.art, cells=A.ang[b.ang].cells, src=A.src;
  const bx=Math.round(b.x), by=Math.round(b.y);
  for(let i=0;i<cells.length;i+=3){
    const si=cells[i+2];
    if(!b.alive[si])continue;
    const gx=bx+cells[i], gy=by+cells[i+1];
    if(gx<0||gx>=W||gy<0||gy>=H){b.alive[si]=0;continue;}
    const gi=idx(gx,gy);
    if(grid[gi]!==src[si].m||frozen[gi]!==1){b.alive[si]=0;continue;}
    grid[gi]=EMPTY;variant[gi]=0;frozen[gi]=0;inChunk[gi]=0;
    wake3(gx,gy);pixDirty(gx,gy);
  }
  b.live=true;b.sleeping=false;b.sleepT=0;b.owned.length=0;
}

/* Come to rest: hand the cells back to the world as ordinary frozen sprite
   pixels, so a settled body burns, dissolves and takes weight exactly as the
   prop it was before anybody pushed it over. */
function sbSettle(b){
  for(let k=0;k<b.owned.length;k+=2)inChunk[b.owned[k]]=0;
  b.live=false;b.sleeping=true;b.vx=b.vy=b.va=0;b.sleepT=0;
}

/* Which way is OUT of the material this probe is buried in, and how far.

   The first version answered "up, always", copying the box solver above — and
   the box solver got away with it because a box only ever probed the ground
   under itself. A sprite body probes its own silhouette, so its side and top
   probes sit inside the wall beside it and the ceiling over it all the time,
   and every one of them was shoving the body upward by up to five cells a
   frame. An arcade cabinet climbed 330 cells out of its room.

   Four short walks, shortest wins. Capped at 8: a probe buried deeper than
   that is a tunnelling event, and easing it out over a few frames reads far
   better than teleporting it clear in one. */
const SB_ESC=[[0,-1],[0,1],[-1,0],[1,0]];
function sbEscape(x,y){
  let best=99,bnx=0,bny=-1;
  for(let k=0;k<4;k++){
    const dx=SB_ESC[k][0],dy=SB_ESC[k][1];
    let n=0,cx=x,cy=y;
    while(n<8&&sbSolid(cx,cy)){cx+=dx;cy+=dy;n++;}
    if(n<best){best=n;bnx=dx;bny=dy;}
  }
  return [bnx,bny,Math.min(5,best)];
}
function sbResolveWorld(b){
  const P=b.art.ang[b.ang].probes;
  const floorY=H-5;
  /* Gather the contacts BEFORE resolving any of them, and split the positional
     correction between them.

     contact() pushes the body out by 40% of the penetration it is handed. That
     is fine for one contact and catastrophic for twelve: a cabinet resting flat
     on a floor reports every one of its bottom probes as penetrating by about a
     cell, and resolving them in sequence moved it twelve times as far as any of
     them asked for. Three solver iterations on top of that launched the first
     version of this 440 cells up through two rooms and into the lab.

     Sharing the correction is the standard fix and it is the whole difference
     between a body that settles and a body that explodes. The velocity impulse
     is deliberately NOT shared — resolving the same contact set repeatedly is
     what a sequential-impulse solver is supposed to do, and it just converges. */
  const hits=[];
  for(let i=0;i<P.length;i+=2){
    const px=b.x+P[i], py=b.y+P[i+1];
    if(px<1)hits.push(px,py,1,0,1-px);
    else if(px>W-2)hits.push(px,py,-1,0,px-(W-2));
    if(py>floorY)hits.push(px,py,0,-1,py-floorY);
    else if(sbSolid(px|0,py|0)){
      const e=sbEscape(px|0,py|0);
      hits.push(px,py,e[0],e[1],e[2]);
    }
  }
  const n=hits.length/5;
  if(!n)return;
  const share=1/n;
  for(let i=0;i<hits.length;i+=5)
    contact(b,hits[i],hits[i+1],hits[i+2],hits[i+3],hits[i+4],share);
}

/* Body-against-body, as axis-aligned overlap on the current angle's extent.
   A real SAT pass would be more correct and, for a row of arcade cabinets
   toppling into each other, entirely unnoticeable. */
function sbResolvePairs(){
  const live=spriteBodies.filter(b=>b.live&&!b.sleeping);
  for(let i=0;i<live.length;i++)for(let j=0;j<spriteBodies.length;j++){
    const a=live[i], b=spriteBodies[j];
    if(a===b||!b.live)continue;
    const ea=a.art.ang[a.ang], eb=b.art.ang[b.ang];
    const ox=(ea.hw+eb.hw)-Math.abs(a.x-b.x);
    const oy=(ea.hh+eb.hh)-Math.abs(a.y-b.y);
    if(ox<=0||oy<=0)continue;
    let nx=0,ny=0,pen;
    if(ox<oy){pen=ox;nx=(a.x<b.x)?-1:1;}else{pen=oy;ny=(a.y<b.y)?-1:1;}
    const rvx=b.vx-a.vx, rvy=b.vy-a.vy, vn=rvx*-nx+rvy*-ny;
    const impact=vn<-0.4;
    if(impact&&b.sleeping){b.sleeping=false;b.sleepT=0;}
    const ia=a.dragging?0:a.invM;
    const ib=(b.sleeping&&!impact)||b.dragging?0:b.invM;
    const tot=ia+ib; if(tot===0)continue;
    a.x+=nx*pen*(ia/tot); a.y+=ny*pen*(ia/tot);
    b.x-=nx*pen*(ib/tot); b.y-=ny*pen*(ib/tot);
    if(vn<0){
      const jj=-1.02*vn/tot, jx=jj*-nx, jy=jj*-ny;
      a.vx-=jx*ia;a.vy-=jy*ia; b.vx+=jx*ib;b.vy+=jy*ib;
    }
  }
}

/* Has a dormant prop lost the ground under it?

   Cheap because it only asks the bottom-profile probes, and only on a cadence:
   a room full of standing furniture should cost nothing to leave standing. */
function sbCheckSupport(b){
  const P=b.art.ang[b.ang].probes;
  const bx=Math.round(b.x), by=Math.round(b.y);
  for(let i=0;i<P.length;i+=2){
    const gx=bx+P[i], gy=by+P[i+1]+1;
    if(gy>=H)return true;
    if(sbSolid(gx,gy))return true;
  }
  return false;
}

/* Everything within R of (x,y) stops being furniture and starts being debris.
   Called from the bomb blast, which is the one event in the world violent
   enough that leaving the crates standing would be conspicuous. */
function wakeSpriteBodies(x,y,R){
  for(const b of spriteBodies){
    if(b.dragging)continue;
    const dx=b.x-x, dy=b.y-y, rr=R+b.art.rad;
    if(dx*dx+dy*dy>rr*rr)continue;
    sbActivate(b);
    b.sleeping=false;b.sleepT=0;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    b.vx+=(dx/d)*4.5; b.vy+=(dy/d)*4.5-1.5; b.va+=(Math.random()-0.5)*0.22;
    clampVel(b);
  }
}

let sbFrame=0;
function updateSpriteBodies(){
  if(!spriteBodies.length)return;
  sbFrame++;
  // dormant props: has the floor gone? asked on a cadence, and only for props
  // near enough to the camera band for the answer to be visible
  if((sbFrame&7)===0){
    for(const b of spriteBodies){
      if(b.live)continue;
      if(b.y<camY-VH||b.y>camY+VH*2)continue;
      if(!sbCheckSupport(b))sbActivate(b);
    }
  }
  const live=[];
  for(const b of spriteBodies)if(b.live&&(!b.sleeping||b.dragging))live.push(b);
  if(!live.length)return;
  // unstamp → integrate → resolve → restamp. Lifting every live body out of
  // the grid first is what stops a body colliding with its own footprint.
  for(const b of live)sbUnstamp(b);
  for(const b of live){
    if(b.dragging)continue;
    b.vy+=GRAV; b.x+=b.vx; b.y+=b.vy; b.a+=b.va;
    b.vx*=0.985; b.va*=0.94;
    clampVel(b);
  }
  for(let it=0;it<3;it++){
    for(const b of live){if(b.dragging)continue;sbResolveWorld(b);}
    sbResolvePairs();
  }
  for(const b of live){
    if(b.dragging){b.sleepT=0;continue;}
    const calm=Math.abs(b.vx)<0.22&&Math.abs(b.vy)<0.5&&Math.abs(b.va)<0.02;
    if(calm){ if(++b.sleepT>22){ sbStamp(b); sbSettle(b); continue; } }
    else b.sleepT=0;
    sbStamp(b);
  }
}

/* Point test for the mouse: the body's extent at its current angle, then a
   confirming lookup in the rasterised mask so you cannot grab a cabinet by the
   empty corner of its bounding box. */
function sbAt(sx,sy){
  for(let k=spriteBodies.length-1;k>=0;k--){
    const b=spriteBodies[k], E=b.art.ang[b.ang];
    const dx=sx-Math.round(b.x), dy=sy-Math.round(b.y);
    if(Math.abs(dx)>E.hw||Math.abs(dy)>E.hh)continue;
    const cells=E.cells;
    for(let i=0;i<cells.length;i+=3){
      if(cells[i]===dx&&cells[i+1]===dy&&b.alive[cells[i+2]])return b;
    }
  }
  return null;
}


/* ── THE VAULTS ──
   Sconces on alternating pillars, then one prop per bay on a three-beat cycle
   so a wide window does not become a row of identical tombs. Furnished per BAY
   rather than by fraction of the room: the bays are the room's real grid, and a
   prop centred between two pillars reads as placed where the same prop two
   cells off centre reads as dropped. */
function furnishCrypt(box){
  const {ceil,floor,x0,x1,bays,pxs,springY,step}=box;
  for(let k=1;k<pxs.length-1;k+=2){
    const px=pxs[k], sy=springY+((VH*0.10)|0);
    if(blocked(px-4,sy-5,px+4,sy+3))continue;
    slab(px-1,sy-4,px+1,sy-4,STONE,1);                    // the bracket
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){   // and the globe
      if(dx*dx+dy*dy>5)continue;
      putCell(px+dx,sy+dy,GLASS,dx===0&&dy===0?2:0);
      frozen[idx(px+dx,sy+dy)]=1;
    }
    wakeRect(px-4,sy-5,px+4,sy+3);
    pixDirtyRect(px-4,sy-5,px+4,sy+3);
  }
  /* ── WHAT IS ACTUALLY DOWN HERE ──
     A pair of Spectacles, standing on the flagstones at the full clear width
     of a bay. Everything else in this room is furniture and set dressing; this
     is the thing the vault was dug for, and it is sized to say so — twice the
     height of the tallest prop in the world and wider than the arch above it.

     Built to the bay rather than to a number, because the arcade's bay width
     is a function of the viewport (see specsArt). It is a real sprite body:
     dormant while it stands, so it costs nothing until the visitor picks it
     up, blows it over, or digs the floor out from under it — at which point
     several hundred cells of glossy black and glowing glass tumble through the
     arcade under the same solver as everything else, and settle wherever they
     land, keeping whatever damage they took on the way down.

     The bay it takes is the bay it takes: the prop that would have stood there
     is skipped rather than stacked inside it. */
  let specsBay=-1;
  delete SB_ART.specs;                        // the art is about to change shape
  /* Widest bay first — which is the crossing, unless a panel is hanging in it,
     in which case the arcade's next-widest opening gets a smaller pair rather
     than the room getting none. The art is rebuilt per candidate because it is
     rasterised to the opening it stands in; only the one that lands pays for a
     set of rotations. */
  const order=[];
  for(let k=0;k<bays;k++)order.push(k);
  order.sort((a,b)=>(pxs[b+1]-pxs[b])-(pxs[a+1]-pxs[a]));
  for(const k of order){
    const clearW=(pxs[k+1]-pxs[k])-9;         // the pillar bases eat ~4 cells either side
    if(clearW<SPECS_MIN)break;                // sorted widest-first: nothing after this fits either
    SPRITES.specs=specsArt(Math.min(clearW,120));
    const cx=((pxs[k]+pxs[k+1])/2)|0;
    if(propClear('specs',cx,floor-2,box)){specsBay=k;break;}
  }
  for(let k=0;k<bays;k++){
    if(k===specsBay)continue;
    const cx=((pxs[k]+pxs[k+1])/2)|0;
    const pick=k%3===0?'sarcophagus':(k%3===1?'candelabra':'urn');
    // a bay with a panel in it gets nothing; try the far side of the bay first,
    // since a panel rarely fills one edge to edge
    if(!propClear(pick,cx,floor-2,box))
      propClear(pick,cx+((step*0.28)|0),floor-2,box);
  }
}

/* ── THE LAB ──
   Sealed acid columns, then apparatus in whatever the tanks and panels left.
   The tanks are the room's light, so where a panel takes a tank's place the
   room simply gets darker there — which is the correct trade, because the
   panel is the thing you came down to read. */
function furnishLab(box){
  const {ceil,floor,x0,x1,conduitY}=box;
  const tw=5, th=Math.max(10,(VH*0.11)|0);
  const ty1=floor-2, ty0=ty1-th;
  /* Tested against the tank's OWN rows, not the full height of the room. The
     first version tested ceiling-to-floor because of the dropper that feeds
     each tank from the conduit, which meant a panel anywhere above a column
     vetoed the tank standing under it — and since the panels between them span
     more than the room's width, that vetoed all five. The dropper is allowed
     to be the thing that gets left out instead. */
  const tankCols=[];
  for(const [sx0,sx1] of freeSpans(x0+tw+2,x1-tw-2,ty0-2,ty1+2,(tw+2)*2)){
    const n=Math.max(1,Math.round((sx1-sx0)/(tw*5)));
    for(let k=0;k<n;k++)tankCols.push(Math.round(sx0+(sx1-sx0)*((k+0.5)/n)));
  }
  for(const tx of tankCols){
    slab(tx-tw-1,ty0-2,tx+tw+1,ty0-1,STONE,1);            // cap
    slab(tx-tw-1,ty1+1,tx+tw+1,ty1+2,STONE,1);            // base plinth
    for(let y=ty0;y<=ty1;y++){
      putCell(tx-tw,y,GLASS,1);frozen[idx(tx-tw,y)]=1;    // the glass shell
      putCell(tx+tw,y,GLASS,1);frozen[idx(tx+tw,y)]=1;
      for(let x=tx-tw+1;x<tx+tw;x++){
        const gi=idx(x,y);
        grid[gi]=ACID;variant[gi]=ACID_VESSEL|(Math.random()<0.2?1:0);frozen[gi]=1;
      }
    }
    // A dropper from the ceiling conduit down to the tank cap — but only where
    // its whole run is clear, so it never draws a wire across a panel.
    if(!blocked(tx-1,conduitY,tx+1,ty0-2)){
      for(let y=conduitY+1;y<ty0-2;y++){
        const gi=idx(tx,y);
        grid[gi]=FUSE;variant[gi]=0;frozen[gi]=0;
      }
    }
    wakeRect(tx-tw-2,ty0-3,tx+tw+2,ty1+3);
    pixDirtyRect(tx-tw-2,ty0-3,tx+tw+2,ty1+3);
  }
  /* Apparatus goes in the half-steps between tank centres — the space the
     tanks are not using. Cylinders are the same chemistry at a different
     scale, so the room stores what it is lit by; the crates are the only
     timber down here, which makes them the one thing the ceiling's live fuse
     can actually set alight. */
  const kit=['console','crates','cylinder','console','crates'];
  let n=0;
  for(const [sx0,sx1] of freeSpans(x0+6,x1-6,floor-18,floor,18)){
    // one piece per free run, offset off the run's centre so it does not line
    // up with the tank that is already standing there
    propClear(kit[n%kit.length],Math.round(sx0+(sx1-sx0)*0.22),floor-2,box);
    propClear(kit[(n+2)%kit.length],Math.round(sx0+(sx1-sx0)*0.78),floor-2,box);
    n++;
  }
}

/* ── THE ARCADE ──
   Two cabinet designs alternating, plus a machine at each end. The previous
   version stacked rectangles: the right silhouette and nothing else — no
   bezel, no coin door, no kickplate, and all six identical, so a row of them
   read as a fence rather than as an arcade.

   Everything here is timber with glass in it, and that is deliberate: the
   screens ARE the lighting, so a cabinet that burns takes the light with it. */
function furnishArcade(box){
  const {floor,x0,x1}=box;
  const cabs=6;
  for(let k=0;k<cabs;k++){
    const cx=Math.round(x0+(x1-x0)*((k+0.5)/cabs));
    propClear(k%3===1?'lowboy':'cabinet',cx,floor-3,box);
  }
  propClear('vending',x0+9,floor-3,box);
  propClear('vending',x1-9,floor-3,box);
}

function furnishRooms(){
  const fns={workshop:furnishWorkshop,crypt:furnishCrypt,arcade:furnishArcade,core:furnishCore};
  for(const id in fns){
    const box=ROOM_BOX[id];
    if(box&&!box.exhibit)fns[id](box);
  }
}

function spawnNaturalLandscape(){
  // The meadow is anchored to the FIRST SCREEN (VH), not to the world floor.
  // Everything from there down to H is strata — see spawnStrata below. This is
  // the one substantive change to the landscape: every proportion that used to
  // be a fraction of the world is now a fraction of the opening view, which is
  // what those numbers were always really tuned against.
  const soilDepth=Math.max(4,Math.floor(VH*0.02));
  // gentler rolling hills — sprites now carry the visual rhythm,
  // so the meadow itself reads as a calm stage rather than a noisy ground.
  const hillAmp=Math.floor(VH*0.045);
  const baseLine=VH-Math.max(4,Math.floor(VH*0.014));
  const surf=new Int16Array(W);

  for(let x=0;x<W;x++){
    const n=hillNoise(x)*0.5+0.5;
    // quantise the surface to 2-cell steps so the horizon reads as
    // deliberate pixel-art stairs instead of an analog curve.
    let s=baseLine-Math.floor(n*hillAmp);
    s=s-(s&1);
    surf[x]=s;
  }

  const pondCX=Math.floor(W*0.70);
  const pondRX=Math.max(14,Math.floor(W*0.095));
  const pondRY=Math.max(6,Math.floor(VH*0.042));
  const pondRefX=Math.max(0,Math.min(W-1,pondCX));
  const pondMidY=surf[pondRefX];
  const bowlFloor=pondMidY+Math.floor(pondRY*0.55);
  const waterY=bowlFloor-Math.floor(pondRY*0.35);

  // carve a soft dell for the pond
  for(let x=Math.max(0,pondCX-pondRX-4);x<Math.min(W,pondCX+pondRX+4);x++){
    const dx=(x-pondCX)/pondRX;
    if(Math.abs(dx)>=1)continue;
    const drop=Math.floor((1-dx*dx)*pondRY*1.05);
    surf[x]=Math.max(surf[x],bowlFloor-drop);
  }

  function pondEl(x,y){
    const dx=(x-pondCX)/pondRX,dy=(y-(bowlFloor-pondRY*0.15))/pondRY;
    return dx*dx+dy*dy;
  }

  // pass 1 — earth, then the full depth column beneath it
  for(let x=0;x<W;x++){
    for(let y=surf[x];y<H;y++){
      const d=y-surf[x];
      if(d===0)putCell(x,y,GRASS);
      else if(d<soilDepth)putCell(x,y,DIRT);
      else putCell(x,y,strataMat(d,y,x));
    }
  }
  spawnStrata(surf);

  // pass 2 — pond bowl, banks, water
  const px0=Math.max(0,pondCX-pondRX-5.5|0),px1=Math.min(W-1,pondCX+pondRX+2.5|0);
  const py0=Math.max(0,waterY-pondRY-2),py1=Math.min(H-1,bowlFloor+pondRY);
  for(let y=py0;y<=py1;y++)for(let x=px0;x<=px1;x++){
    const el=pondEl(x,y),dist=Math.sqrt(el);
    if(dist>1.12)continue;
    if(dist>0.84&&dist<1.10){
      putCell(x,y,Math.random()<0.42?MOSS:STONE,Math.random()*6|0);
    }else if(y>=waterY&&dist<0.88){
      putCell(x,y,WATER);
    }else if(y>=surf[x]&&dist<0.95){
      putCell(x,y,DIRT,Math.random()*5|0);
    }
  }

  // ── packed-dirt foot path: a bare-earth trail worn across the meadow from
  // the cottage clearing toward the pond, giving the eye a route to follow.
  // tufts & seeds steer clear of it; sprites stamp over it.
  const pathX0=(W*0.18)|0,pathX1=(W*0.56)|0;
  for(let x=pathX0;x<pathX1;x++){
    if(x<1||x>=W-1)continue;
    const sy=surf[x];
    if(Math.sqrt(pondEl(x,sy))<1.15)continue;        // never pave the pond banks
    putCell(x,sy,DIRT,Math.random()*5|0);
    if(sy+1<H)putCell(x,sy+1,DIRT,Math.random()*5|0);
    if(Math.random()<0.05)putCell(x,sy,STONE,Math.random()*4|0); // a worn pebble
  }

  // pass 3 — sparse grass tufts. The authored sprites carry the visual rhythm
  // now, so we keep the meadow surface mostly clean and only occasionally
  // poke a single-cell blade above the turf.
  for(let x=0;x<W;x++){
    const sy=surf[x];
    if(sy<=2)continue;
    const pd=Math.sqrt(pondEl(x,sy));
    if(pd<0.92)continue;
    if(grid[idx(x,sy)]!==GRASS)continue;   // leave the bare-earth path clear
    if(Math.random()<0.06){
      const h=1+(Math.random()*2|0);
      for(let i=1;i<=h;i++){
        const ty=sy-i;
        if(ty>=0&&grid[idx(x,ty)]===EMPTY)putCell(x,ty,PLANT);
      }
    }
  }

  // cattails & reeds around the pond rim
  for(let x=px0;x<=px1;x++){
    if(Math.random()>0.28)continue;
    const sy=surf[Math.max(0,Math.min(W-1,x))];
    const d=Math.sqrt(pondEl(x,sy));
    if(d<0.78||d>1.18||sy<3)continue;
    const h=3+(Math.random()*6|0);
    for(let i=1;i<=h;i++){
      const ty=sy-i;
      if(ty>=0&&grid[idx(x,ty)]===EMPTY)putCell(x,ty,PLANT);
    }
  }

  // lily pads drifting on the surface
  for(let i=0;i<14;i++){
    const lx=pondCX+((Math.random()*2-1)*pondRX*0.62|0);
    const ly=waterY+(Math.random()*2-1|0);
    if(Math.sqrt(pondEl(lx,ly))<0.72)putCell(lx,ly,MOSS,Math.random()*8|0);
  }

  // seeds waiting to sprout when physics runs
  for(let x=0;x<W;x+=2){
    if(Math.random()>0.10)continue;
    const sy=surf[x],ty=sy-1;
    if(ty<0||Math.sqrt(pondEl(x,sy))<0.95)continue;
    if(grid[idx(x,sy)]!==GRASS)continue;   // not on the bare path
    if(grid[idx(x,ty)]===EMPTY)putCell(x,ty,SEED);
  }

  // mossy stones peeking through the turf on slopes
  for(let x=1;x<W-1;x++){
    const slope=Math.abs(surf[x]-surf[x-1])+Math.abs(surf[x+1]-surf[x]);
    if(slope<2||Math.random()>0.07)continue;
    const sy=surf[x];
    if(Math.sqrt(pondEl(x,sy))<1.05)continue;
    if(grid[idx(x,sy)]===GRASS){grid[idx(x,sy)]=MOSS;variant[idx(x,sy)]=Math.random()*8|0;}
  }

  // ─── authored pixel-art sprites composed across the meadow ───
  // Anchor each sprite so its bottom row rests one cell above the local
  // grass. The scene reads left-to-right: cottage village on the left,
  // a fence path leading to a focal oak on the rise, the pond on the
  // right with its well, and a pine grove on the far right edge.
  function place(name,cx,opts){
    opts=opts||{};
    const w=spriteW(name),h=spriteH(name);
    if(!w||!h)return false;
    const gx=cx-(w>>1);
    if(gx<1||gx+w>=W-1)return false;
    // sample surface across the footprint
    let lowest=0,highest=H;
    for(let i=0;i<w;i++){
      const sx=Math.max(0,Math.min(W-1,gx+i));
      if(surf[sx]>lowest)lowest=surf[sx];
      if(surf[sx]<highest)highest=surf[sx];
      // refuse to plant inside the pond or its mossy rim
      if(!opts.allowPond&&Math.sqrt(pondEl(sx,surf[sx]))<1.18)return false;
    }
    // sit on the lowest local surface point so the trunk plants in dirt
    // rather than floating above a dip
    const gyBottom=lowest-1+(opts.sinkY||0);
    // clear grass directly under the footprint so the sprite reads
    // as deliberately placed, not collaged
    for(let i=0;i<w;i++){
      const sx=Math.max(0,Math.min(W-1,gx+i));
      const sy=surf[sx];
      if(sy>=0&&sy<H&&grid[idx(sx,sy)]===PLANT)grid[idx(sx,sy)]=GRASS;
    }
    stampSprite(name,gx,gyBottom);
    return true;
  }

  // ── focal: a single big oak on the rise, set off-center to anchor the view
  place('oak',(W*0.42)|0);

  // ── solarpunk homestead on the left: turbine on the horizon, cottage with
  // its living roof, greenhouse in the garden, an arch framing the foot path
  place('cottage',(W*0.15)|0);
  place('turbine',(W*0.045)|0);
  place('signpost',(W*0.09)|0);
  place('greenhouse',(W*0.25)|0);
  place('archway',(W*0.335)|0);
  place('solarpanel',(W*0.52)|0);

  // ── pine grove sweeping along the far-right horizon, past the pond.
  place('pine',(W*0.87)|0);
  place('pine',(W*0.96)|0);
  place('smallpine',(W*0.82)|0);
  place('smallpine',(W*0.92)|0);

  // ── boulders, mushrooms, bushes tucked between the anchors
  for(const f of [0.46,0.565]){ place('rock',(W*f)|0); }
  place('cattail',(W*0.61)|0,{allowPond:true});
  place('cattail',(W*0.81)|0,{allowPond:true});
  for(const f of [0.375,0.475]){ place('mushroom',(W*f)|0); }
  for(const f of [0.205,0.575]){ place('bush',(W*f)|0); }
  // pollinator strip: flowers thick near the greenhouse, looser across the meadow
  const flowerCount=6;
  for(let i=0;i<flowerCount;i++){
    const fx=((W*0.06)+(i/(flowerCount-1))*(W*0.48)+(Math.random()*W*0.03-W*0.015))|0;
    place('flower',fx);
  }
}

/* ═══════════════════════════════════════════════════════
   PORTFOLIO LAYOUT — everything below is particles
═══════════════════════════════════════════════════════ */
function spawnContent(){
  grid.fill(0);variant.fill(0);frozen.fill(0);inChunk.fill(0);
  spriteBodies.length=0;
  birds.length=0;
  ghosts.length=0;
  cats.length=0;

  // ─── meadow & pond landscape ───
  spawnNaturalLandscape();
  // the name, in the sky over it, out of the same grid
  stampWordmark();

  // a small black cat patrolling the village (signpost → fence)
  {
    const homeMin=Math.max(2,(W*0.05)|0);
    const homeMax=Math.min(W-3,(W*0.30)|0);
    const cx=(W*0.16)|0;
    spawnCat(cx,catGround(cx)-1,{homeMin,homeMax});
  }

  // projects are now DOM content — no rigid-body region
  WORK_REGION=null;

  // a hole through the turf, and the sign that says the world keeps going
  carveShaft();
  stampSignpost();
  buildWorldPanels();
  // Furniture last: it is the only layer that yields to the others. See the
  // FURNISHING banner for what went wrong when it ran first.
  furnishRooms();
  spawnGhosts();

  spawnArtifacts();

  // stamp invisible MASK cells under the HTML content so particles collide with it
  clearAllBurns(); // a reset heals every window that got burnt or melted
  stampDOMMasks();

  // wake the whole world for the first sim pass + full first render
  wakeRect(0,0,W-1,H-1);
  pixDirtyRect(0,0,W-1,H-1);
}

// Walk every element with data-collide and stamp it into the sim grid as MASK.
//   data-collide="text"  → per-glyph raster (sand falls into letter cavities)
//   data-collide  (any)  → bounding-box rectangle (for cards with backgrounds)
/* The static content is fixed to the SCREEN while the world scrolls under it,
   so a mask stamped once would leave invisible ledges strewn down the shaft.
   The two stampers therefore record SCREEN cells (y measured from the top of
   the frame) into _domMaskScreen, and restampDOMMasks() projects that set into
   the world at the current camY. Re-projecting is a flat array walk over cells
   we already know about — the expensive halves, getBoundingClientRect and the
   glyph rasterisation, run once at spawn and never again on scroll. */
let _domMaskScreen=[];   // screen cells (sy*W+sx) occupied by static content
let _domMaskPlaced=[];   // world cells currently carrying that stamp
let _domMaskCamY=-1;
function stampDOMMasks(){
  const cr=canvas.getBoundingClientRect();
  _domMaskScreen.length=0;
  document.querySelectorAll('[data-collide]').forEach(el=>{
    if(el.getAttribute('data-collide')==='text') stampGlyphMask(el,cr);
    else stampRectMask(el,cr);
  });
  _domMaskPlaced.length=0;
  _domMaskCamY=-1;
  restampDOMMasks();
}
function restampDOMMasks(){
  if(camY===_domMaskCamY)return;
  for(const i of _domMaskPlaced){
    if(grid[i]===MASK){
      grid[i]=EMPTY;variant[i]=0;
      const x=i%W,y=(i/W)|0;
      pixDirty(x,y);wake3(x,y);
    }
  }
  _domMaskPlaced.length=0;
  for(const si of _domMaskScreen){
    const sx=si%W,gy=((si/W)|0)+camY;
    if(gy<0||gy>=H)continue;
    const i=gy*W+sx;
    if(grid[i]!==EMPTY)continue;
    grid[i]=MASK;variant[i]=0;
    _domMaskPlaced.push(i);
    pixDirty(sx,gy);wake3(sx,gy);
  }
  _domMaskCamY=camY;
}
function stampRectMask(el,cr){
  const r=el.getBoundingClientRect();
  const x0=Math.max(0,Math.floor((r.left-cr.left)/SCALE));
  const y0=Math.max(0,Math.floor((r.top-cr.top)/SCALE));
  const x1=Math.min(W-1,Math.ceil((r.right-cr.left)/SCALE));
  const y1=Math.min(VH-1,Math.ceil((r.bottom-cr.top)/SCALE));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)_domMaskScreen.push(y*W+x);
}
// Rasterize an element's text into an offscreen canvas matching the live
// computed style, then stamp dark pixels as MASK — so sand piles inside the
// curves of letters instead of just on the bounding rectangle.
function stampGlyphMask(el,cr){
  const r=el.getBoundingClientRect();
  if(r.width<=0||r.height<=0)return;
  const cs=getComputedStyle(el);
  const cw=Math.ceil(r.width),ch=Math.ceil(r.height);
  const can=document.createElement('canvas');can.width=cw;can.height=ch;
  const oc=can.getContext('2d');
  oc.fillStyle='#fff';oc.fillRect(0,0,cw,ch);
  oc.fillStyle='#000';
  const fs=parseFloat(cs.fontSize);
  oc.font=`${cs.fontStyle} ${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
  oc.textBaseline='top';
  const lh=cs.lineHeight==='normal'?fs*1.2:parseFloat(cs.lineHeight);
  let lines=el.innerHTML.split(/<br\s*\/?>/i).map(s=>{
    const tmp=document.createElement('div');tmp.innerHTML=s;return (tmp.textContent||'').trim();
  });
  if(cs.textTransform==='uppercase')lines=lines.map(l=>l.toUpperCase());
  let y=(lh-fs)*0.5;
  for(const line of lines){oc.fillText(line,0,y);y+=lh;}
  const data=oc.getImageData(0,0,cw,ch).data;
  const x0=Math.floor((r.left-cr.left)/SCALE);
  const y0=Math.floor((r.top-cr.top)/SCALE);
  const sxN=Math.ceil(cw/SCALE),syN=Math.ceil(ch/SCALE);
  for(let sy=0;sy<syN;sy++)for(let sx=0;sx<sxN;sx++){
    const px=Math.min(cw-1,(sx*SCALE+(SCALE>>1)));
    const py=Math.min(ch-1,(sy*SCALE+(SCALE>>1)));
    if(data[(py*cw+px)*4]<140){
      const gx=x0+sx,gy=y0+sy;
      if(gx>=0&&gx<W&&gy>=0&&gy<VH)_domMaskScreen.push(gy*W+gx);
    }
  }
}

/* ═══════════════════════════════════════════════════════
   FLOATING-WINDOW COLLISION MASKS
   Each .win-app rectangle is stamped as MASK cells so sand piles
   on its title bar, water pools on its top edge, etc. Re-stamped
   only when a window moves/opens/closes/resizes.
═══════════════════════════════════════════════════════ */
let _winMaskCells=[];
/* Per-window bbox of the cells stamped on the last pass. Kept so the NEXT
   pass can retire those cells as a handful of rectangles instead of tens of
   thousands of single-cell invalidations. Per window and not one global
   union: world panels sit whole screens apart, and a single bbox spanning
   them would dirty every chunk in between. */
let _winMaskRects=[];
let _winMaskHash='';
/* Windows overlap, and the mask is only one layer deep, so a cell under a pile
   can belong to just one of them. Ownership follows what you can actually see:
   the topmost window at that cell owns it, and burning through hands the cell
   down to the next window in the stack instead of opening a hole in thin air. */
let _stack=[];   // live windows, topmost first — {b,x0,y0,x1,y1} in grid cells
let _stampSeq=0; // bumped every restamp, so a stale b.zi can't be trusted
function _windowRects(){
  const wins=[];
  document.querySelectorAll('.win-app,.world-panel').forEach(el=>{
    if(el.style.display==='none'||el.dataset.minimized==='1')return;
    const r=el.getBoundingClientRect();
    const zKey=el.style.zIndex||0;
    wins.push({el,r,z:+zKey,zKey});
  });
  return wins;
}
function _winsHash(wins=_windowRects()){
  let s='';
  for(const {r,zKey} of wins){
    // z-order is part of the hash: clicking a window to raise it changes who
    // owns the overlap even though nothing has moved
    s+=(r.left|0)+','+(r.top|0)+','+(r.width|0)+','+(r.height|0)+','+zKey+';';
  }
  return s+W+'x'+H+'@'+camY;
}
function updateWindowMasks(){
  // Hash and stamp one geometry snapshot; a changed camera used to measure
  // every instrument surface twice, including all the offscreen rooms.
  const snapshot=_windowRects(),h=_winsHash(snapshot);
  if(h===_winMaskHash)return;
  _winMaskHash=h;
  /* Retiring the old stamp is a rectangle operation, not a per-cell one.
     pixDirty+wake3 on every cell costs nine wake() calls and a chunk-rect walk
     EACH, and a maximized window is ~25k cells - yet the union of all those
     3x3 stamps is just the window's own bbox grown by one. One pixDirtyRect
     and one wakeRect per window marks the identical chunk set for a fraction
     of the work, which is what makes scrolling cheap: the camera moving
     restamps every viewport-fixed window, once per four animation frames. */
  for(const i of _winMaskCells){
    if(grid[i]===MASK){grid[i]=EMPTY;variant[i]=0;}
    maskOwner[i]=0;
  }
  for(const r of _winMaskRects){
    pixDirtyRect(r[0],r[1],r[2],r[3]);wakeRect(r[0]-1,r[1]-1,r[2]+1,r[3]+1);
  }
  _winMaskCells.length=0;_winMaskRects.length=0;
  const cr=canvas.getBoundingClientRect();
  const wins=snapshot.filter(w=>w.r.width>0&&w.r.height>0);
  wins.sort((a,b)=>b.z-a.z); // topmost first — it claims the shared cells
  _stack=[];_stampSeq++;
  for(const w of wins){
    const r=w.r,b=burnableFor(w.el,r,cr);
    const x0=Math.max(0,Math.floor((r.left-cr.left)/SCALE));
    const y0=Math.max(0,Math.floor((r.top-cr.top)/SCALE)+camY);
    const x1=Math.min(W-1,Math.ceil((r.right-cr.left)/SCALE));
    const y1=Math.min(H-1,Math.ceil((r.bottom-cr.top)/SCALE)+camY);
    b.zi=_stack.length;b.seq=_stampSeq;
    _stack.push({b,x0,y0,x1,y1});
    // bbox of the cells this window actually claimed - tighter than its rect
    // when it is burnt through, and the unit both the invalidation below and
    // next pass's retirement work in.
    let bx0=BIG,by0=BIG,bx1=-1,by1=-1;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const i=idx(x,y);
      if(grid[i]!==EMPTY)continue;
      // a cell that already burned through stays open — the hole travels with
      // the window when it's dragged, because damage is stored element-local.
      // Skipping it here is also what lets the window below show through a
      // hole in the one above: the next window down stamps into the gap.
      if(b.gone&&b.dmg[lcell(b,x,y)])continue;
      grid[i]=MASK;variant[i]=0;maskOwner[i]=b.id;
      _winMaskCells.push(i);
      if(x<bx0)bx0=x; if(y<by0)by0=y; if(x>bx1)bx1=x; if(y>by1)by1=y;
    }
    if(bx1>=bx0){
      _winMaskRects.push([bx0,by0,bx1,by1]);
      pixDirtyRect(bx0,by0,bx1,by1);wakeRect(bx0-1,by0-1,bx1+1,by1+1);
    }
  }
}
// The next window down the pile still covering this cell, if there is one —
// skipping any that is already burnt through at that spot.
function ownerBelow(x,y,b){
  if(b.seq!==_stampSeq)return null;
  for(let k=b.zi+1;k<_stack.length;k++){
    const s=_stack[k];
    if(x<s.x0||x>s.x1||y<s.y0||y>s.y1)continue;
    const o=s.b;
    // a window closed by hand is still in the stack until the next restamp
    if(o===b||o.dead||!o.el.isConnected)continue;
    if(o.gone&&o.dmg[lcell(o,x,y)])continue;
    return o;
  }
  return null;
}

/* ═══════════════════════════════════════════════════════
   BURNING / MELTING THE PAGE ITSELF
   Windows are already stamped into the grid as MASK, and maskOwner[]
   remembers which window each of those cells belongs to. So when fire
   or acid eats one we can do three things at once:
     · the sim cell opens up, so sand pours through the hole
     · the cell is cut out of the element's clip-path, which punches the
       hole in the REAL HTML (clip-path, not a mask image: it applies
       synchronously, where swapping a mask bitmap flashes the window
       back to whole for a frame while the new one decodes)
     · a char overlay canvas scorches whatever survives around the rim
   Damage is stored in element-local cells, so a burnt window keeps its
   holes when you drag it. Eat enough of one and it collapses into ash.
═══════════════════════════════════════════════════════ */
const burnables=[];                                                 // index+1 == b.id == maskOwner value
const BURN_COLLAPSE=0.62;                                           // share of footprint gone → the window crumbles
const CHAR_RIM =['rgba(216,88,16,0.85)','rgba(150,214,26,0.80)'];   // [fire, acid] glowing edge
const CHAR_DEEP=['rgba(22,13,9,0.92)',  'rgba(46,66,14,0.85)'];     // [fire, acid] burnt-out edge
const CLIP_MS=60;                                                   // rebuilding the clip path is the expensive bit
const BURN_RATE=22;                                                 // cells a window can lose per sim tick

// One record per live window. Created on the first stamp, re-anchored on
// every restamp so dx/dy locate the element in world pixels, matching lcell.
function burnableFor(el,r,cr){
  let b=el._burn;
  if(!b){
    const cw=Math.max(1,Math.ceil(r.width/SCALE)),ch=Math.max(1,Math.ceil(r.height/SCALE));
    b={el,cw,ch,pw:Math.max(1,Math.round(r.width)),ph:Math.max(1,Math.round(r.height)),
       dmg:new Uint8Array(cw*ch),gone:0,total:cw*ch,kind:0,
       char:null,cx:null,dx:0,dy:0,clipDirty:false,last:0,dead:false,id:0,
       tick:0,hits:0,zi:0,seq:-1};
    b.id=burnables.push(b); // push returns the new length → id is index+1
    el._burn=b;
  } else if(b.gone&&(Math.abs(r.width-b.pw)>1||Math.abs(r.height-b.ph)>1)) reshape(b,r);
  b.dx=r.left-cr.left;b.dy=r.top-cr.top+camY*SCALE;
  return b;
}
// Maximize/restore resizes the element under its own damage map: resample the
// holes into the new cell grid so they stay where they were on the window.
function reshape(b,r){
  const cw=Math.max(1,Math.ceil(r.width/SCALE)),ch=Math.max(1,Math.ceil(r.height/SCALE));
  b.pw=Math.max(1,Math.round(r.width));b.ph=Math.max(1,Math.round(r.height));
  if(cw!==b.cw||ch!==b.ch){
    const nd=new Uint8Array(cw*ch);let gone=0;
    for(let y=0;y<ch;y++){
      const sy=Math.min(b.ch-1,(y*b.ch/ch)|0)*b.cw,ny=y*cw;
      for(let x=0;x<cw;x++){
        if(b.dmg[sy+Math.min(b.cw-1,(x*b.cw/cw)|0)]){nd[ny+x]=1;gone++;}
      }
    }
    b.dmg=nd;b.cw=cw;b.ch=ch;b.gone=gone;b.total=cw*ch;
  }
  if(b.char){ // the scorch canvas is sized in px — repaint it at the new scale
    b.char.width=b.pw;b.char.height=b.ph;
    for(let ly=0;ly<b.ch;ly++)for(let lx=0;lx<b.cw;lx++){
      if(!b.dmg[ly*b.cw+lx])continue;
      charRing(b,lx,ly,2,CHAR_DEEP[b.kind]);
      charRing(b,lx,ly,1,CHAR_RIM[b.kind]);
    }
  }
  b.clipDirty=true;
}
// global sim cell → element-local damage cell (nearest, clamped: the stamped
// footprint can overhang the element by a cell on the far edges)
function lcell(b,x,y){
  let lx=Math.floor((x*SCALE+SCALE*0.5-b.dx)/SCALE);
  let ly=Math.floor((y*SCALE+SCALE*0.5-b.dy)/SCALE);
  if(lx<0)lx=0;else if(lx>=b.cw)lx=b.cw-1;
  if(ly<0)ly=0;else if(ly>=b.ch)ly=b.ch-1;
  return ly*b.cw+lx;
}
// the scorch overlay only exists once something has actually burned
function ensureChar(b){
  if(b.char)return;
  const c=document.createElement('canvas');
  c.className='burn-char';c.width=b.pw;c.height=b.ph;
  b.el.appendChild(c);
  b.char=c;b.cx=c.getContext('2d');
}
// ring of cells at chebyshev distance `rad` from the hole, skipping cells that
// are already gone — radius 1 is the live rim, radius 2 the older burnt edge
function charRing(b,lx,ly,rad,col){
  b.cx.fillStyle=col;
  for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
    if(Math.abs(dx)!==rad&&Math.abs(dy)!==rad)continue;
    const nx=lx+dx,ny=ly+dy;
    if(nx<0||ny<0||nx>=b.cw||ny>=b.ch)continue;
    if(b.dmg[ny*b.cw+nx])continue;
    if(rad>1&&Math.random()<0.45)continue; // ragged, not a neat outline
    b.cx.fillRect(nx*SCALE,ny*SCALE,SCALE,SCALE);
  }
}
// kind: 0 = fire, leaves a flame burning in the hole
//       1 = acid, leaves it open so the rest of the pool drips through
//       2 = lava, scorches like fire but stays open so the flow pours in
function burnMask(x,y,kind){
  const i=idx(x,y),o=maskOwner[i];
  if(!o)return false;
  const b=burnables[o-1];
  if(!b||b.dead)return false;
  // A lava pool sits against a whole row of cells at once. Without a per-tick
  // budget the window would vanish inside a single frame — capping it keeps the
  // burn something you can watch travel, and keeps the clip-path rebuild cheap.
  if(b.tick!==frameId){b.tick=frameId;b.hits=0;}
  if(b.hits>=BURN_RATE)return false;
  b.hits++;
  // Stacked windows: the cell is still backed by whatever sits underneath, so
  // it stays solid and the next window down wears the damage from here on.
  // Nothing pours through a hole that isn't through the whole pile yet.
  const below=ownerBelow(x,y,b);
  if(below){
    maskOwner[i]=below.id;
    if(kind!==1)spreadFireNear(x,y);
  }else{
    maskOwner[i]=0;
    setMat(x,y,kind===0?FIRE:EMPTY);
  }
  const li=lcell(b,x,y);
  if(b.dmg[li])return true; // two sim cells can round onto one element cell
  ensureChar(b);
  const ci=kind===1?1:0; // acid etches green, fire and lava scorch black
  b.dmg[li]=1;b.gone++;b.kind=ci;
  const lx=li%b.cw,ly=(li/b.cw)|0;
  b.cx.clearRect(lx*SCALE,ly*SCALE,SCALE,SCALE);
  charRing(b,lx,ly,2,CHAR_DEEP[ci]);
  charRing(b,lx,ly,1,CHAR_RIM[ci]);
  b.clipDirty=true;
  if(b.gone>b.total*BURN_COLLAPSE)collapseBurnable(b);
  return true;
}
// Fire normally advances by filling the hole it just burned. Over overlapping
// windows there is no hole to fill yet — the cell is still held up by the next
// window down — so the flame is placed in the nearest open cell instead.
// Without it the front stalls on the edge of the pile: it can only chew cells
// it is already touching, and none of them ever open.
// One flame per consumed cell, the same budget as burning into open air, which
// is also what keeps a deep stack burning at a watchable rate: three windows
// thick costs three bites, and pays for three flames along the way.
function spreadFireNear(x,y){
  for(let rad=1;rad<=2;rad++){
    for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
      if(Math.abs(dx)!==rad&&Math.abs(dy)!==rad)continue; // ring only
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      if(grid[idx(nx,ny)]===EMPTY){setMat(nx,ny,FIRE);return;}
    }
  }
}
/* Rebuild the element's clip path: the border box wound clockwise, then one
   counter-clockwise rectangle per run of burnt cells. Opposite winding is what
   makes those runs read as holes under the default nonzero fill rule. Holes are
   merged along each row first, so a big burn is a few dozen subpaths, not one
   per cell. */
function flushClip(b){
  b.clipDirty=false;
  let p='M0 0H'+b.pw+'V'+b.ph+'H0Z';
  for(let ly=0;ly<b.ch;ly++){
    const row=ly*b.cw,y0=ly*SCALE,y1=Math.min(b.ph,y0+SCALE);
    let lx=0;
    while(lx<b.cw){
      if(!b.dmg[row+lx]){lx++;continue;}
      let e=lx+1;
      while(e<b.cw&&b.dmg[row+e])e++;
      p+='M'+(lx*SCALE)+' '+y0+'V'+y1+'H'+Math.min(b.pw,e*SCALE)+'V'+y0+'Z';
      lx=e;
    }
  }
  b.el.style.webkitClipPath=b.el.style.clipPath='path("'+p+'")';
}
function updateBurns(now){
  for(let k=0;k<burnables.length;k++){
    const b=burnables[k];
    if(b.dead)continue;
    if(!b.el.isConnected){b.dead=true;b.el._burn=null;continue;} // closed by hand mid-burn
    if(!b.clipDirty||now-b.last<CLIP_MS)continue;
    b.last=now;flushClip(b);
  }
}
// Too much of the window is gone to hold together: shed the rest of the
// footprint as ash and embers and take the window (and its taskbar button) out.
function collapseBurnable(b){
  if(b.dead)return;
  b.dead=true;
  for(const i of _winMaskCells){ // every stamped window cell, not the whole grid
    if(maskOwner[i]!==b.id)continue;
    const x=i%W,y=(i/W)|0;
    const below=ownerBelow(x,y,b); // a window underneath still holds this cell up
    if(below){maskOwner[i]=below.id;continue;}
    maskOwner[i]=0;
    if(grid[i]!==MASK)continue;
    const rn=Math.random();
    setMat(x,y,rn<0.14?ASH:rn<0.20?(b.kind?SMOKE:FIRE):EMPTY);
  }
  const el=b.el;el._burn=null;
  if(window.__closeWindowEl)window.__closeWindowEl(el);else el.remove();
  _winMaskHash=''; // the survivors need a fresh stamp
}
// reset / resize: every window comes back whole
function clearAllBurns(){
  for(const b of burnables){
    b.dead=true;
    if(b.char&&b.char.parentNode)b.char.remove();
    if(b.el){
      b.el._burn=null;
      b.el.style.webkitClipPath=b.el.style.clipPath='';
    }
  }
  burnables.length=0;
  maskOwner.fill(0);
  _winMaskCells.length=0;_winMaskRects.length=0;_winMaskHash='';_stack.length=0;
}

/* ═══════════════════════════════════════════════════════
   HOVER FREEZE
═══════════════════════════════════════════════════════ */
let mouseSimX=0,mouseSimY=0,hoverEnabled=false,hoverCells=[];
const HOVER_R=20;
const freezeRing=document.getElementById('freezeRing');

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouseSimX=Math.floor((e.clientX-r.left)/SCALE);
  mouseSimY=Math.floor((e.clientY-r.top)/SCALE)+camY;
  freezeRing.style.left=e.clientX+'px';freezeRing.style.top=e.clientY+'px';
  freezeRing.style.opacity=hoverEnabled&&physicsOn?'1':'0';
  brushRing.style.left=e.clientX+'px';brushRing.style.top=e.clientY+'px';
  brushRing.style.opacity='1';
});
canvas.addEventListener('mouseleave',()=>{
  freezeRing.style.opacity='0';
  brushRing.style.opacity='0';
  releaseHover();
});
function releaseHover(){
  if(!hoverCells.length)return;
  let x0=BIG,y0=BIG,x1=-1,y1=-1;
  for(const i of hoverCells){frozen[i]=0;const x=i%W,y=(i/W)|0;if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}
  wakeRect(x0,y0,x1,y1);
  hoverCells=[];
}
function applyHoverFreeze(){
  releaseHover();
  if(!hoverEnabled||!physicsOn)return;
  for(let dy=-HOVER_R;dy<=HOVER_R;dy++)for(let dx=-HOVER_R;dx<=HOVER_R;dx++){
    if(dx*dx+dy*dy>HOVER_R*HOVER_R)continue;
    const x=mouseSimX+dx,y=mouseSimY+dy;
    if(x<0||x>=W||y<0||y>=H)continue;
    const i=idx(x,y);
    if(!frozen[i]){frozen[i]=1;hoverCells.push(i);}
  }
}

/* ═══════════════════════════════════════════════════════
   PAINTING
═══════════════════════════════════════════════════════ */
let painting=false,curMat=1;
function simXY(e){
  const r=canvas.getBoundingClientRect();
  return[Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)/SCALE))),
         Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)/SCALE)+camY))];
}
/* ═══ STRUCTURAL MATERIAL VARIANTS ═══
   Variants are baked from the cell's BIRTH position and travel with the
   particle (movement already copies variant). Intact walls read as coursed
   masonry / planked timber; debris keeps its identity when it crumbles —
   mortar crumbs stay pale, brick chips stay terracotta.
   Encoding: bit5 (0x20) = "structured" flag → fillTexel decodes
   role (bits 0-1) + per-unit tint (bits 2-4). Unflagged variants keep the
   legacy random-jitter / hand-shaded sprite path. */
function hash2i(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0);}
function brickVariant(x,y,tone){
  // courses 4px tall: 3 rows of face + 1 mortar bed; head joints every 7px,
  // staggered half a brick per course
  const course=Math.floor(y/4), inRow=y-course*4;
  const off=(course&1)?3:0;
  const inCol=(x+off)%7;
  let role;
  if(inRow===3||inCol===6) role=3;                 // mortar bed / head joint
  else if(inRow===0&&inCol<6) role=2;              // lit top edge of the brick
  else if(inRow===2||inCol===5) role=1;            // shadowed bottom/right
  else role=0;                                     // brick face
  const bid=hash2i(Math.floor((x+off)/7),course);  // per-BRICK tint, not per-cell
  return 0x20|role|((bid&7)<<2)|((tone&3)<<6);
}
function woodVariant(x,y,tone){
  // planking: 5x9 segments — vertical seam on the right, butt joint on the
  // bottom row, grain streaks hashed per segment
  const plank=Math.floor(x/5), inP=x-plank*5;
  const seg=Math.floor(y/9), inS=y-seg*9;
  let role;
  if(inP===4||inS===8) role=3;                     // seam / butt joint
  else if(((hash2i(x,y>>2)&15)===0)) role=1;       // occasional grain fleck
  else if(inP===0||inS===0) role=2;                // lit left/top edge
  else role=0;
  const pid=hash2i(plank,seg*7+7);
  return 0x20|role|((pid&7)<<2)|((tone&3)<<6);
}
/* Ashlar: dressed blocks with a fine joint, staggered half a block per course.

   Deliberately a much coarser unit than brick — 11x6 against 7x4 — because at
   one cell per pixel the SIZE of the unit is most of what separates "cut from
   the rock" from "built out of bricks", and it does that work before colour
   is asked to do any. */
function stoneVariant(x,y,tone){
  /* 14x9, up from 11x6. At the smaller unit a column shaft picked up a bed
     joint every six rows and read as a stack of coins, and the Core's tympanum
     came out looking like brickwork — the unit has to be visibly coarser than
     BRICK's 7x4 or "cut stone" and "built of bricks" collapse into each other,
     which is the one distinction the zones are relying on. */
  const course=Math.floor(y/9), inRow=y-course*9;
  const off=(course&1)?7:0;
  const inCol=(x+off)%14;
  let role;
  if(inRow===8||inCol===13) role=3;                 // bed joint / head joint
  else if(inRow===0) role=2;                        // lit top of the block
  else if(inRow===7||inCol===12) role=1;            // shadowed bottom / right
  else role=0;                                      // block face
  const bid=hash2i(Math.floor((x+off)/14),course);  // per-BLOCK tint
  return 0x20|role|((bid&7)<<2)|((tone&3)<<6);
}
function bakeVariant(m,x,y,tone){
  if(m===BRICK)return brickVariant(x,y,tone|0);
  if(m===WOOD)return woodVariant(x,y,tone|0);
  return Math.random()*8|0;
}
/* What a BUILDER lays, as opposed to what the brush paints.

   The only difference is stone: a room's shell, a colonnade and a stylobate
   are cut stone and want courses, while a brush-load of STONE is terrain and
   wants to stay raw rock. Same encoding either way, so a dressed block that
   later comes loose still crumbles as a dressed block. */
const STRUCT_MAT=new Uint8Array(64);
STRUCT_MAT[BRICK]=1; STRUCT_MAT[WOOD]=1; STRUCT_MAT[STONE]=1;
function builtVariant(m,x,y,tone){
  if(m===STONE)return stoneVariant(x,y,tone|0);
  return bakeVariant(m,x,y,tone);
}
/* The builders have always passed a SHADE index as `slab`'s variant to mean
   "this course is a shade darker / lighter than the wall it sits in". That
   intent survives verbatim — it is now a TONE on top of real masonry instead
   of a flat fill that replaced it. 7 is the file's long-standing shorthand for
   pale cut stone, which until now resolved to JITTER[7] and did nothing. */
const toneOf=v=>(v===undefined?0:(v===7?2:(v&3)));

/* ═══ UNIT-SNAPPED MASONRY PAINTING ═══
   Painting BRICK/WOOD lays complete units — whole bricks (7x4 tiles: 6x3
   face + head joint + mortar bed) and whole plank segments (5x9). Only
   units that fit entirely inside the brush stamp; a brush smaller than one
   unit lays the single unit under the cursor, so small brushes become a
   brick-by-brick trowel. Stamps are position-deterministic → overlapping
   drag strokes are idempotent and courses always align. */
function unitGeom(m){return m===BRICK?{tw:7,th:4,offFn:c=>(c&1)?3:0}:{tw:5,th:9,offFn:()=>0};}
function stampUnit(m,ux0,uy0,tw,th){
  if(ux0<0||uy0<0||ux0+tw>W||uy0+th>H)return;      // clipped units don't spawn
  for(let y=uy0;y<uy0+th;y++)for(let x=ux0;x<ux0+tw;x++){
    const pi=idx(x,y);
    grid[pi]=m;variant[pi]=bakeVariant(m,x,y);frozen[pi]=1;inChunk[pi]=0;
    wake3(x,y);pixDirty(x,y);
  }
}
function paintUnits(cx,cy,b,m){
  const {tw,th,offFn}=unitGeom(m);
  let laid=false;
  const c0=Math.floor((cy-b)/th),c1=Math.floor((cy+b)/th);
  for(let c=c0;c<=c1;c++){
    const off=offFn(c), y0=c*th;
    const t0=Math.floor((cx-b+off)/tw),t1=Math.floor((cx+b+off)/tw);
    for(let t=t0;t<=t1;t++){
      const x0=t*tw-off;
      // whole unit must sit inside the brush circle (corner test on the tile)
      const dx=Math.max(Math.abs(x0-cx),Math.abs(x0+tw-1-cx));
      const dy=Math.max(Math.abs(y0-cy),Math.abs(y0+th-1-cy));
      if(dx*dx+dy*dy<=b*b){stampUnit(m,x0,y0,tw,th);laid=true;}
    }
  }
  if(!laid){ // brush smaller than a unit: lay the one under the cursor
    const c=Math.floor(cy/th), off=offFn(c);
    stampUnit(m,Math.floor((cx+off)/tw)*tw-off,c*th,tw,th);
  }
}

// pb overrides the HUD brush radius — the rogue cursors each carry their own
function paint(cx,cy,pm,pb){
  const m=(pm===undefined)?curMat:pm;
  const b=(pb===undefined)?+document.getElementById('brushSlider').value:pb;
  if(m===BIRD){
    // throttle: don't carpet-bomb on every mousemove event
    const want=Math.max(1,Math.floor(b*0.4));
    for(let k=0;k<want;k++){
      if(Math.random()>0.45)continue;
      const a=Math.random()*Math.PI*2,r=Math.random()*b;
      spawnBird(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    }
    return;
  }
  if(m===BRICK||m===WOOD){paintUnits(cx,cy,b,m);return;}
  // structural / drawable-static materials paint densely AND pin themselves
  // (FUSE/BOMB stay unfrozen so their step runs).
  const pinned=(m===FUSE||m===BOMB);
  const solid=isStatic(m)||m===EMPTY||pinned;
  for(let dy=-b;dy<=b;dy++)for(let dx=-b;dx<=b;dx++){
    if(dx*dx+dy*dy>b*b)continue;
    if(!solid&&Math.random()>.78)continue;
    const nx=cx+dx,ny=cy+dy;
    if(nx>=0&&nx<W&&ny>=0&&ny<H){
      const pi=idx(nx,ny);
      grid[pi]=m;variant[pi]=bakeVariant(m,nx,ny);
      frozen[pi]=(m===WOOD||m===BRICK)?1:0;
      wake3(nx,ny);pixDirty(nx,ny);
    }
  }
}
/* ═══ STROKE INTERPOLATION ═══
   mousemove samples arrive far apart during fast drags; stamping only at the
   sample points leaves a dotted trail. Walk the segment from the previous
   sample, stamping every half-brush-width, so strokes are continuous. The
   stroke's material is latched at press time — right button latches ERASE. */
let strokeMat=SAND,lastPX=-1,lastPY=-1;
function paintStroke(x,y){
  if(lastPX<0){paint(x,y,strokeMat);lastPX=x;lastPY=y;return;}
  const dx=x-lastPX,dy=y-lastPY;
  const dist=Math.max(Math.abs(dx),Math.abs(dy));
  const b=+document.getElementById('brushSlider').value;
  const stepLen=Math.max(1,b>>1);
  if(dist<=stepLen)paint(x,y,strokeMat);
  else{
    const nSeg=Math.ceil(dist/stepLen);
    for(let k=1;k<=nSeg;k++)paint(Math.round(lastPX+dx*k/nSeg),Math.round(lastPY+dy*k/nSeg),strokeMat);
  }
  lastPX=x;lastPY=y;
}
let dragBody=null,dragOffX=0,dragOffY=0;
function grabAt(sx,sy){
  for(let k=bodies.length-1;k>=0;k--){
    if(pointInBody(bodies[k],sx,sy)){
      dragBody=bodies[k];dragBody.dragging=true;dragBody.sleeping=false;
      dragOffX=dragBody.x-sx;dragOffY=dragBody.y-sy;return true;
    }
  }
  // then the furniture. A dormant prop has to be activated before it can be
  // dragged: until then its pixels belong to the grid, not to the body.
  const sb=sbAt(sx,sy);
  if(sb){
    sbActivate(sb);
    dragBody=sb;sb.dragging=true;sb.sleeping=false;sb.sleepT=0;
    dragOffX=sb.x-sx;dragOffY=sb.y-sy;return true;
  }
  return false;
}
function dragTo(sx,sy){
  const nx=sx+dragOffX,ny=sy+dragOffY;
  dragBody.vx=nx-dragBody.x;dragBody.vy=ny-dragBody.y;clampVel(dragBody);
  dragBody.x=nx;dragBody.y=ny;
}
function release(){if(dragBody){dragBody.dragging=false;dragBody=null;}painting=false;lastPX=-1;lastPY=-1;}

canvas.addEventListener('mousedown',e=>{
  const p=simXY(e);
  if(e.button===0&&evilChestHit(...p)){e.preventDefault();toggleEvilChest();return;}
  if(e.button===0&&grabAt(...p))return;
  painting=true;
  strokeMat=(e.button===2)?EMPTY:curMat; // right button = quick erase
  lastPX=-1;lastPY=-1;
  paintStroke(...p);
});
canvas.addEventListener('mousemove',e=>{const p=simXY(e);if(dragBody){dragTo(...p);return;}if(painting)paintStroke(...p);});
canvas.addEventListener('mouseup',release);
canvas.addEventListener('mouseleave',release);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchstart',e=>{e.preventDefault();const p=simXY(e.touches[0]);if(evilChestHit(...p)){toggleEvilChest();return;}if(grabAt(...p))return;painting=true;strokeMat=curMat;lastPX=-1;lastPY=-1;paintStroke(...p);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const p=simXY(e.touches[0]);if(dragBody){dragTo(...p);return;}if(painting)paintStroke(...p);},{passive:false});
canvas.addEventListener('touchend',release);
canvas.addEventListener('touchcancel',release);

/* ═══ BRUSH RING + WHEEL RESIZE ═══
   A cursor-following circle shows the true brush footprint (the HUD slider
   is hidden by default), and the wheel resizes the brush in place. */
const brushRing=document.getElementById('brushRing');
const brushSliderEl=document.getElementById('brushSlider');
function syncBrushRing(){
  const d=(+brushSliderEl.value*2+1)*SCALE;
  brushRing.style.width=d+'px';brushRing.style.height=d+'px';
}
syncBrushRing();
brushSliderEl.addEventListener('input',syncBrushRing);
/* The canvas covers the whole viewport, so a wheel handler that swallows every
   event is a wheel handler that makes the page unscrollable — and scrolling is
   now how you move through the world. So the plain wheel belongs to the page,
   and the brush moves to Alt+wheel (not Ctrl, which is browser zoom, and not
   Shift, which is horizontal scroll). */
canvas.addEventListener('wheel',e=>{
  if(!e.altKey)return;            // let it bubble: the document scrolls
  e.preventDefault();
  const v=+brushSliderEl.value+(e.deltaY<0?1:-1);
  brushSliderEl.value=Math.max(+brushSliderEl.min,Math.min(+brushSliderEl.max,v));
  syncBrushRing();
},{passive:false});

/* ═══════════════════════════════════════════════════════
   MATERIAL PICKER + KEYS

function selectMat(m){
  curMat=m;
  document.querySelectorAll('.mat-opt').forEach(o=>o.classList.remove('active'));
  const t=document.querySelector(`.mat-opt[data-mat="${m}"]`);if(t)t.classList.add('active');
  refreshMatTag();   // the tag trailing your cursor names the loaded material
}
document.querySelectorAll('.mat-opt').forEach(el=>el.addEventListener('click',()=>selectMat(+el.dataset.mat)));
document.addEventListener('keydown',e=>{
  // Mirrors the Materials window exactly. The sim still knows POLLEN, MOSS,
  // LEAF, BRICK, THATCH, STEAM etc. — they're what sprites are built from and
  // what reactions produce — but none of them are paintable any more: a wall of
  // 21 rows buried the ones that actually do something when you pour them.
  const k={'1':SAND,'2':WATER,'3':FIRE,'4':STONE,'5':PLANT,'6':ACID,'7':OIL,
           'g':SEED,'0':EMPTY,'w':WOOD,'i':BIRD,
           'f':FUSE,'x':BOMB,'v':LAVA};
  if(k[e.key]!==undefined)selectMat(k[e.key]);
  if(e.key===' '){e.preventDefault();togglePhysics();}
});
