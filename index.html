  startBtn.addEventListener('click', e=>{ e.stopPropagation(); toggleStartMenu(); });
  document.addEventListener('mousedown', e=>{
    if(startMenu.style.display!=='none' && !startMenu.contains(e.target) && !startBtn.contains(e.target)){
      closeStartMenu();
    }
  });

  function focusWindow(win){
    document.querySelectorAll('.win-app').forEach(w=>w.classList.remove('is-focus'));
    win.classList.add('is-focus');
    win.style.zIndex = ++zTop;
    // mark taskbar buttons
    openWindows.forEach((info, id)=>{
      if(info.taskBtn) info.taskBtn.classList.toggle('is-active', info.el===win);
    });
  }

  function makeDraggable(win, handle){
    let dragging=false, ox=0, oy=0;
    function start(cx, cy, e){
      if(e.target.closest('.tbtn')) return;
      dragging=true;
      const r=win.getBoundingClientRect();
      ox=cx-r.left; oy=cy-r.top;
      focusWindow(win);
      e.preventDefault();
    }
    function move(cx, cy){
      if(!dragging) return;
      const [nx, ny] = clampWinPos(win, cx-ox, cy-oy);
      win.style.left=nx+'px'; win.style.top=ny+'px';
    }
    handle.addEventListener('mousedown', e=>start(e.clientX, e.clientY, e));
    document.addEventListener('mousemove', e=>move(e.clientX, e.clientY));
    document.addEventListener('mouseup', ()=>dragging=false);
    handle.addEventListener('touchstart', e=>{
      const t=e.touches[0]; start(t.clientX, t.clientY, e);
    }, {passive:false});
    document.addEventListener('touchmove', e=>{
      if(!dragging) return;
      const t=e.touches[0]; move(t.clientX, t.clientY); e.preventDefault();
    }, {passive:false});
    document.addEventListener('touchend', ()=>dragging=false);
    document.addEventListener('touchcancel', ()=>dragging=false);
  }

  function ensureTaskBtn(id, panel, win){
    let btn = openWindows.get(id)?.taskBtn;
    if(btn) return btn;
    btn = document.createElement('button');
    btn.className='taskbar-btn is-active';
    btn.innerHTML = `<span class="tb-ico tb-ico-px">${ico(panel.icon,'pxi-xs')}</span><span>${panel.title}</span>`;
    btn.addEventListener('click', ()=>{
      if(win.style.display==='none' || win.dataset.minimized==='1'){
        win.style.display='flex'; win.dataset.minimized='';
        focusWindow(win);
      } else if(win.classList.contains('is-focus')){
        win.dataset.minimized='1'; win.style.display='none';
        btn.classList.remove('is-active');
      } else {
        focusWindow(win);
      }
    });
    tasksEl.appendChild(btn);
    return btn;
  }

  function fitMaximized(win){
    win.style.left='4px'; win.style.top='4px';
    win.style.width=(window.innerWidth-12)+'px';
    win.style.height=(window.innerHeight-TASKBAR_H-10)+'px';
  }

  /* Rotating a phone (or the URL bar sliding away) changes innerWidth/Height
     under windows that were positioned against the old one, which used to
     strand them off-screen with no way back. */
  window.addEventListener('resize', ()=>{
    openWindows.forEach(info=>{
      const win = info.el;
      if(win.dataset.maxed==='1'){ fitMaximized(win); return; }
      const [nx, ny] = clampWinPos(win, parseFloat(win.style.left)||0, parseFloat(win.style.top)||0);
      win.style.left=nx+'px'; win.style.top=ny+'px';
    });
    document.querySelectorAll('.win95').forEach(win=>{
      if(win.style.display==='none' || !win.style.left) return;
      const [nx, ny] = clampWinPos(win, parseFloat(win.style.left)||0, parseFloat(win.style.top)||0);
      win.style.left=nx+'px'; win.style.top=ny+'px';
    });
  });

  /* Tab filtering + clip playback for the My Work window.
     Filtering hides tiles in place rather than re-rendering the grid: a rebuild
     would drop every poster the browser has already decoded and restart the
     clip that is running. */
  function initGallery(win){
    const tabs = [...win.querySelectorAll('.gal-tab')];
    const intro = win.querySelector('.gal-intro');
    const cards = [...win.querySelectorAll('.gal-card')];
    const panel = win.querySelector('.gal-panel');
    /* `focus` is false for the initial paint, where moving focus into the
       window would yank the page out from under a visitor who has not touched
       anything yet. Every user-driven selection passes true so the roving
       tabindex actually rides along with the arrow keys. */
    const selectTab = (tab, focus)=>{
      const cat = tab.dataset.cat;
      tabs.forEach(t=>{
        const on = t===tab;
        t.classList.toggle('is-on', on);
        t.setAttribute('aria-selected', on);
        // roving tabindex: one stop for the whole strip, arrows move within it
        t.tabIndex = on ? 0 : -1;
      });
      if(panel) panel.setAttribute('aria-labelledby', tab.id);
      cards.forEach(c=>{ c.style.display = (cat==='all'||c.dataset.cat===cat) ? '' : 'none'; });
      const spec = GAL_TABS.find(t=>t.cat===cat);
      if(intro && spec) intro.textContent = spec.intro;
      stop(); // a clip left running inside a now-hidden tile keeps decoding
      if(focus) tab.focus();
    };
    tabs.forEach((tab,i)=>{
      tab.addEventListener('click', ()=>selectTab(tab, false));
      tab.addEventListener('keydown', e=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectTab(tab, true); return; }
        const step = e.key==='ArrowRight' ? 1 : e.key==='ArrowLeft' ? -1 : 0;
        if(step){
          e.preventDefault();
          selectTab(tabs[(i+step+tabs.length)%tabs.length], true);
        } else if(e.key==='Home'||e.key==='End'){
          e.preventDefault();
          selectTab(e.key==='Home' ? tabs[0] : tabs[tabs.length-1], true);
        }
      });
    });

    /* Exactly one clip plays at a time. These compete for frames with the sand
       sim, and eight concurrent <video>s would cost more than the GIFs they
       replaced — the whole point of the swap. */
    let playing = null;
    function stop(){
      if(!playing) return;
      playing.pause();
      const card = playing.closest('.gal-card');
      if(card) card.classList.remove('is-playing');
      playing = null;
    }
    function play(card){
      const v = card && card.querySelector('video');
      if(v===playing) return;   // already the right clip (or nothing, twice over)
      stop();
      // Most tiles are stills or art-pending placeholders. Bailing out before
      // the stop() above let a clip keep running off-screen the moment the
      // most-visible tile happened to be one of them.
      if(!v) return;
      playing = v;
      // only fade the clip up once it has real frames, or the poster is
      // replaced by a black rectangle for as long as it takes to buffer
      v.addEventListener('playing', ()=>{ if(playing===v) card.classList.add('is-playing'); }, {once:true});
      const p = v.play();
      if(p && p.catch) p.catch(()=>{ if(playing===v) stop(); });
    }

    if(window.matchMedia('(hover:hover) and (pointer:fine)').matches){
      cards.forEach(card=>{
        card.addEventListener('mouseenter', ()=>play(card));
        card.addEventListener('mouseleave', ()=>{ if(playing===card.querySelector('video')) stop(); });
        card.addEventListener('focus', ()=>play(card));
      });
    } else {
      // No hover to key off, and tap has to stay "open the write-up" — so the
      // most-visible tile is the one that animates.
      // The callback only reports tiles whose visibility CHANGED, so the choice
      // is made against a running tally of all of them: judging by `entries`
      // alone leaves a clip playing after its tile has scrolled away, whenever
      // nothing else happens to cross a threshold on the way out.
      const body = win.querySelector('.win-body');
      const ratios = new Map();
      const io = new IntersectionObserver(entries=>{
        entries.forEach(e=>ratios.set(e.target, e.isIntersecting ? e.intersectionRatio : 0));
        let best=null, bestR=0.6; // below this nothing is worth animating
        ratios.forEach((r,card)=>{
          if(r>bestR && card.style.display!=='none'){ best=card; bestR=r; }
        });
        if(best) play(best); else stop();
      }, { root: body, threshold:[0, 0.25, 0.5, 0.75, 1] });
      cards.forEach(c=>io.observe(c));
      // the observer outlives the window otherwise, holding on to every tile
      win.addEventListener('win-destroy', ()=>io.disconnect());
    }
    win.addEventListener('win-destroy', stop);
    win.addEventListener('win-hide', stop);
  }

  /* ═════════════════════════════════════════════════════
     URL ROUTING
     Every write-up used to be unreachable by link: opening one changed nothing
     about the address bar, so nobody could send "look at Snaptrap", a refresh
     dropped you back on the grid, and Back did nothing after opening five
     windows. The hash now names the most recently opened panel and Back walks
     the trail of them — which in a windowing metaphor means "bring the previous
     window forward", not "close this one". Closing is still the ✕.
  ═════════════════════════════════════════════════════ */
  let routing = false;   // set while boot/popstate drive launchPanel, so it does not re-push

  // `#/snaptrap` -> 'snaptrap'. Anything that is not a real panel is ignored
  // rather than trusted, so a hand-edited hash cannot wedge the boot.
  function routeIdFromHash(){
    let h;
    try { h = decodeURIComponent(location.hash.replace(/^#\/?/, '')); }
    catch(e){ return null; }               // malformed %-escape
    return Object.prototype.hasOwnProperty.call(PANELS, h) ? h : null;
  }
  function bareURL(){ return location.pathname + location.search; }
  function pushRoute(id){
    if(routing || routeIdFromHash() === id) return;
    history.pushState({panel:id}, '', '#/'+id);
  }
  /* The URL must not keep naming a window that is no longer on screen. This
     rewrites the current entry rather than pushing, so Back still leads to
     whatever was open before instead of re-opening what was just dismissed. */
  function syncRoute(){
    let top=null, topZ=-1;
    openWindows.forEach((rec, key)=>{
      if(rec.el.dataset.minimized==='1' || rec.el.style.display==='none') return;
      const z = parseInt(rec.el.style.zIndex, 10) || 0;
      if(z > topZ){ topZ = z; top = key; }
    });
    history.replaceState({panel:top}, '', top ? '#/'+top : bareURL());
  }
  window.addEventListener('popstate', ()=>{
    const id = routeIdFromHash();
    routing = true;
    try{
      if(id) launchPanel(id);
      else if(openWindows.has('work')) focusWindow(openWindows.get('work').el);
    } finally { routing = false; }
  });

  function launchPanel(id){
    const panel = PANELS[id];
    if(!panel) return;
    pushRoute(id);
    const existing = openWindows.get(id);
    if(existing){
      existing.el.style.display='flex';
      existing.el.dataset.minimized='';
      focusWindow(existing.el);
      return;
    }
    const win=document.createElement('div');
    win.className='win-app is-focus theme-'+(panel.theme||'desktop');
    /* themed detail pages carry their own hue rather than their own stylesheet */
    if(panel.accent) win.style.setProperty('--proj', panel.accent);
    if(panel.bar) win.style.setProperty('--proj-bar', panel.bar);
    win.style.zIndex = ++zTop;
    win.innerHTML = `
      <div class="win-title">
        <span class="wt-name">${ico(panel.icon,'pxi-xs')}${panel.title}</span>
        <div class="tbtns">
          <div class="tbtn" data-act="min">_</div>
          <div class="tbtn" data-act="max">□</div>
          <div class="tbtn" data-act="close">✕</div>
        </div>
      </div>
      <div class="win-body">${panel.html}</div>
    `;
    winLayer.appendChild(win);
    // Cascade as before, but only as far as the viewport allows — measured
    // after append so the clamp sees the real, CSS-capped size.
    const step = openWindows.size % 6;
    let lx = 60 + step*32, ly = 50 + step*28;
    // when the window all but fills the width there is no room to cascade
    // sideways — centre it rather than shoving it against the right edge
    const spareX = window.innerWidth - win.offsetWidth;
    if(spareX < lx) lx = Math.round(spareX/2);
    [lx, ly] = clampWinPos(win, lx, ly);
    win.style.left = lx+'px'; win.style.top = ly+'px';
    if(id==='about' && typeof window.initRobot==='function') window.initRobot();
    if(id==='work') initGallery(win);
    const titleBar = win.querySelector('.win-title');
    makeDraggable(win, titleBar);
    win.addEventListener('mousedown', ()=>focusWindow(win));
    // touch raises focus immediately instead of waiting on the synthetic
    // mousedown that only arrives after the tap resolves
    win.addEventListener('touchstart', ()=>focusWindow(win), {passive:true});

    const taskBtn = ensureTaskBtn(id, panel, win);
    openWindows.set(id, { el:win, taskBtn });

    win.querySelector('[data-act="min"]').addEventListener('click', e=>{
      e.stopPropagation();
      win.dataset.minimized='1'; win.style.display='none';
      taskBtn.classList.remove('is-active');
      // a hidden window still runs its media — tell the panel to settle down
      win.dispatchEvent(new CustomEvent('win-hide'));
      syncRoute();
    });
    win.querySelector('[data-act="close"]').addEventListener('click', e=>{
      e.stopPropagation();
      win.dispatchEvent(new CustomEvent('win-destroy'));
      win.remove(); taskBtn.remove();
      openWindows.delete(id);
      syncRoute();
    });
    win.querySelectorAll('[data-launch]').forEach(ic=>{
      ic.style.cursor='pointer';
      ic.addEventListener('click', e=>{
        e.preventDefault(); e.stopPropagation();
        launchPanel(ic.getAttribute('data-launch'));
      });
      // gallery tiles and desktop icons are <a> without href, so they get no
      // keyboard activation for free
      if(ic.hasAttribute('tabindex')){
        ic.addEventListener('keydown', e=>{
          if(e.key!=='Enter' && e.key!==' ') return;
          e.preventDefault(); e.stopPropagation();
          launchPanel(ic.getAttribute('data-launch'));
        });
      }
    });
    win.querySelector('[data-act="max"]').addEventListener('click', e=>{
      e.stopPropagation();
      if(win.dataset.maxed==='1'){
        win.style.left=win.dataset.preL; win.style.top=win.dataset.preT;
        win.style.width=win.dataset.preW; win.style.height='';
        win.style.maxHeight='';   // fall back to the stylesheet's 70dvh
        win.style.maxWidth='';
        win.dataset.maxed='';
      } else {
        win.dataset.preL=win.style.left; win.dataset.preT=win.style.top;
        win.dataset.preW=win.style.width;
        // maxWidth has to go too, or the stylesheet's cap (560px / 100vw-16px)
        // quietly shrinks the "maximised" window back down
        win.style.maxWidth='none';
        win.style.maxHeight='none';
        fitMaximized(win);
        win.dataset.maxed='1';
      }
    });

    focusWindow(win);
  }

  // the sim calls this when a window has burned past saving, so the taskbar
  // button goes with it and the panel can be relaunched from scratch
  window.__closeWindowEl = function(el){
    el.dispatchEvent(new CustomEvent('win-destroy'));
    for(const [id, info] of openWindows){
      if(info.el===el){ if(info.taskBtn) info.taskBtn.remove(); openWindows.delete(id); break; }
    }
    el.remove();
  };

  // On a phone the Materials palette is ~240px tall in the top-right corner —
  // it sat on top of every window that launched. Boot it collapsed to its title
  // bar; the □ button opens it, and it still remembers position if dragged.
  if(window.matchMedia('(max-width:600px)').matches){
    const mp = document.getElementById('matPicker');
    if(mp) mp.classList.add('is-min');
  }

  // Boot straight into the work itself. Overview used to open here, but it was
  // a directory of names — a visitor had to click twice before seeing anything
  // that had been built. My Work carries its own identity header so this still
  // opens on who as well as what.
  // A link to a specific write-up opens the grid underneath it, so closing the
  // write-up leaves the visitor somewhere rather than on a bare desktop.
  setTimeout(()=>{
    const deep = routeIdFromHash();
    routing = true;                       // the whole boot is one history entry
    launchPanel('work');
    if(deep && deep!=='work') launchPanel(deep);
    routing = false;
    // replace, never push: Back out of the first window the visitor opens
    // should land on the grid, not bounce them off the site
    history.replaceState({panel: deep || 'work'}, '', deep ? '#/'+deep : bareURL());
  }, 200);
})();

/* ═══════════════════════════════════════════════════════
   EVIL CHEST — "DO NOT OPEN"
   A chained, padlocked chest sits in the pine grove, twitching.
   Clicking it unlatches the lid and lets loose a pack of rogue
   cursors: each one flies up to the Materials window, hovers a
   random material and clicks it, then scribbles that material
   across the world with its own brush size. They wander for a
   while, swap materials a few times, then flee off-screen and
   the chest latches itself shut again. Clicking the OPEN chest
   banishes the pack early.

   The chest is a sprite on the same canvas as the birds and the
   cat — one sprite pixel per sim cell, no DOM, no filters — so it
   sits in the world's pixel layer rather than on top of it. Only
   the cursors are DOM, because they have to visit real menu rows;
   their painting converts back to sim cells against the canvas
   rect and reuses paint() with a per-cursor brush override.
═══════════════════════════════════════════════════════ */
const evilCursorLayer=document.getElementById('evilCursors');
// standing in the pine grove, clear of the pond (which ends at 0.795W) and
// placed so a pine still shows either side of it
const EVIL_CHEST_AT=0.90;
// sized against the scenery — the cottage is 26x24 cells and the pines 15x22,
// so 30x27 reads as the biggest thing in the clearing without being absurd
const EVIL_W=30,EVIL_H=27;
const EVIL_FEET=26;         // sprite row that sits on the ground
const EVIL_PAD=8;           // headroom above row 0 for the lid to swing into
const EVIL_BH=EVIL_H+EVIL_PAD;
const evilCursors=[];
let evilOpen=false,evilArming=false;
let evilOpenT=0,evilTick=0,evilDirty=true;
let evilSX=-999,evilSY=-999;   // sprite origin in sim cells
let evilShakeT=0,evilTwitchT=200,evilBurstT=0;

/* ── pixel art ────────────────────────────────────────────
   The chest is drawn as MATERIALS, not colours: every cell picks a sim
   material + variant, and the sprite is coloured through matTexel — the same
   palette, jitter and micro-texture the world is painted with. So its planks
   are the timber the cottage is built from, its bands are stone, its warning
   board is thatch and its eyes are fire. */
const EC={
  wood:WOOD, woodLit:2, woodShade:1, woodDeep:3,    // variant = shade index
  iron:STONE, ironLit:ASH, ironDark:BODY,
  board:THATCH, ink:BERRY,
  glow:FIRE, ember:LAVA, dark:BODY, bone:SAND, moss:MOSS
};
// 3x5 pixel glyphs — only the letters "DO NOT OPEN" needs
const EVIL_FONT={
  D:[0b110,0b101,0b101,0b101,0b110],
  O:[0b111,0b101,0b101,0b101,0b111],
  N:[0b101,0b111,0b111,0b111,0b101],
  T:[0b111,0b010,0b010,0b010,0b010],
  P:[0b111,0b101,0b111,0b100,0b100],
  E:[0b111,0b100,0b110,0b100,0b111],
  ' ':[0,0,0,0,0]
};
// lid silhouette (rows 0-9): the arch narrows toward the crown
function evilLidSpan(r){
  const s=[[10,19],[7,22],[5,24],[3,26],[2,27]];
  return r<s.length?s[r]:[1,28];
}
// the sprite is rendered once into an offscreen buffer and blitted onto the
// bird canvas every frame, so a redraw only happens when the chest changes
let evilCtx=null,evilImg=null;
const evilMat=new Uint8Array(EVIL_W*EVIL_BH);
const evilVar=new Uint8Array(EVIL_W*EVIL_BH);
function drawEvilChest(){
  const g=evilCtx;
  if(!g)return;
  evilMat.fill(0);evilVar.fill(0);
  const o=evilOpenT;                       // 0 = latched, 1 = wide open
  // Hinging the lid back = squash it toward its own top edge and lift it clear.
  // Both are whole-cell, so every row still lands on the grid — shearing it
  // into a parallelogram read as a broken sprite.
  const lift=Math.round(o*3), sq=1-0.35*o;
  const lidY=r=>Math.round(r*sq)-lift;
  // sprite rows are chest-relative; the buffer carries EVIL_PAD rows of sky
  // above row 0 so the lid has somewhere to go
  const px=(x,y,m,v)=>{
    if(x<0||x>=EVIL_W||y<-EVIL_PAD||y>=EVIL_H)return;
    const i=(y+EVIL_PAD)*EVIL_W+x;evilMat[i]=m;evilVar[i]=v||0;
  };
  const row=(x0,x1,y,m,v)=>{for(let x=x0;x<=x1;x++)px(x,y,m,v);};
  const box=(x0,y0,x1,y1,m,v)=>{for(let y=y0;y<=y1;y++)row(x0,x1,y,m,v);};
  // chain + lock dissolve pixel by pixel as the lid comes up
  const held=(x,y)=>o<=0||(hash2i(x+31,y*7)%997)/997>o;
  // one 2-wide iron band, flat — the scenery sprites don't shade finer than this
  const strap=(x0,y,dx)=>{px(x0+dx,y,EC.iron);px(x0+1+dx,y,EC.ironDark);};
  // 2-row run of links: light/dark alternating pairs read as interlocking rings
  const chain=(x0,x1,y,dx)=>{
    for(let x=x0;x<=x1;x++){
      if(!held(x,y))continue;
      const a=((x-x0)&3)<2;
      px(x+dx,y,a?EC.ironLit:EC.iron);
      px(x+dx,y+1,a?EC.iron:EC.ironLit);
    }
  };

  /* ── the maw: the gap between the hinged lid and the body ── */
  if(o>0){
    box(2,lidY(9)+1,27,10,EC.dark);
    for(let x=4;x<26;x+=2)if(Math.random()>0.35)px(x,10,EC.ember);
  }

  /* ── lid (rows 0-9) ── */
  for(let r=0;r<=9;r++){
    const [x0,x1]=evilLidSpan(r);
    const y=lidY(r);
    if(r===0||r===9){row(x0,x1,y,WOOD,EC.woodDeep);continue;}
    row(x0,x1,y,WOOD,r<=2?EC.woodLit:0);                 // one lit band, then base
    px(x0,y,WOOD,EC.woodDeep);px(x1,y,WOOD,EC.woodDeep);
    if(r>=2){strap(4,y,0);strap(24,y,0);}                // straps arc over the lid
  }

  /* ── body (rows 10-24) ── */
  row(1,28,10,WOOD,EC.woodDeep);
  box(1,11,28,24,WOOD,0);
  for(let y=11;y<=24;y++){px(1,y,WOOD,EC.woodDeep);px(28,y,WOOD,EC.woodDeep);}
  for(let y=11;y<=24;y++){strap(4,y,0);strap(24,y,0);}
  row(1,28,25,WOOD,EC.woodDeep);                         // foot rail

  /* ── warning board nailed across the front ── */
  box(2,12,27,24,EC.board);
  row(2,27,12,EC.board,3);row(2,27,24,EC.board,3);
  for(let y=12;y<=24;y++){px(2,y,EC.board,3);px(27,y,EC.board,3);}
  const word=(s,sx,sy)=>{
    for(let i=0;i<s.length;i++){
      const gl=EVIL_FONT[s[i]];
      if(!gl)continue;
      for(let r=0;r<5;r++)for(let c=0;c<3;c++)
        if(gl[r]&(4>>c))px(sx+i*4+c,sy+r,EC.ink,3);
    }
  };
  word('DO NOT',3,14);       // 6 glyphs -> 23 wide, centred in the board
  word('OPEN',7,20);         // 4 glyphs -> 15 wide

  /* ── chain + padlock ── */
  chain(2,27,10,0);
  if(o<1){
    const drop=Math.round(o*o*18);                       // the lock falls away
    const lk=(x,y,m,v)=>{if(held(x,y))px(x,y+drop,m,v);};
    // the lock straddles the lid seam and stops clear of the warning board
    for(let x=14;x<=15;x++)lk(x,lidY(4),EC.iron);        // shackle rides the lid
    for(const x of [13,16])for(let y=5;y<=7;y++)lk(x,lidY(y),EC.iron);
    for(let y=7;y<=11;y++)for(let x=12;x<=17;x++)
      lk(x,y,(y===7||y===11||x===12||x===17)?EC.ironDark:EC.iron);
    lk(14,9,EC.dark);lk(15,9,EC.dark);                   // keyhole
  }

  /* ── colour it through the world's palette, under the world's light ──
     matTexel gives the raw material colour; the shader then multiplies every
     particle by the ambient day factor and posterizes it to 8 levels. Doing
     the same here is what keeps the chest from glowing on a night meadow. */
  if(!evilImg)evilImg=g.createImageData(EVIL_W,EVIL_BH);
  const d=evilImg.data;
  const amb=0.16+0.84*dayFactor();
  for(let y=0;y<EVIL_BH;y++)for(let x=0;x<EVIL_W;x++){
    const i=y*EVIL_W+x, o4=i*4;
    matTexel(evilMat[i],evilVar[i],evilSX+x,evilSY+y-EVIL_PAD,d,o4);
    if(!d[o4+3])continue;
    for(let k=0;k<3;k++){
      const lv=Math.floor((d[o4+k]/255)*amb*7.99)/7;
      d[o4+k]=Math.min(255,Math.round(lv*255));
    }
  }
  g.putImageData(evilImg,0,0);
  evilDirty=false;
}

/* ── placement: the chest sits on the forest floor ────── */
// the SOIL line at a column, not the canopy: bushes, flowers, trunks and
// leaves all stand on the ground, so skipping them is what stops the chest
// perching on top of a shrub
function evilSoilY(x){
  if(x<0||x>=W)return H;
  for(let y=0;y<H;y++){
    const m=grid[idx(x,y)];
    if(m===DIRT||m===GRASS||m===SAND||m===STONE||m===MOSS||m===ASH||m===BRICK)return y;
  }
  return H;
}
function placeEvilChest(){
  if(!W||!H)return;
  evilSX=Math.max(4,Math.min(W-EVIL_W-1,Math.round(W*EVIL_CHEST_AT)-(EVIL_W>>1)));
  // median soil height across the footprint: a lone dip or mound doesn't tip it
  const gs=[];
  for(let x=evilSX+2;x<=evilSX+EVIL_W-3;x++)gs.push(Math.min(H-1,evilSoilY(x)));
  gs.sort((a,b)=>a-b);
  const gy=gs.length?gs[gs.length>>1]:H-1;
  // The near plane isn't sim particles at all — the shader lays a turf berm
  // over the bottom of the frame, cresting a cell above the taskbar (uBar) and
  // ragged from there. Down here that berm IS the ground you see, so the chest
  // stands on its lowest crest line; on a rise the soil wins instead.
  const bermTop=H-Math.ceil(TASKBAR_PX/SCALE)-1;
  evilSY=Math.min(gy-EVIL_FEET+2,bermTop-(EVIL_FEET-1));
}
// invisible collision under the chest body so sand piles on the lid
function stampEvilChestMask(){
  if(!W||!H||evilSX<0)return;
  for(let y=evilSY;y<=evilSY+EVIL_FEET-1;y++)for(let x=evilSX+1;x<=evilSX+28;x++){
    if(x<0||x>=W||y<0||y>=H)continue;
    if(y<evilSY+10){                // the arched lid: skip the sky either side
      const [lx0,lx1]=evilLidSpan(y-evilSY);
      if(x<evilSX+lx0||x>evilSX+lx1)continue;
    }
    const i=idx(x,y);
    if(grid[i]===EMPTY){grid[i]=MASK;variant[i]=0;}
  }
}
// is this sim cell on the chest? (used for click + hover)
function evilChestHit(sx,sy){
  if(evilSX<0)return false;
  const x=sx-evilSX,y=sy-evilSY;
  if(x<1||x>28||y<0||y>EVIL_FEET)return false;
  if(y<10){const [a,b]=evilLidSpan(y);return x>=a&&x<=b;}
  return true;
}
/* ── blit onto the world's sprite layer ───────────────── */
function drawEvilChestSprite(){
  if(!evilCtx||evilSX<0||birdCanvas.width!==W)return;
  // whole-cell offsets, held for a few frames each: flipping every frame just
  // reads as a blur, and anything sub-cell would break the pixel grid
  let jx=0,jy=0;
  if(evilShakeT>0){                              // rattling before it bursts open
    const k=((evilShakeT/3)|0)&3;
    jx=(k===0||k===3)?-1:1;
    jy=(k===1)?-1:0;
  }else if(evilTwitchT<8&&!evilOpen){            // the odd restless shudder
    jx=(((evilTwitchT/4)|0)&1)?1:-1;
  }
  bctx.drawImage(evilCtx.canvas,evilSX+jx,evilSY-EVIL_PAD+jy);
  if(evilBurstT>0){                              // pixel shockwave off the lid
    const cx=evilSX+15,cy=evilSY+6,r=(26-evilBurstT)*1.0;
    const col=matColor(evilBurstT>16?LAVA:FIRE,0);
    bctx.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    for(let a=0;a<38;a++){
      const t=a/38*Math.PI*2;
      bctx.fillRect(Math.round(cx+Math.cos(t)*r*1.5),Math.round(cy+Math.sin(t)*r),1,1);
    }
  }
}

/* ── material pool: read straight off the Materials window ── */
const EVIL_RARE=new Set([3,30,6,28]); // fire/lava/acid/bomb — funnier when rare
function evilRows(){
  return [...document.querySelectorAll('#matPicker .mat-opt')].filter(o=>+o.dataset.mat!==0);
}
function evilPickRow(){
  const rows=evilRows();
  if(!rows.length)return null;
  for(let t=0;t<8;t++){
    const r=rows[Math.random()*rows.length|0];
    if(EVIL_RARE.has(+r.dataset.mat)&&Math.random()<0.75)continue;
    return r;
  }
  return rows[0];
}
function evilRowInfo(row){
  const dot=row.querySelector('.mat-dot');
  return {
    mat:+row.dataset.mat,
    name:(row.textContent||'').replace(/\s*\[.\]\s*$/,'').trim(),
    color:dot?dot.style.background:'#fff'
  };
}

/* ── the cursors ──────────────────────────────────────── */
// the stock arrow, pixel for pixel, at 2x so it reads at desktop size
const EVIL_ARROW=[
  'X..........',
  'XX.........',
  'XWX........',
  'XWWX.......',
  'XWWWX......',
  'XWWWWX.....',
  'XWWWWWX....',
  'XWWWWWWX...',
  'XWWWWWWWX..',
  'XWWWWWWWWX.',
  'XWWWWWXXXXX',
  'XWWXWWX....',
  'XWX.XWWX...',
  'XX..XWWX...',
  'X....XWWX..',
  '.....XWWX..',
  '......XX...'
];
function evilArrowCanvas(z){
  z=z||2;                                  // baked in, so nothing is CSS-scaled
  const c=document.createElement('canvas');
  c.width=11*z;c.height=17*z;
  const g=c.getContext('2d');
  for(let y=0;y<EVIL_ARROW.length;y++)for(let x=0;x<EVIL_ARROW[y].length;x++){
    const ch=EVIL_ARROW[y][x];
    if(ch==='.')continue;
    g.fillStyle=ch==='X'?'#000':'#fdfdfd';
    g.fillRect(x*z,y*z,z,z);
  }
  return c;
}
function spawnEvilCursor(hold){
  const cr=canvas.getBoundingClientRect();
  const originX=cr.left+(evilSX+15)*SCALE, originY=cr.top+(evilSY+6)*SCALE;
  const el=document.createElement('div');
  el.className='evil-cursor';
  el.style.opacity='0';
  el.innerHTML=`<span class="mat-tag"><i></i><b>…</b></span>`;
  el.insertBefore(evilArrowCanvas(),el.firstChild);
  evilCursorLayer.appendChild(el);
  const c={
    el, tag:el.querySelector('.mat-tag'),
    x:originX+(Math.random()*24-12),
    y:originY,
    vx:(Math.random()*2-1)*7, vy:-4-Math.random()*4,
    tx:0, ty:0, phase:'hold', t:0, hold:hold|0,
    mat:1, brush:2+Math.random()*4|0,
    row:null, strokes:0, want:2+Math.random()*4|0,
    life:1200+Math.random()*800|0, lx:-1, ly:-1,
    wob:0.9+Math.random()*1.8, wobT:Math.random()*6.28, speed:5+Math.random()*4
  };
  evilCursors.push(c);
  evilDrawCursor(c);
}
function evilDrawCursor(c){
  c.el.style.transform=`translate(${c.x.toFixed(1)}px,${(c.y+(c.press||0)).toFixed(1)}px)`;
}
function evilSeek(c,speed){
  const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
  if(d<2.5){c.x=c.tx;c.y=c.ty;return true;}
  const s=Math.min(speed,d);
  c.x+=dx/d*s;c.y+=dy/d*s;
  return false;
}
function evilRoam(cr){
  return {x:cr.left+24+Math.random()*Math.max(40,cr.width-48),
          y:cr.top+cr.height*0.14+Math.random()*cr.height*0.66};
}
function evilClearRow(c){
  if(c.row){c.row.classList.remove('evil-pick','evil-click');c.row=null;}
}
function evilTakeMaterial(c,row){
  const info=row?evilRowInfo(row):{mat:1,name:'sand',color:'#cda852'};
  c.mat=info.mat;
  c.tag.querySelector('i').style.background=info.color;
  c.tag.querySelector('b').textContent=info.name;
}
// stroke interpolation, per cursor — mirrors paintStroke but with its own
// last-position latch and brush so the pack doesn't fight over the HUD state
function evilPaint(c,cr){
  const sx=Math.floor((c.x-cr.left)/SCALE),sy=Math.floor((c.y-cr.top)/SCALE);
  if(sx<0||sx>=W||sy<0||sy>=H){c.lx=-1;return;}
  if(c.lx<0){paint(sx,sy,c.mat,c.brush);}
  else{
    const dx=sx-c.lx,dy=sy-c.ly,dist=Math.max(Math.abs(dx),Math.abs(dy));
    const step=Math.max(1,c.brush>>1);
    if(dist<=step)paint(sx,sy,c.mat,c.brush);
    else{
      const n=Math.ceil(dist/step);
      for(let k=1;k<=n;k++)paint(Math.round(c.lx+dx*k/n),Math.round(c.ly+dy*k/n),c.mat,c.brush);
    }
  }
  c.lx=sx;c.ly=sy;
}
function updateEvilCursors(){
  if(!evilCursors.length)return;
  const cr=canvas.getBoundingClientRect();
  for(let i=evilCursors.length-1;i>=0;i--){
    const c=evilCursors[i];
    c.t++;
    if(c.life>0)c.life--;

    switch(c.phase){
      case 'hold':                       // staggered burst out of the chest
        if(c.hold-->0)break;
        c.el.style.opacity='1';
        c.phase='burst';c.t=0;
        break;

      case 'burst':                      // ballistic pop, then off to the menu
        c.x+=c.vx;c.y+=c.vy;c.vy+=0.55;c.vx*=0.97;
        if(c.t>16){c.phase='toMenu';evilAimAtMenu(c);}
        break;

      case 'toMenu':
        if(evilSeek(c,c.speed+2)){
          c.phase='pick';c.t=0;
          if(c.row)c.row.classList.add('evil-pick');
        }
        break;

      case 'pick':                       // hover the row, click it, take the material
        if(c.t===14&&c.row)c.row.classList.add('evil-click');
        c.press=(c.t>=14&&c.t<20)?2:0;   // the little downward jab of a click
        if(c.t>=24){
          evilTakeMaterial(c,c.row||c.pending);
          c.pending=null;
          evilClearRow(c);
          c.phase='draw';c.lx=-1;c.strokes=0;
          c.want=2+Math.random()*4|0;
          const p=evilRoam(cr);c.tx=p.x;c.ty=p.y;
        }
        break;

      case 'draw':{                      // scribble: seek the target, wiggling
        const arrived=evilSeek(c,c.speed);
        c.wobT+=0.24;
        const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy)||1;
        c.x+=(-dy/d)*Math.sin(c.wobT)*c.wob;
        c.y+=( dx/d)*Math.sin(c.wobT)*c.wob;
        evilPaint(c,cr);
        if(arrived){
          c.strokes++;
          if(c.life<=0){c.phase='flee';c.el.style.opacity='0';c.t=0;evilFleeTarget(c);}
          else if(c.strokes>=c.want){c.phase='toMenu';c.lx=-1;evilAimAtMenu(c);}
          else{const p=evilRoam(cr);c.tx=p.x;c.ty=p.y;}
        }
        break;
      }

      case 'flee':
        evilSeek(c,11);
        if(c.t>40)c.dead=true;
        break;
    }

    evilDrawCursor(c);
    if(c.dead){evilClearRow(c);c.el.remove();evilCursors.splice(i,1);}
  }
  if(!evilCursors.length&&evilOpen)closeEvilChest();
}
function evilAimAtMenu(c){
  const row=evilPickRow();
  const picker=document.getElementById('matPicker');
  const r=row?row.getBoundingClientRect():null;
  if(r&&r.width>2&&r.height>2){
    c.row=row;
    c.tx=r.left+r.width*0.45+(Math.random()*10-5);
    c.ty=r.top+r.height*0.5;
  }else{
    // menu collapsed or off-screen: nudge the picker chrome and pick blind
    const pr=picker.getBoundingClientRect();
    c.row=null;c.pending=row;
    c.tx=pr.left+pr.width*0.5;c.ty=pr.top+pr.height*0.5;
  }
  c.lx=-1;
}
function evilFleeTarget(c){
  const side=Math.random();
  c.tx=side<0.5?-60:window.innerWidth+60;
  c.ty=c.y+(Math.random()*200-100);
}

/* ── opening / closing ────────────────────────────────── */
function openEvilChest(){
  if(evilOpen||evilArming)return;
  evilArming=true;
  evilShakeT=38;                                 // rattle, then burst
  setTimeout(()=>{
    evilShakeT=0;evilBurstT=26;
    evilOpen=true;evilArming=false;
    const n=window.innerWidth<900?4:6;
    for(let k=0;k<n;k++)spawnEvilCursor(k*7);
  },640);
}
function closeEvilChest(){evilOpen=false;}
function toggleEvilChest(){
  if(evilOpen||evilCursors.length)banishEvilCursors();
  else openEvilChest();
}
// per-frame: ease the lid open/shut, run the blink + fidget timers
function updateEvil(){
  const want=evilOpen?1:0;
  if(evilOpenT!==want){
    evilOpenT+=Math.sign(want-evilOpenT)*(want?0.055:0.035);
    if(Math.abs(want-evilOpenT)<0.03)evilOpenT=want;
    evilDirty=true;
  }
  if(evilShakeT>0)evilShakeT--;
  if(evilBurstT>0)evilBurstT--;
  if(--evilTwitchT<0)evilTwitchT=340+(Math.random()*160|0);
  // the only live pixels are the embers in its throat, so it only needs
  // re-rendering while it is open — plus a slow tick to follow the day/night
  // light the rest of the world is shaded by
  if(--evilTick&7){}else if(evilOpenT>0)evilDirty=true;
  if((evilTick&31)===0)evilDirty=true;
  if(evilDirty)drawEvilChest();
  drawEvilChestSprite();
  updateEvilCursors();
}
function banishEvilCursors(){
  for(const c of evilCursors){
    if(c.phase==='flee')continue;
    evilClearRow(c);
    c.phase='flee';c.t=0;c.el.style.opacity='0';evilFleeTarget(c);
  }
}
(function(){
  const cv=document.createElement('canvas');
  cv.width=EVIL_W;cv.height=EVIL_BH;
  evilCtx=cv.getContext('2d');
  drawEvilChest();
})();
/* ── clicking the sprite ──────────────────────────────
   The chest lives on the canvas, so the press is claimed inside the paint
   handlers themselves (mousedown/touchstart), which check evilChestHit first
   and toggle instead of painting. Doing it there — rather than a separate
   capture-phase listener on the same element — avoids depending on listener
   ordering, which browsers resolve by registration order on the target node,
   not by the capture flag. That inconsistency is what left mobile taps
   pouring material onto the chest instead of opening it. */

/* ── YOUR cursor gets the same treatment ──────────────
   The arrow is a real CSS cursor built from the same bitmap, so the pointer
   never lags behind itself, and the tag that trails it is the same Win95
   tooltip the rogue cursors carry — it just reads the live material instead
   of a stolen one. */
const userTag=document.getElementById('userTag');
const USER_CURSOR=`url(${evilArrowCanvas().toDataURL()}) 1 1, crosshair`;
function refreshMatTag(){
  if(!userTag)return;
  const rowEl=document.querySelector(`#matPicker .mat-opt[data-mat="${curMat}"]`);
  const info=rowEl?evilRowInfo(rowEl):{name:'erase',color:'#111'};
  userTag.querySelector('i').style.background=info.color;
  userTag.querySelector('b').textContent=info.name;
}
// A touch device has no pointer to dress up, and mobile browsers synthesise a
// mousemove on tap — which would strand the tag under the finger with no
// mouseleave to ever clear it. So the whole thing is desktop-only.
const hasFinePointer=!window.matchMedia||window.matchMedia('(hover:hover) and (pointer:fine)').matches;
if(hasFinePointer){
  refreshMatTag();
  canvas.style.cursor=USER_CURSOR;
  canvas.addEventListener('mousemove',e=>{
    canvas.style.cursor=evilChestHit(...simXY(e))?'pointer':USER_CURSOR;
  },true);
  // tracked on the document, not the canvas: the canvas covers the whole stage,
  // so hovering a window never fires its mouseleave and the tag would hang there
  document.addEventListener('mousemove',e=>{
    const overWorld=e.target===canvas;
    userTag.style.opacity=overWorld?'1':'0';
    if(overWorld)userTag.style.transform=`translate(${e.clientX+15}px,${e.clientY+19}px)`;
  });
  document.addEventListener('mouseleave',()=>{userTag.style.opacity='0';});
}else{
  userTag.style.display='none';
}
// place it once the world exists, and again whenever the world is rebuilt
function refreshEvilChest(){placeEvilChest();stampEvilChestMask();}
requestAnimationFrame(()=>requestAnimationFrame(refreshEvilChest));
document.getElementById('btnReset').addEventListener('click',()=>requestAnimationFrame(refreshEvilChest));
let evilResizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(evilResizeTimer);
  evilResizeTimer=setTimeout(refreshEvilChest,320);
});
</script>
<script src="robot.js" defer></script>
