// Stamp a sprite anchored so its bottom-left lands at (gx, gy_bottom).
// Pixels are written FROZEN (the sprite holds its pixel-art shape) except
// for FIRE/WATER cells which need to keep behaving normally.
// Largest row width in a sprite — used for centered placement.
function spriteW(name){
  const art=SPRITES[name];if(!art)return 0;
  let w=0;for(let i=0;i<art.length;i++)if(art[i].length>w)w=art[i].length;
  return w;
}
function spriteH(name){const a=SPRITES[name];return a?a.length:0;}

function stampSprite(name,gx,gyBottom){
  const art=SPRITES[name];
  if(!art)return;
  const h=art.length;
  const gy=gyBottom-h+1;
  for(let dy=0;dy<h;dy++){
    const row=art[dy];
    for(let dx=0;dx<row.length;dx++){
      const spec=SPRITE_MATS[row[dx]];
      if(!spec)continue;
      const nx=gx+dx,ny=gy+dy;
      if(nx<0||nx>=W||ny<0||ny>=H)continue;
      const gi=idx(nx,ny);
      // never overwrite bedrock, terrain text, or another sprite already stamped
      const cur=grid[gi];
      if(cur===STONE||frozen[gi])continue;
      grid[gi]=spec.m;
      variant[gi]=spec.v;
      if(spec.m!==FIRE&&spec.m!==WATER)frozen[gi]=1;
    }
  }
}

function spawnNaturalLandscape(){
  const soilDepth=Math.max(4,Math.floor(H*0.02));
  // gentler rolling hills — sprites now carry the visual rhythm,
  // so the meadow itself reads as a calm stage rather than a noisy ground.
  const hillAmp=Math.floor(H*0.045);
  const baseLine=H-Math.max(4,Math.floor(H*0.014));
  const surf=new Int16Array(W);

  for(let x=0;x<W;x++){
    const n=hillNoise(x)*0.5+0.5;
    // quantise the surface to 2-cell steps so the horizon reads as
    // deliberate pixel-art stairs instead of an analog curve.
    let s=baseLine-Math.floor(n*hillAmp);
    s=s-(s&1);
    surf[x]=s;
  }

  const pondCX=Math.floor(W*0.70);
  const pondRX=Math.max(14,Math.floor(W*0.095));
  const pondRY=Math.max(6,Math.floor(H*0.042));
  const pondRefX=Math.max(0,Math.min(W-1,pondCX));
  const pondMidY=surf[pondRefX];
  const bowlFloor=pondMidY+Math.floor(pondRY*0.55);
  const waterY=bowlFloor-Math.floor(pondRY*0.35);

  // carve a soft dell for the pond
  for(let x=Math.max(0,pondCX-pondRX-4);x<Math.min(W,pondCX+pondRX+4);x++){
    const dx=(x-pondCX)/pondRX;
    if(Math.abs(dx)>=1)continue;
    const drop=Math.floor((1-dx*dx)*pondRY*1.05);
    surf[x]=Math.max(surf[x],bowlFloor-drop);
  }

  function pondEl(x,y){
    const dx=(x-pondCX)/pondRX,dy=(y-(bowlFloor-pondRY*0.15))/pondRY;
    return dx*dx+dy*dy;
  }

  // pass 1 — earth and bedrock
  for(let x=0;x<W;x++){
    for(let y=surf[x];y<H;y++){
      const d=y-surf[x];
      if(d===0)putCell(x,y,GRASS);
      else if(d<soilDepth)putCell(x,y,DIRT);
      else putCell(x,y,STONE);
    }
  }

  // pass 2 — pond bowl, banks, water
  const px0=Math.max(0,pondCX-pondRX-5.5|0),px1=Math.min(W-1,pondCX+pondRX+2.5|0);
  const py0=Math.max(0,waterY-pondRY-2),py1=Math.min(H-1,bowlFloor+pondRY);
  for(let y=py0;y<=py1;y++)for(let x=px0;x<=px1;x++){
    const el=pondEl(x,y),dist=Math.sqrt(el);
    if(dist>1.12)continue;
    if(dist>0.84&&dist<1.10){
      putCell(x,y,Math.random()<0.42?MOSS:STONE,Math.random()*6|0);
    }else if(y>=waterY&&dist<0.88){
      putCell(x,y,WATER);
    }else if(y>=surf[x]&&dist<0.95){
      putCell(x,y,DIRT,Math.random()*5|0);
    }
  }

  // ── packed-dirt foot path: a bare-earth trail worn across the meadow from
  // the cottage clearing toward the pond, giving the eye a route to follow.
  // tufts & seeds steer clear of it; sprites stamp over it.
  const pathX0=(W*0.18)|0,pathX1=(W*0.56)|0;
  for(let x=pathX0;x<pathX1;x++){
    if(x<1||x>=W-1)continue;
    const sy=surf[x];
    if(Math.sqrt(pondEl(x,sy))<1.15)continue;        // never pave the pond banks
    putCell(x,sy,DIRT,Math.random()*5|0);
    if(sy+1<H)putCell(x,sy+1,DIRT,Math.random()*5|0);
    if(Math.random()<0.05)putCell(x,sy,STONE,Math.random()*4|0); // a worn pebble
  }

  // pass 3 — sparse grass tufts. The authored sprites carry the visual rhythm
  // now, so we keep the meadow surface mostly clean and only occasionally
  // poke a single-cell blade above the turf.
  for(let x=0;x<W;x++){
    const sy=surf[x];
    if(sy<=2)continue;
    const pd=Math.sqrt(pondEl(x,sy));
    if(pd<0.92)continue;
    if(grid[idx(x,sy)]!==GRASS)continue;   // leave the bare-earth path clear
    if(Math.random()<0.06){
      const h=1+(Math.random()*2|0);
      for(let i=1;i<=h;i++){
        const ty=sy-i;
        if(ty>=0&&grid[idx(x,ty)]===EMPTY)putCell(x,ty,PLANT);
      }
    }
  }

  // cattails & reeds around the pond rim
  for(let x=px0;x<=px1;x++){
    if(Math.random()>0.28)continue;
    const sy=surf[Math.max(0,Math.min(W-1,x))];
    const d=Math.sqrt(pondEl(x,sy));
    if(d<0.78||d>1.18||sy<3)continue;
    const h=3+(Math.random()*6|0);
    for(let i=1;i<=h;i++){
      const ty=sy-i;
      if(ty>=0&&grid[idx(x,ty)]===EMPTY)putCell(x,ty,PLANT);
    }
  }

  // lily pads drifting on the surface
  for(let i=0;i<14;i++){
    const lx=pondCX+((Math.random()*2-1)*pondRX*0.62|0);
    const ly=waterY+(Math.random()*2-1|0);
    if(Math.sqrt(pondEl(lx,ly))<0.72)putCell(lx,ly,MOSS,Math.random()*8|0);
  }

  // seeds waiting to sprout when physics runs
  for(let x=0;x<W;x+=2){
    if(Math.random()>0.10)continue;
    const sy=surf[x],ty=sy-1;
    if(ty<0||Math.sqrt(pondEl(x,sy))<0.95)continue;
    if(grid[idx(x,sy)]!==GRASS)continue;   // not on the bare path
    if(grid[idx(x,ty)]===EMPTY)putCell(x,ty,SEED);
  }

  // mossy stones peeking through the turf on slopes
  for(let x=1;x<W-1;x++){
    const slope=Math.abs(surf[x]-surf[x-1])+Math.abs(surf[x+1]-surf[x]);
    if(slope<2||Math.random()>0.07)continue;
    const sy=surf[x];
    if(Math.sqrt(pondEl(x,sy))<1.05)continue;
    if(grid[idx(x,sy)]===GRASS){grid[idx(x,sy)]=MOSS;variant[idx(x,sy)]=Math.random()*8|0;}
  }

  // ─── authored pixel-art sprites composed across the meadow ───
  // Anchor each sprite so its bottom row rests one cell above the local
  // grass. The scene reads left-to-right: cottage village on the left,
  // a fence path leading to a focal oak on the rise, the pond on the
  // right with its well, and a pine grove on the far right edge.
  function place(name,cx,opts){
    opts=opts||{};
    const w=spriteW(name),h=spriteH(name);
    if(!w||!h)return false;
    const gx=cx-(w>>1);
    if(gx<1||gx+w>=W-1)return false;
    // sample surface across the footprint
    let lowest=0,highest=H;
    for(let i=0;i<w;i++){
      const sx=Math.max(0,Math.min(W-1,gx+i));
      if(surf[sx]>lowest)lowest=surf[sx];
      if(surf[sx]<highest)highest=surf[sx];
      // refuse to plant inside the pond or its mossy rim
      if(!opts.allowPond&&Math.sqrt(pondEl(sx,surf[sx]))<1.18)return false;
    }
    // sit on the lowest local surface point so the trunk plants in dirt
    // rather than floating above a dip
    const gyBottom=lowest-1+(opts.sinkY||0);
    // clear grass directly under the footprint so the sprite reads
    // as deliberately placed, not collaged
    for(let i=0;i<w;i++){
      const sx=Math.max(0,Math.min(W-1,gx+i));
      const sy=surf[sx];
      if(sy>=0&&sy<H&&grid[idx(sx,sy)]===PLANT)grid[idx(sx,sy)]=GRASS;
    }
    stampSprite(name,gx,gyBottom);
    return true;
  }

  // ── focal: a single big oak on the rise, set off-center to anchor the view
  place('oak',(W*0.42)|0);

  // ── solarpunk homestead on the left: turbine on the horizon, cottage with
  // its living roof, greenhouse in the garden, an arch framing the foot path
  place('cottage',(W*0.15)|0);
  place('turbine',(W*0.045)|0);
  place('signpost',(W*0.09)|0);
  place('greenhouse',(W*0.25)|0);
  place('archway',(W*0.335)|0);
  place('solarpanel',(W*0.52)|0);

  // ── pine grove sweeping along the far-right horizon, past the pond.
  place('pine',(W*0.87)|0);
  place('pine',(W*0.96)|0);
  place('smallpine',(W*0.82)|0);
  place('smallpine',(W*0.92)|0);

  // ── boulders, mushrooms, bushes tucked between the anchors
  for(const f of [0.46,0.565]){ place('rock',(W*f)|0); }
  place('cattail',(W*0.61)|0,{allowPond:true});
  place('cattail',(W*0.81)|0,{allowPond:true});
  for(const f of [0.375,0.475]){ place('mushroom',(W*f)|0); }
  for(const f of [0.205,0.575]){ place('bush',(W*f)|0); }
  // pollinator strip: flowers thick near the greenhouse, looser across the meadow
  const flowerCount=6;
  for(let i=0;i<flowerCount;i++){
    const fx=((W*0.06)+(i/(flowerCount-1))*(W*0.48)+(Math.random()*W*0.03-W*0.015))|0;
    place('flower',fx);
  }
}

/* ═══════════════════════════════════════════════════════
   PORTFOLIO LAYOUT — everything below is particles
═══════════════════════════════════════════════════════ */
function spawnContent(){
  grid.fill(0);variant.fill(0);frozen.fill(0);
  birds.length=0;
  cats.length=0;

  // ─── meadow & pond landscape ───
  spawnNaturalLandscape();

  // a small black cat patrolling the village (signpost → fence)
  {
    const homeMin=Math.max(2,(W*0.05)|0);
    const homeMax=Math.min(W-3,(W*0.30)|0);
    const cx=(W*0.16)|0;
    spawnCat(cx,catGround(cx)-1,{homeMin,homeMax});
  }

  // projects are now DOM content — no rigid-body region
  WORK_REGION=null;

  // stamp invisible MASK cells under the HTML content so particles collide with it
  stampDOMMasks();

  // wake the whole world for the first sim pass + full first render
  wakeRect(0,0,W-1,H-1);
  pixDirtyRect(0,0,W-1,H-1);
}

// Walk every element with data-collide and stamp it into the sim grid as MASK.
//   data-collide="text"  → per-glyph raster (sand falls into letter cavities)
//   data-collide  (any)  → bounding-box rectangle (for cards with backgrounds)
function stampDOMMasks(){
  const cr=canvas.getBoundingClientRect();
  document.querySelectorAll('[data-collide]').forEach(el=>{
    if(el.getAttribute('data-collide')==='text') stampGlyphMask(el,cr);
    else stampRectMask(el,cr);
  });
}
function stampRectMask(el,cr){
  const r=el.getBoundingClientRect();
  const x0=Math.max(0,Math.floor((r.left-cr.left)/SCALE));
  const y0=Math.max(0,Math.floor((r.top-cr.top)/SCALE));
  const x1=Math.min(W-1,Math.ceil((r.right-cr.left)/SCALE));
  const y1=Math.min(H-1,Math.ceil((r.bottom-cr.top)/SCALE));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=idx(x,y);
    if(grid[i]===EMPTY){grid[i]=MASK;variant[i]=0;}
  }
}
// Rasterize an element's text into an offscreen canvas matching the live
// computed style, then stamp dark pixels as MASK — so sand piles inside the
// curves of letters instead of just on the bounding rectangle.
function stampGlyphMask(el,cr){
  const r=el.getBoundingClientRect();
  if(r.width<=0||r.height<=0)return;
  const cs=getComputedStyle(el);
  const cw=Math.ceil(r.width),ch=Math.ceil(r.height);
  const can=document.createElement('canvas');can.width=cw;can.height=ch;
  const oc=can.getContext('2d');
  oc.fillStyle='#fff';oc.fillRect(0,0,cw,ch);
  oc.fillStyle='#000';
  const fs=parseFloat(cs.fontSize);
  oc.font=`${cs.fontStyle} ${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
  oc.textBaseline='top';
  const lh=cs.lineHeight==='normal'?fs*1.2:parseFloat(cs.lineHeight);
  let lines=el.innerHTML.split(/<br\s*\/?>/i).map(s=>{
    const tmp=document.createElement('div');tmp.innerHTML=s;return (tmp.textContent||'').trim();
  });
  if(cs.textTransform==='uppercase')lines=lines.map(l=>l.toUpperCase());
  let y=(lh-fs)*0.5;
  for(const line of lines){oc.fillText(line,0,y);y+=lh;}
  const data=oc.getImageData(0,0,cw,ch).data;
  const x0=Math.floor((r.left-cr.left)/SCALE);
  const y0=Math.floor((r.top-cr.top)/SCALE);
  const sxN=Math.ceil(cw/SCALE),syN=Math.ceil(ch/SCALE);
  for(let sy=0;sy<syN;sy++)for(let sx=0;sx<sxN;sx++){
    const px=Math.min(cw-1,(sx*SCALE+(SCALE>>1)));
    const py=Math.min(ch-1,(sy*SCALE+(SCALE>>1)));
    if(data[(py*cw+px)*4]<140){
      const gx=x0+sx,gy=y0+sy;
      if(gx>=0&&gx<W&&gy>=0&&gy<H){
        const i=idx(gx,gy);
        if(grid[i]===EMPTY){grid[i]=MASK;variant[i]=0;}
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════
   FLOATING-WINDOW COLLISION MASKS
   Each .win-app rectangle is stamped as MASK cells so sand piles
   on its title bar, water pools on its top edge, etc. Re-stamped
   only when a window moves/opens/closes/resizes.
═══════════════════════════════════════════════════════ */
let _winMaskCells=[];
let _winMaskHash='';
function _winsHash(){
  let s='';
  document.querySelectorAll('.win-app').forEach(el=>{
    if(el.style.display==='none'||el.dataset.minimized==='1')return;
    const r=el.getBoundingClientRect();
    s+=(r.left|0)+','+(r.top|0)+','+(r.width|0)+','+(r.height|0)+';';
  });
  return s+W+'x'+H;
}
function updateWindowMasks(){
  const h=_winsHash();
  if(h===_winMaskHash)return;
  _winMaskHash=h;
  for(const i of _winMaskCells){
    if(grid[i]===MASK){
      grid[i]=EMPTY;variant[i]=0;
      const x=i%W,y=(i/W)|0;
      pixDirty(x,y);wake3(x,y);
    }
  }
  _winMaskCells.length=0;
  const cr=canvas.getBoundingClientRect();
  document.querySelectorAll('.win-app').forEach(el=>{
    if(el.style.display==='none'||el.dataset.minimized==='1')return;
    const r=el.getBoundingClientRect();
    const x0=Math.max(0,Math.floor((r.left-cr.left)/SCALE));
    const y0=Math.max(0,Math.floor((r.top-cr.top)/SCALE));
    const x1=Math.min(W-1,Math.ceil((r.right-cr.left)/SCALE));
    const y1=Math.min(H-1,Math.ceil((r.bottom-cr.top)/SCALE));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const i=idx(x,y);
      if(grid[i]===EMPTY){
        grid[i]=MASK;variant[i]=0;
        _winMaskCells.push(i);
        pixDirty(x,y);wake3(x,y);
      }
    }
  });
}

/* ═══════════════════════════════════════════════════════
   HOVER FREEZE
═══════════════════════════════════════════════════════ */
let mouseSimX=0,mouseSimY=0,hoverEnabled=false,hoverCells=[];
const HOVER_R=20;
const freezeRing=document.getElementById('freezeRing');

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouseSimX=Math.floor((e.clientX-r.left)/SCALE);
  mouseSimY=Math.floor((e.clientY-r.top)/SCALE);
  freezeRing.style.left=e.clientX+'px';freezeRing.style.top=e.clientY+'px';
  freezeRing.style.opacity=hoverEnabled&&physicsOn?'1':'0';
  brushRing.style.left=e.clientX+'px';brushRing.style.top=e.clientY+'px';
  brushRing.style.opacity='1';
});
canvas.addEventListener('mouseleave',()=>{
  freezeRing.style.opacity='0';
  brushRing.style.opacity='0';
  releaseHover();
});
function releaseHover(){
  if(!hoverCells.length)return;
  let x0=BIG,y0=BIG,x1=-1,y1=-1;
  for(const i of hoverCells){frozen[i]=0;const x=i%W,y=(i/W)|0;if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}
  wakeRect(x0,y0,x1,y1);
  hoverCells=[];
}
function applyHoverFreeze(){
  releaseHover();
  if(!hoverEnabled||!physicsOn)return;
  for(let dy=-HOVER_R;dy<=HOVER_R;dy++)for(let dx=-HOVER_R;dx<=HOVER_R;dx++){
    if(dx*dx+dy*dy>HOVER_R*HOVER_R)continue;
    const x=mouseSimX+dx,y=mouseSimY+dy;
    if(x<0||x>=W||y<0||y>=H)continue;
    const i=idx(x,y);
    if(!frozen[i]){frozen[i]=1;hoverCells.push(i);}
  }
}

/* ═══════════════════════════════════════════════════════
   PAINTING
═══════════════════════════════════════════════════════ */
let painting=false,curMat=1;
function simXY(e){
  const r=canvas.getBoundingClientRect();
  return[Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)/SCALE))),
         Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)/SCALE)))];
}
/* ═══ STRUCTURAL MATERIAL VARIANTS ═══
   Variants are baked from the cell's BIRTH position and travel with the
   particle (movement already copies variant). Intact walls read as coursed
   masonry / planked timber; debris keeps its identity when it crumbles —
   mortar crumbs stay pale, brick chips stay terracotta.
   Encoding: bit5 (0x20) = "structured" flag → fillTexel decodes
   role (bits 0-1) + per-unit tint (bits 2-4). Unflagged variants keep the
   legacy random-jitter / hand-shaded sprite path. */
function hash2i(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0);}
function brickVariant(x,y){
  // courses 4px tall: 3 rows of face + 1 mortar bed; head joints every 7px,
  // staggered half a brick per course
  const course=Math.floor(y/4), inRow=y-course*4;
  const off=(course&1)?3:0;
  const inCol=(x+off)%7;
  let role;
  if(inRow===3||inCol===6) role=3;                 // mortar bed / head joint
  else if(inRow===0&&inCol<6) role=2;              // lit top edge of the brick
  else if(inRow===2||inCol===5) role=1;            // shadowed bottom/right
  else role=0;                                     // brick face
  const bid=hash2i(Math.floor((x+off)/7),course);  // per-BRICK tint, not per-cell
  return 0x20|role|((bid&7)<<2);
}
function woodVariant(x,y){
  // planking: 5x9 segments — vertical seam on the right, butt joint on the
  // bottom row, grain streaks hashed per segment
  const plank=Math.floor(x/5), inP=x-plank*5;
  const seg=Math.floor(y/9), inS=y-seg*9;
  let role;
  if(inP===4||inS===8) role=3;                     // seam / butt joint
  else if(((hash2i(x,y>>2)&15)===0)) role=1;       // occasional grain fleck
  else if(inP===0||inS===0) role=2;                // lit left/top edge
  else role=0;
  const pid=hash2i(plank,seg*7+7);
  return 0x20|role|((pid&7)<<2);
}
function bakeVariant(m,x,y){
  if(m===BRICK)return brickVariant(x,y);
  if(m===WOOD)return woodVariant(x,y);
  return Math.random()*8|0;
}

/* ═══ UNIT-SNAPPED MASONRY PAINTING ═══
   Painting BRICK/WOOD lays complete units — whole bricks (7x4 tiles: 6x3
   face + head joint + mortar bed) and whole plank segments (5x9). Only
   units that fit entirely inside the brush stamp; a brush smaller than one
   unit lays the single unit under the cursor, so small brushes become a
   brick-by-brick trowel. Stamps are position-deterministic → overlapping
   drag strokes are idempotent and courses always align. */
function unitGeom(m){return m===BRICK?{tw:7,th:4,offFn:c=>(c&1)?3:0}:{tw:5,th:9,offFn:()=>0};}
function stampUnit(m,ux0,uy0,tw,th){
  if(ux0<0||uy0<0||ux0+tw>W||uy0+th>H)return;      // clipped units don't spawn
  for(let y=uy0;y<uy0+th;y++)for(let x=ux0;x<ux0+tw;x++){
    const pi=idx(x,y);
    grid[pi]=m;variant[pi]=bakeVariant(m,x,y);frozen[pi]=1;inChunk[pi]=0;
    wake3(x,y);pixDirty(x,y);
  }
}
function paintUnits(cx,cy,b,m){
  const {tw,th,offFn}=unitGeom(m);
  let laid=false;
  const c0=Math.floor((cy-b)/th),c1=Math.floor((cy+b)/th);
  for(let c=c0;c<=c1;c++){
    const off=offFn(c), y0=c*th;
    const t0=Math.floor((cx-b+off)/tw),t1=Math.floor((cx+b+off)/tw);
    for(let t=t0;t<=t1;t++){
      const x0=t*tw-off;
      // whole unit must sit inside the brush circle (corner test on the tile)
      const dx=Math.max(Math.abs(x0-cx),Math.abs(x0+tw-1-cx));
      const dy=Math.max(Math.abs(y0-cy),Math.abs(y0+th-1-cy));
      if(dx*dx+dy*dy<=b*b){stampUnit(m,x0,y0,tw,th);laid=true;}
    }
  }
  if(!laid){ // brush smaller than a unit: lay the one under the cursor
    const c=Math.floor(cy/th), off=offFn(c);
    stampUnit(m,Math.floor((cx+off)/tw)*tw-off,c*th,tw,th);
  }
}

function paint(cx,cy,pm){
  const m=(pm===undefined)?curMat:pm;
  const b=+document.getElementById('brushSlider').value;
  if(m===BIRD){
    // throttle: don't carpet-bomb on every mousemove event
    const want=Math.max(1,Math.floor(b*0.4));
    for(let k=0;k<want;k++){
      if(Math.random()>0.45)continue;
      const a=Math.random()*Math.PI*2,r=Math.random()*b;
      spawnBird(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    }
    return;
  }
  if(m===BRICK||m===WOOD){paintUnits(cx,cy,b,m);return;}
  // structural / drawable-static materials paint densely AND pin themselves
  // (FUSE/BOMB stay unfrozen so their step runs).
  const pinned=(m===FUSE||m===BOMB);
  const solid=isStatic(m)||m===EMPTY||pinned;
  for(let dy=-b;dy<=b;dy++)for(let dx=-b;dx<=b;dx++){
    if(dx*dx+dy*dy>b*b)continue;
    if(!solid&&Math.random()>.78)continue;
    const nx=cx+dx,ny=cy+dy;
    if(nx>=0&&nx<W&&ny>=0&&ny<H){
      const pi=idx(nx,ny);
      grid[pi]=m;variant[pi]=bakeVariant(m,nx,ny);
      frozen[pi]=(m===WOOD||m===BRICK)?1:0;
      wake3(nx,ny);pixDirty(nx,ny);
    }
  }
}
/* ═══ STROKE INTERPOLATION ═══
   mousemove samples arrive far apart during fast drags; stamping only at the
   sample points leaves a dotted trail. Walk the segment from the previous
   sample, stamping every half-brush-width, so strokes are continuous. The
   stroke's material is latched at press time — right button latches ERASE. */
let strokeMat=SAND,lastPX=-1,lastPY=-1;
function paintStroke(x,y){
  if(lastPX<0){paint(x,y,strokeMat);lastPX=x;lastPY=y;return;}
  const dx=x-lastPX,dy=y-lastPY;
  const dist=Math.max(Math.abs(dx),Math.abs(dy));
  const b=+document.getElementById('brushSlider').value;
  const stepLen=Math.max(1,b>>1);
  if(dist<=stepLen)paint(x,y,strokeMat);
  else{
    const nSeg=Math.ceil(dist/stepLen);
    for(let k=1;k<=nSeg;k++)paint(Math.round(lastPX+dx*k/nSeg),Math.round(lastPY+dy*k/nSeg),strokeMat);
  }
  lastPX=x;lastPY=y;
}
let dragBody=null,dragOffX=0,dragOffY=0;
function grabAt(sx,sy){
  for(let k=bodies.length-1;k>=0;k--){
    if(pointInBody(bodies[k],sx,sy)){
      dragBody=bodies[k];dragBody.dragging=true;dragBody.sleeping=false;
      dragOffX=dragBody.x-sx;dragOffY=dragBody.y-sy;return true;
    }
  }
  return false;
}
function dragTo(sx,sy){
  const nx=sx+dragOffX,ny=sy+dragOffY;
  dragBody.vx=nx-dragBody.x;dragBody.vy=ny-dragBody.y;clampVel(dragBody);
  dragBody.x=nx;dragBody.y=ny;
}
function release(){if(dragBody){dragBody.dragging=false;dragBody=null;}painting=false;lastPX=-1;lastPY=-1;}

canvas.addEventListener('mousedown',e=>{
  const p=simXY(e);
  if(e.button===0&&grabAt(...p))return;
  painting=true;
  strokeMat=(e.button===2)?EMPTY:curMat; // right button = quick erase
  lastPX=-1;lastPY=-1;
  paintStroke(...p);
});
canvas.addEventListener('mousemove',e=>{const p=simXY(e);if(dragBody){dragTo(...p);return;}if(painting)paintStroke(...p);});
canvas.addEventListener('mouseup',release);
canvas.addEventListener('mouseleave',release);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchstart',e=>{e.preventDefault();const p=simXY(e.touches[0]);if(grabAt(...p))return;painting=true;strokeMat=curMat;lastPX=-1;lastPY=-1;paintStroke(...p);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const p=simXY(e.touches[0]);if(dragBody){dragTo(...p);return;}if(painting)paintStroke(...p);},{passive:false});
canvas.addEventListener('touchend',release);
canvas.addEventListener('touchcancel',release);

/* ═══ BRUSH RING + WHEEL RESIZE ═══
   A cursor-following circle shows the true brush footprint (the HUD slider
   is hidden by default), and the wheel resizes the brush in place. */
const brushRing=document.getElementById('brushRing');
const brushSliderEl=document.getElementById('brushSlider');
function syncBrushRing(){
  const d=(+brushSliderEl.value*2+1)*SCALE;
  brushRing.style.width=d+'px';brushRing.style.height=d+'px';
}
syncBrushRing();
brushSliderEl.addEventListener('input',syncBrushRing);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const v=+brushSliderEl.value+(e.deltaY<0?1:-1);
  brushSliderEl.value=Math.max(+brushSliderEl.min,Math.min(+brushSliderEl.max,v));
  syncBrushRing();
},{passive:false});

/* ═══════════════════════════════════════════════════════
   MATERIAL PICKER + KEYS
═══════════════════════════════════════════════════════ */
function selectMat(m){
  curMat=m;
  document.querySelectorAll('.mat-opt').forEach(o=>o.classList.remove('active'));
  const t=document.querySelector(`.mat-opt[data-mat="${m}"]`);if(t)t.classList.add('active');
}
document.querySelectorAll('.mat-opt').forEach(el=>el.addEventListener('click',()=>selectMat(+el.dataset.mat)));
document.addEventListener('keydown',e=>{
  const k={'1':SAND,'2':WATER,'3':FIRE,'4':STONE,'5':PLANT,'6':ACID,'7':OIL,
           '8':POLLEN,'9':MOSS,'g':SEED,'0':EMPTY,
           'w':WOOD,'l':LEAF,'b':BRICK,'t':THATCH,'r':BERRY,'i':BIRD,
           'f':FUSE,'x':BOMB};
  if(k[e.key]!==undefined)selectMat(k[e.key]);
  if(e.key===' '){e.preventDefault();togglePhysics();}
});

/* ═══════════════════════════════════════════════════════
   HUD
═══════════════════════════════════════════════════════ */
let physicsOn=false;
const btnP=document.getElementById('btnPhysics');
function togglePhysics(){
  physicsOn=!physicsOn;
  btnP.textContent=physicsOn?'⏸ physics':'▶ physics';
  btnP.classList.toggle('on',physicsOn);
  if(!physicsOn)releaseHover();
}
btnP.addEventListener('click',togglePhysics);
document.getElementById('btnReset').addEventListener('click',()=>{spawnContent();buildBodies();});
document.getElementById('speedSlider').addEventListener('input',e=>simSpeed=+e.target.value);
document.getElementById('btnFreeze').addEventListener('click',()=>{
  hoverEnabled=!hoverEnabled;
  document.getElementById('btnFreeze').classList.toggle('on',hoverEnabled);
  freezeRing.style.opacity='0';
  if(!hoverEnabled)releaseHover();
});
let raining=false;
document.getElementById('btnRain').addEventListener('click',()=>{
  raining=!raining;document.getElementById('btnRain').classList.toggle('on',raining);
});
function doRain(){
  if(!raining)return;
  for(let i=0;i<6;i++){
    const x=Math.floor(Math.random()*W);
    if(grid[idx(x,0)]===EMPTY){grid[idx(x,0)]=SAND;variant[idx(x,0)]=Math.random()*8|0;wake3(x,0);pixDirty(x,0);}
  }
}
// ambient drift: a few motes of pollen rising from the ground, always on,
// so the place feels alive even before anyone touches it
function doAmbient(){
  if(Math.random()<0.45){
    const x=Math.floor(Math.random()*W);
    for(let d=0;d<8;d++){
      const y=H-4-d;
      if(y<0)break;
      const m=grid[idx(x,y)];
      if(m===GRASS||m===PLANT||m===MOSS||m===DIRT){
        const ty=y-1;
        if(ty>=0&&grid[idx(x,ty)]===EMPTY){grid[idx(x,ty)]=POLLEN;variant[idx(x,ty)]=Math.random()*8|0;wake3(x,ty);pixDirty(x,ty);break;}
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════
   BIRDS — boids flocking (separation / alignment / cohesion).
   Birds aren't grid cells: they're free-flying agents drawn
   on a 2D overlay canvas above the sim, so they don't fight
   the cellular automaton's dirty-rect/upload pipeline.
═══════════════════════════════════════════════════════ */
const birds=[];
const BIRD_MAX=350;
const birdCanvas=document.getElementById('birdCanvas');
const bctx=birdCanvas.getContext('2d');

function spawnBird(x,y){
  if(birds.length>=BIRD_MAX)return;
  const a=Math.random()*Math.PI*2;
  birds.push({x,y,vx:Math.cos(a)*0.9,vy:Math.sin(a)*0.9,flap:Math.random()*100|0});
}

// terrain birds avoid colliding with — any solid stamp counts
function isSolidForBird(x,y){
  if(x<0||x>=W||y<0||y>=H)return true; // walls
  const m=grid[idx(x,y)];
  return m===STONE||m===DIRT||m===GRASS||m===WOOD||m===BRICK||m===THATCH||
         m===LEAF||m===BERRY||m===GLASS||m===MASK||m===RIGID||m===FUSE||m===BOMB;
}

// spatial hash for neighbour queries: bin birds into perception-radius cells
// (linked lists over two Int32Arrays) so flocking is O(n·k), not O(n²) —
// 350 birds went from ~122k pair tests per step to a few hundred
const BOID_CELL=18;
let boidHead=null,boidNext=null,boidGW=0,boidGH=0;
function updateBoids(){
  const n=birds.length;
  if(!n)return;
  const perc=18,perc2=perc*perc,sepR=5,sep2=sepR*sepR;
  const maxSpeed=1.15,maxForce=0.045;
  const gw=((W/BOID_CELL)|0)+1,gh=((H/BOID_CELL)|0)+1;
  if(!boidHead||boidGW!==gw||boidGH!==gh){boidHead=new Int32Array(gw*gh);boidGW=gw;boidGH=gh;}
  if(!boidNext||boidNext.length<n)boidNext=new Int32Array(Math.max(n*2,64));
  boidHead.fill(-1);
  for(let i=0;i<n;i++){
    const b=birds[i];
    let cx=(b.x/BOID_CELL)|0,cy=(b.y/BOID_CELL)|0;
    if(cx<0)cx=0;else if(cx>=gw)cx=gw-1;
    if(cy<0)cy=0;else if(cy>=gh)cy=gh-1;
    const c=cy*gw+cx;
    boidNext[i]=boidHead[c];boidHead[c]=i;
  }
  for(let i=0;i<n;i++){
    const b=birds[i];
    let alX=0,alY=0,coX=0,coY=0,sepX=0,sepY=0,nA=0,nS=0;
    const cx0=Math.max(0,((b.x-perc)/BOID_CELL)|0),cx1=Math.min(gw-1,((b.x+perc)/BOID_CELL)|0);
    const cy0=Math.max(0,((b.y-perc)/BOID_CELL)|0),cy1=Math.min(gh-1,((b.y+perc)/BOID_CELL)|0);
    for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){
      for(let j=boidHead[cy*gw+cx];j!==-1;j=boidNext[j]){
        if(j===i)continue;
        const o=birds[j];
        const dx=o.x-b.x,dy=o.y-b.y,d2=dx*dx+dy*dy;
        if(d2<perc2){
          alX+=o.vx;alY+=o.vy;
          coX+=o.x;coY+=o.y;
          nA++;
          if(d2<sep2&&d2>0.01){
            const d=Math.sqrt(d2);
            sepX-=dx/d;sepY-=dy/d;nS++;
          }
        }
      }
    }
    let ax=0,ay=0;
    if(nA>0){
      alX/=nA;alY/=nA;
      let m=Math.hypot(alX,alY);
      if(m>0){alX=alX/m*maxSpeed-b.vx;alY=alY/m*maxSpeed-b.vy;}
      coX=coX/nA-b.x;coY=coY/nA-b.y;
      let cm=Math.hypot(coX,coY);
      if(cm>0){coX=coX/cm*maxSpeed-b.vx;coY=coY/cm*maxSpeed-b.vy;}
      ax+=alX*0.9+coX*0.55;
      ay+=alY*0.9+coY*0.55;
    }
    if(nS>0){
      let m=Math.hypot(sepX,sepY);
      if(m>0){sepX=sepX/m*maxSpeed-b.vx;sepY=sepY/m*maxSpeed-b.vy;}
      ax+=sepX*1.7;ay+=sepY*1.7;
    }
    // terrain avoidance: look ahead, pull away from solid + bias upward
    const lookX=(b.x+b.vx*8)|0,lookY=(b.y+b.vy*8)|0;
    if(isSolidForBird(lookX,lookY)){
      ax-=b.vx*0.4;ay-=b.vy*0.4;ay-=0.35;
    }
    // also avoid fire below
    if(grid[idx(Math.max(0,Math.min(W-1,b.x|0)),Math.max(0,Math.min(H-1,(b.y+3)|0)))]===FIRE){
      ay-=0.6;
    }
    // soft bounds — keep birds in the upper two-thirds and away from walls
    if(b.x<8)ax+=0.12;
    if(b.x>W-8)ax-=0.12;
    if(b.y<6)ay+=0.12;
    const floorPref=H*0.72;
    if(b.y>floorPref)ay-=0.10;
    if(b.y>H-8)ay-=0.4;
    // clamp + integrate
    const fm=Math.hypot(ax,ay);
    if(fm>maxForce){ax=ax/fm*maxForce;ay=ay/fm*maxForce;}
    b.vx+=ax;b.vy+=ay;
    const sm=Math.hypot(b.vx,b.vy);
    if(sm>maxSpeed){b.vx=b.vx/sm*maxSpeed;b.vy=b.vy/sm*maxSpeed;}
    if(sm<0.25){b.vx*=1.4;b.vy*=1.4;} // don't stall
    b.x+=b.vx;b.y+=b.vy;
    b.flap++;
    // hard bounds
    if(b.x<1){b.x=1;b.vx=Math.abs(b.vx);}
    if(b.x>W-2){b.x=W-2;b.vx=-Math.abs(b.vx);}
    if(b.y<1){b.y=1;b.vy=Math.abs(b.vy);}
    if(b.y>H-2){b.y=H-2;b.vy=-Math.abs(b.vy);}
  }
}

function drawBirds(){
  if(birdCanvas.width!==W)return; // skip mid-resize
  bctx.clearRect(0,0,W,H);
  if(!birds.length)return;
  bctx.fillStyle='#1c1a22';
  for(const b of birds){
    const x=b.x|0,y=b.y|0;
    // pick a shape based on flight direction + flap phase
    const dirRight=b.vx>=0;
    const up=((b.flap>>2)&1)===0;
    // tiny chevron: ▴ (wings up) or ◜◝ (wings down). 1px scale.
    if(up){
      // wings raised: a peak
      bctx.fillRect(x,   y,   1,1);
      bctx.fillRect(x-1, y-1, 1,1);
      bctx.fillRect(x+1, y-1, 1,1);
      bctx.fillRect(x-2, y,   1,1);
      bctx.fillRect(x+2, y,   1,1);
    } else {
      // wings lowered: a flat M
      bctx.fillRect(x-2, y-1, 1,1);
      bctx.fillRect(x-1, y,   1,1);
      bctx.fillRect(x,   y-1, 1,1);
      bctx.fillRect(x+1, y,   1,1);
      bctx.fillRect(x+2, y-1, 1,1);
    }
    // direction tick — a single pixel ahead of the bird
    if(dirRight)bctx.fillRect(x+3,y,1,1); else bctx.fillRect(x-3,y,1,1);
  }
}

/* ═══════════════════════════════════════════════════════
   CATS — small ground-roaming critters. They walk on top of
   whatever terrain is currently there (sand/grass/dirt/sprite
   debris all count), spring up ledges, leap narrow liquid/fire
   hazards (turning back from wide ones), and pick wandering
   targets within a "home" range so they hang around the village.
   When boxed in they give up and sit; idle cats sometimes sit
   for a long stretch, and occasionally sprint in a burst of
   zoomies with playful hops.
═══════════════════════════════════════════════════════ */
const cats=[];
function isAvoidForCat(m){return m===WATER||m===OIL||m===ACID||m===FIRE||m===SMOKE;}
// MASK is invisible HTML-collision — cats shouldn't stand on the title letters
function isSupportForCat(m){return m!==EMPTY&&m!==MASK&&!isAvoidForCat(m);}
// surface y at column x: first cell from the top whose contents would
// support a paw. Returns H if there's no ground (column is all sky/liquid).
function catGround(x,fromY){
  if(x<0||x>=W)return H;
  // start a few cells above the cat's current head so material painted
  // up in the sky doesn't yank the cat upward; default to top for spawn
  const y0=Math.max(0,(fromY===undefined?0:(fromY|0)-3));
  for(let y=y0;y<H;y++){
    if(isSupportForCat(grid[idx(x,y)]))return y;
  }
  return H;
}
function spawnCat(x,y,opts){
  opts=opts||{};
  cats.push({
    x:x, y:y,
    vx:0, vy:0, dir:Math.random()<0.5?-1:1,
    homeMin:opts.homeMin!==undefined?opts.homeMin:Math.max(2,x-60),
    homeMax:opts.homeMax!==undefined?opts.homeMax:Math.min(W-3,x+60),
    target:x,
    state:'pause', stateT:30+Math.random()*60|0,
    step:0, // walk-cycle phase
    air:false, // mid-leap
    blocked:0, // consecutive turnarounds — give up and sit when boxed in
  });
}
function updateCats(){
  for(const c of cats){
    c.step++;
    if(c.stateT>0)c.stateT--;

    // ── airborne: ballistic hop; land on the first support while falling
    if(c.air){
      c.vy+=0.1;
      c.x+=c.vx; c.y+=c.vy;
      if(c.x<2)c.x=2;
      if(c.x>W-3)c.x=W-3;
      const g=catGround(c.x|0,c.y);
      if(c.vy>0&&(c.y>=g-1||c.y>H-2)){
        c.y=Math.min(g-1,H-1);
        c.air=false; c.vy=0;
      }
      continue;
    }

    // settle to the ground under our nose
    const gy=catGround(c.x|0,c.y);
    if(gy>=H){ // nothing to stand on, drift down till we find something
      c.y+=0.5;
      if(c.y>H-1){c.y=H-1;}
      continue;
    }
    // glue paws to the surface; small jumps are absorbed by stepping
    c.y+=(gy-1-c.y)*0.5;

    if(c.state==='pause'||c.state==='sit'){
      c.vx=0;
      if(c.stateT<=0){
        if(c.state==='pause'&&Math.random()<0.3){
          // settle in for a long sit
          c.state='sit'; c.stateT=300+Math.random()*600|0;
        }else{
          // pick a new target somewhere in home range
          const span=c.homeMax-c.homeMin;
          c.target=c.homeMin+(Math.random()*span)|0;
          c.dir=c.target>c.x?1:-1;
          const r=Math.random();
          c.state=r<0.12?'zoom':(r<0.55?'run':'walk'); // occasional zoomies
          c.stateT=120+Math.random()*240|0;
        }
      }
      continue;
    }

    // walk / trot / zoom toward target
    const speed=c.state==='zoom'?0.95:(c.state==='run'?0.55:0.28);
    c.vx=c.dir*speed;

    // obstacle check on the next column: hazard pit, cliff, or rising wall?
    const cx=c.x|0;
    const ahead=cx+c.dir;
    const aheadGround=catGround(ahead,c.y);
    let turn=false;

    if(ahead<2||ahead>W-3){
      turn=true;
    }else{
      const am=aheadGround<H?grid[idx(ahead,aheadGround)]:EMPTY;
      if(aheadGround>=H||isAvoidForCat(am)){
        // hazard underfoot ahead — look for safe footing to leap to
        let leapt=false;
        for(let j=3;j<=6;j++){
          const lx=cx+c.dir*j;
          if(lx<2||lx>W-3)break;
          const lg=catGround(lx,c.y);
          if(lg>=H)continue;
          if(isAvoidForCat(grid[idx(lx,lg)]))continue;
          if(lg<gy-4)continue; // landing is up a wall — can't clear it
          c.air=true; c.vy=-1.05; c.vx=c.dir*(j/21);
          leapt=true; break;
        }
        if(!leapt)turn=true;
      }else{
        const rise=gy-aheadGround; // positive = ground climbs ahead
        if(rise>2){
          if(rise<=7){
            // spring up the ledge
            c.air=true; c.vy=-Math.sqrt(0.2*(rise+2)); c.vx=c.dir*0.3;
          }else turn=true;
        }
      }
    }

    if(turn){
      c.blocked++;
      if(c.blocked>=3){
        // boxed in — stop fighting the terrain and settle down here
        c.state='sit'; c.stateT=240+Math.random()*360|0; c.blocked=0;
      }else{
        c.dir=-c.dir;
        c.target=c.dir>0?c.homeMax:c.homeMin;
        // small pause to look around
        c.state='pause'; c.stateT=15+Math.random()*30|0;
      }
      continue;
    }
    if(c.air)continue; // just launched into a hop

    c.x+=c.vx;
    // zoomies come with playful little hops
    if(c.state==='zoom'&&Math.random()<0.02){
      c.air=true; c.vy=-0.65;
    }
    // clamp to home range with a turnaround
    if(c.x<c.homeMin){c.x=c.homeMin;c.dir=1;}
    if(c.x>c.homeMax){c.x=c.homeMax;c.dir=-1;}

    // arrived?
    if(Math.abs(c.x-c.target)<1.5){
      c.state='pause';
      c.stateT=40+Math.random()*120|0;
      c.blocked=0; // made it somewhere — clearly not boxed in
    }
  }
}
function drawCats(){
  if(!cats.length)return;
  bctx.fillStyle='#0a0a0e';
  for(const c of cats){
    const x=c.x|0,y=c.y|0,d=c.dir;
    // origin (x,y) = shoulder cell; body extends behind
    // facing right: body is to the LEFT of head; tail further left
    // facing left:  body is to the RIGHT of head
    const px=(dx,dy)=>{const xx=x+dx*d,yy=y+dy;if(xx>=0&&xx<W&&yy>=0&&yy<H)bctx.fillRect(xx,yy,1,1);};

    if(c.air){
      // mid-leap: body stretched long, paws out fore and aft, tail swept back
      px(0,0); px(-1,0); px(-2,0); px(-3,0);
      px(-1,-1); px(-2,-1); px(-3,-1);
      px(0,-1); px(1,-1); px(2,-1);
      px(0,-2); px(1,-2); px(2,-2);
      px(0,-3); px(2,-3);
      px(-4,-1); px(-5,-2);
      px(1,0); px(-4,0);
      continue;
    }

    if(c.state==='sit'){
      // sitting: haunches down, chest up, tail wrapped down the back
      px(0,-3); px(2,-3);                      // ears
      px(0,-2); px(1,-2); px(2,-2);            // head
      px(-1,-1); px(0,-1); px(1,-1); px(2,-1); // head + sloping back
      px(-2,0); px(-1,0); px(0,0); px(1,0);    // body
      px(-2,1); px(-1,1); px(1,1);             // haunch + front paw
      px(-3,0); px(-3,1);                      // tail
      continue;
    }

    const moving=c.state!=='pause';
    // walk cycle: legs alternate every few frames; faster when running
    const phaseRate=c.state==='zoom'?2:(c.state==='run'?3:5);
    const ph=((c.step/phaseRate)|0)&1;
    // body (4 wide, 2 tall), raised head (3 wide, 2 tall) with pointy ears,
    // upright curved tail behind
    // body block
    px(0,0); px(-1,0); px(-2,0); px(-3,0);
    px(-1,-1); px(-2,-1); px(-3,-1);
    // head — 3 wide, raised above the body so the chin clears the ground
    px(0,-1); px(1,-1); px(2,-1);
    px(0,-2); px(1,-2); px(2,-2);
    // ears — two pointy tufts with a notch between them
    px(0,-3); px(2,-3);
    // tail — question-mark curve rising off the rump
    px(-4,-1); px(-5,-2); px(-5,-3);
    if(moving){
      // wag: tip flicks with the step phase
      px(ph?-4:-6,-4);
    } else {
      px(-5,-4);
    }
    // legs — alternate pairs; when paused just front + back so it reads as standing
    if(moving){
      if(ph){
        px(0,1); px(-3,1); // front-right + back-left forward
      } else {
        px(-1,1); px(-2,1);
      }
    } else {
      px(0,1); px(-3,1);
    }
  }
}

/* ═══════════════════════════════════════════════════════
   STATS
═══════════════════════════════════════════════════════ */
const statsEl=document.getElementById('stats');
let frameCount=0,lastStatTime=0,fps=0;
function updateStats(ts){
  frameCount++;
  if(ts-lastStatTime>800){
    fps=Math.round(frameCount*1000/(ts-lastStatTime));
    frameCount=0;lastStatTime=ts;
    let awake=0;for(let i=0;i<dcMinX.length;i++)if(dcMaxX[i]>=dcMinX[i])awake++;
    statsEl.textContent=`${fps} fps · ${awake}/${ncx*ncy} chunks awake · ${W}×${H}`;
  }
}

/* ═══════════════════════════════════════════════════════
   RESIZE
═══════════════════════════════════════════════════════ */
let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    computeDims();allocArrays();allocChunks();allocTexture();allocLight();
    spawnContent();buildBodies();syncBrushRing();
  },200);
});

/* ═══════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════ */
// wait one frame so the DOM resume has been laid out before we measure & stamp
requestAnimationFrame(()=>{
  spawnContent();
  buildBodies();
  physicsOn=true;btnP.textContent='⏸ physics';btnP.classList.add('on');
});

let lastSim=0,simAcc=0,frameNo=0;
function loop(ts){
  gTime=ts*0.001; // sky clock keeps clouds & sun drifting even when paused
  dayPhase+=(2*Math.PI/DAY_PERIOD)*Math.min(0.1,(ts-lastSim)*0.001);
  if(dayWarp>0){const step=Math.min(dayWarp,0.09);dayPhase+=step;dayWarp-=step;}
  if((frameNo++&1)===0)buildLight();
  if(physicsOn){
    // DOM reads (querySelectorAll + getBoundingClientRect per window) are the
    // costly part here — a 4-frame cadence is invisible at sand speed
    if((frameNo&3)===0)updateWindowMasks();
    updateBodies();
    restampBodies();
    simAcc+=ts-lastSim;
    const stepMs=14/simSpeed;
    let n=0;
    while(simAcc>=stepMs&&n<4){doRain();doAmbient();simulate();updateChunks();updateBoids();updateCats();simAcc-=stepMs;n++;}
    if(simAcc>stepMs*4)simAcc=0;
    // keep pouring while the button is held even if the cursor isn't moving
    if(painting&&!dragBody&&lastPX>=0)paint(lastPX,lastPY,strokeMat);
    applyHoverFreeze();
  }
  lastSim=ts;
  renderAll();
  drawBirds();
  drawCats();
  updateStats(ts);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ═══════════════════════════════════════════════════════
   WINDOW MINIMIZE / TASKBAR
═══════════════════════════════════════════════════════ */
(function(){
  const tasksEl = document.getElementById('taskbarTasks');
  const clockEl = document.getElementById('taskbarClock');
  clockEl.style.cursor='pointer';
  clockEl.title='click: fast-forward to night/day';
  clockEl.addEventListener('click',()=>{dayWarp+=Math.PI;});
  const tasks = new Map(); // window el -> taskbar btn

  function titleOf(win){
    if(win.classList.contains('r-block')){
      const h3 = win.querySelector('h3');
      if(h3){
        // h3's first text node is the section title (e.g. "EXPERIENCE")
        for(const n of h3.childNodes){
          if(n.nodeType===3 && n.textContent.trim()) return n.textContent.trim();
        }
      }
      return 'Window';
    }
    const t = win.querySelector('.win95-title > span');
    return t ? t.textContent : 'Window';
  }

  function minimize(win){
    if(win.dataset.minimized==='1') return;
    win.dataset.prevDisplay = win.style.display || '';
    win.dataset.minimized = '1';
    win.style.display = 'none';
    let btn = tasks.get(win);
    if(!btn){
      btn = document.createElement('button');
      btn.className = 'taskbar-btn';
      btn.innerHTML = '<span class="tb-ico"></span><span></span>';
      btn.lastChild.textContent = titleOf(win);
      btn.addEventListener('click', ()=> restore(win));
      tasksEl.appendChild(btn);
      tasks.set(win, btn);
    }
  }
  function restore(win){
    win.style.display = win.dataset.prevDisplay || '';
    win.dataset.minimized = '';
    const btn = tasks.get(win);
    if(btn){ btn.remove(); tasks.delete(win); }
  }

  function wireMinBtn(win, btnEl){
    btnEl.addEventListener('click', e=>{
      e.stopPropagation();
      minimize(win);
    });
  }

  // window-chrome panels (matPicker, hud)
  function wireWin95Drag(win, handle){
    let dragging=false, ox=0, oy=0;
    function start(cx, cy, e){
      if(e.target.closest('.tbtn')) return;
      const r=win.getBoundingClientRect();
      ox=cx-r.left; oy=cy-r.top;
      win.style.left=r.left+'px'; win.style.top=r.top+'px';
      win.style.right='auto'; win.style.bottom='auto';
      win.style.transform='none';
      dragging=true;
      e.preventDefault();
    }
    function move(cx, cy){
      if(!dragging) return;
      const nx=Math.max(0, Math.min(window.innerWidth-40, cx-ox));
      const ny=Math.max(0, Math.min(window.innerHeight-40, cy-oy));
      win.style.left=nx+'px'; win.style.top=ny+'px';
    }
    handle.addEventListener('mousedown', e=>start(e.clientX, e.clientY, e));
    document.addEventListener('mousemove', e=>move(e.clientX, e.clientY));
    document.addEventListener('mouseup', ()=>dragging=false);
    handle.addEventListener('touchstart', e=>{
      const t=e.touches[0]; start(t.clientX, t.clientY, e);
    }, {passive:false});
    document.addEventListener('touchmove', e=>{
      if(!dragging) return;
      const t=e.touches[0]; move(t.clientX, t.clientY); e.preventDefault();
    }, {passive:false});
    document.addEventListener('touchend', ()=>dragging=false);
    document.addEventListener('touchcancel', ()=>dragging=false);
  }
  document.querySelectorAll('.win95').forEach(win=>{
    win.addEventListener('mousedown', e=>e.stopPropagation());
    const title = win.querySelector('.win95-title');
    if(title) wireWin95Drag(win, title);
    const tbtns = win.querySelectorAll('.win95-title .tbtns .tbtn');
    const [minBtn, maxBtn, closeBtn] = tbtns;
    if(minBtn) wireMinBtn(win, minBtn);
    if(maxBtn) maxBtn.addEventListener('click', e=>{
      e.stopPropagation();
      win.classList.toggle('is-min');
    });
    if(closeBtn) closeBtn.addEventListener('click', e=>{
      e.stopPropagation();
      minimize(win);
    });
  });

  // resume blocks: inject real tbtns into the h3 (replaces the ::after deco)
  document.querySelectorAll('.r-block').forEach(win=>{
    const h3 = win.querySelector('h3');
    if(!h3) return;
    h3.classList.add('no-deco');
    h3.addEventListener('mousedown', e=>e.stopPropagation());
    const tbtns = document.createElement('span');
    tbtns.className = 'r-tbtns';
    tbtns.innerHTML = '<span class="tbtn" data-act="min">_</span><span class="tbtn">□</span><span class="tbtn">✕</span>';
    h3.appendChild(tbtns);
    wireMinBtn(win, tbtns.querySelector('[data-act="min"]'));
  });

  // taskbar clock
  function tickClock(){
    const d=new Date();
    const h=d.getHours(), m=d.getMinutes();
    const hh=((h+11)%12)+1;
    clockEl.textContent = hh+':'+(m<10?'0':'')+m+' '+(h<12?'AM':'PM');
  }
  tickClock(); setInterval(tickClock, 15000);

  const DIRECTORY = [
    { type:'item', id:'overview', label:'Overview', icon:'i' },
    { type:'sep' },
    { type:'cat', label:'Experience · Snap Inc.', icon:'S', items:[
      { type:'item', id:'snap', label:'Role overview', icon:'i' },
      { type:'item', id:'imagine-together', label:'Imagine Together', icon:'★' },
      { type:'item', id:'translation', label:'Translation', icon:'★' },
      { type:'item', id:'agent-center', label:'Agent Center', icon:'⚙' },
      { type:'item', id:'ai-playground', label:'AI Playground', icon:'⚙' },
      { type:'item', id:'ai-music-gen', label:'AI Music Gen', icon:'♪' },
      { type:'item', id:'rsg', label:'RemoteServiceGateway', icon:'⚙' },
    ]},
    { type:'cat', label:'Awards · Hackathons', icon:'🏆', items:[
      { type:'item', id:'catiator', label:'Catiator', icon:'🏆' },
      { type:'item', id:'intarnet', label:'IntARnet', icon:'🏆' },
      { type:'item', id:'larp', label:'lARp', icon:'🏆' },
      { type:'item', id:'snaptrap', label:'Snaptrap', icon:'🏆' },
    ]},
    { type:'cat', label:'Games', icon:'🎮', items:[
      { type:'item', id:'retrovirus-vr', label:'RetroVirus VR', icon:'💾' },
      { type:'item', id:'songbird', label:'Songbird', icon:'🎷' },
      { type:'item', id:'nira', label:'Nira', icon:'🪄' },
    ]},
    { type:'item', id:'education', label:'Education', icon:'🎓' },
    { type:'sep' },
    { type:'item', id:'about', label:'About Me', icon:'?' },
    { type:'item', id:'contact', label:'Contact', icon:'✉', href:'https://www.linkedin.com/in/mitchell-kuppersmith' },
  ];

  const startMenu = document.getElementById('startMenu');
  const startMenuBody = document.getElementById('startMenuBody');
  const startBtn = document.querySelector('.taskbar-start');
  const winLayer = document.getElementById('windowsLayer');
  const openWindows = new Map(); // id -> { el, taskBtn }
  let zTop = 100;

  function buildMenu(items, container){
    items.forEach(it=>{
      if(it.type==='sep'){
        const s=document.createElement('div'); s.className='smenu-sep'; container.appendChild(s); return;
      }
      const row=document.createElement('div');
      row.className='smenu-item'+(it.type==='cat'?' smenu-cat':'');
      row.innerHTML = `<span class="smenu-ico">${it.icon||''}</span><span>${it.label}</span>`;
      if(it.type==='item'){
        row.addEventListener('click', e=>{
          e.stopPropagation();
          if(it.href){
            window.open(it.href, '_blank', 'noopener');
          } else {
            launchPanel(it.id);
          }
          closeStartMenu();
        });
      } else if(it.type==='cat'){
        const sub=document.createElement('div'); sub.className='smenu-sub';
        buildMenu(it.items, sub);
        row.appendChild(sub);
        // Align submenu's top with parent row so a purely horizontal cursor
        // move lands on the first submenu item, then clamp into viewport.
        row.addEventListener('mouseenter', ()=>{
          const rRect = row.getBoundingClientRect();
          const menuRect = startMenu.getBoundingClientRect();
          sub.style.left = menuRect.right + 'px';
          sub.style.top  = rRect.top + 'px';
          sub.style.bottom = 'auto';
          // measure after display via :hover
          requestAnimationFrame(()=>{
            const sRect = sub.getBoundingClientRect();
            const taskbarTop = window.innerHeight - 30;
            let top = rRect.top;
            if(top + sRect.height > taskbarTop) top = Math.max(2, taskbarTop - sRect.height);
            if(top < 2) top = 2;
            sub.style.top = top + 'px';
          });
        });
      }
      container.appendChild(row);
    });
  }
  buildMenu(DIRECTORY, startMenuBody);

  function openStartMenu(){
    startMenu.style.display='flex';
    startBtn.classList.add('is-open');
  }
  function closeStartMenu(){
    startMenu.style.display='none';
    startBtn.classList.remove('is-open');
  }
  function toggleStartMenu(){
    if(startMenu.style.display==='none') openStartMenu(); else closeStartMenu();
  }
  startBtn.addEventListener('click', e=>{ e.stopPropagation(); toggleStartMenu(); });
  document.addEventListener('mousedown', e=>{
    if(startMenu.style.display!=='none' && !startMenu.contains(e.target) && !startBtn.contains(e.target)){
      closeStartMenu();
    }
  });

  function focusWindow(win){
    document.querySelectorAll('.win-app').forEach(w=>w.classList.remove('is-focus'));
    win.classList.add('is-focus');
    win.style.zIndex = ++zTop;
    // mark taskbar buttons
    openWindows.forEach((info, id)=>{
      if(info.taskBtn) info.taskBtn.classList.toggle('is-active', info.el===win);
    });
  }

  function makeDraggable(win, handle){
    let dragging=false, ox=0, oy=0;
    function start(cx, cy, e){
      if(e.target.closest('.tbtn')) return;
      dragging=true;
      const r=win.getBoundingClientRect();
      ox=cx-r.left; oy=cy-r.top;
      focusWindow(win);
      e.preventDefault();
    }
    function move(cx, cy){
      if(!dragging) return;
      const nx=Math.max(0, Math.min(window.innerWidth-40, cx-ox));
      const ny=Math.max(0, Math.min(window.innerHeight-60, cy-oy));
      win.style.left=nx+'px'; win.style.top=ny+'px';
    }
    handle.addEventListener('mousedown', e=>start(e.clientX, e.clientY, e));
    document.addEventListener('mousemove', e=>move(e.clientX, e.clientY));
    document.addEventListener('mouseup', ()=>dragging=false);
    handle.addEventListener('touchstart', e=>{
      const t=e.touches[0]; start(t.clientX, t.clientY, e);
    }, {passive:false});
    document.addEventListener('touchmove', e=>{
      if(!dragging) return;
      const t=e.touches[0]; move(t.clientX, t.clientY); e.preventDefault();
    }, {passive:false});
    document.addEventListener('touchend', ()=>dragging=false);
    document.addEventListener('touchcancel', ()=>dragging=false);
  }

  function ensureTaskBtn(id, panel, win){
    let btn = openWindows.get(id)?.taskBtn;
    if(btn) return btn;
    btn = document.createElement('button');
    btn.className='taskbar-btn is-active';
    btn.innerHTML = `<span class="tb-ico"></span><span>${panel.title}</span>`;
    btn.addEventListener('click', ()=>{
      if(win.style.display==='none' || win.dataset.minimized==='1'){
        win.style.display='flex'; win.dataset.minimized='';
        focusWindow(win);
      } else if(win.classList.contains('is-focus')){
        win.dataset.minimized='1'; win.style.display='none';
        btn.classList.remove('is-active');
      } else {
        focusWindow(win);
      }
    });
    tasksEl.appendChild(btn);
    return btn;
  }

  function launchPanel(id){
    const panel = PANELS[id];
    if(!panel) return;
    const existing = openWindows.get(id);
    if(existing){
      existing.el.style.display='flex';
      existing.el.dataset.minimized='';
      focusWindow(existing.el);
      return;
    }
    const win=document.createElement('div');
    win.className='win-app is-focus theme-'+(panel.theme||'desktop');
    win.style.left = (60 + (openWindows.size%6)*32) + 'px';
    win.style.top  = (50 + (openWindows.size%6)*28) + 'px';
    win.style.zIndex = ++zTop;
    win.innerHTML = `
      <div class="win-title">
        <span>${panel.title}</span>
        <div class="tbtns">
          <div class="tbtn" data-act="min">_</div>
          <div class="tbtn" data-act="max">□</div>
          <div class="tbtn" data-act="close">✕</div>
        </div>
      </div>
      <div class="win-body">${panel.html}</div>
    `;
    winLayer.appendChild(win);
    if(id==='about' && typeof window.initRobot==='function') window.initRobot();
    const titleBar = win.querySelector('.win-title');
    makeDraggable(win, titleBar);
    win.addEventListener('mousedown', ()=>focusWindow(win));

    const taskBtn = ensureTaskBtn(id, panel, win);
    openWindows.set(id, { el:win, taskBtn });

    win.querySelector('[data-act="min"]').addEventListener('click', e=>{
      e.stopPropagation();
      win.dataset.minimized='1'; win.style.display='none';
      taskBtn.classList.remove('is-active');
    });
    win.querySelector('[data-act="close"]').addEventListener('click', e=>{
      e.stopPropagation();
      win.remove(); taskBtn.remove();
      openWindows.delete(id);
    });
    win.querySelectorAll('[data-launch]').forEach(ic=>{
      ic.style.cursor='pointer';
      ic.addEventListener('click', e=>{
        e.preventDefault(); e.stopPropagation();
        launchPanel(ic.getAttribute('data-launch'));
      });
    });
    win.querySelector('[data-act="max"]').addEventListener('click', e=>{
      e.stopPropagation();
      if(win.dataset.maxed==='1'){
        win.style.left=win.dataset.preL; win.style.top=win.dataset.preT;
        win.style.width=win.dataset.preW; win.style.height='';
        win.style.maxHeight='70vh';
        win.dataset.maxed='';
      } else {
        win.dataset.preL=win.style.left; win.dataset.preT=win.style.top;
        win.dataset.preW=win.style.width;
        win.style.left='4px'; win.style.top='4px';
        win.style.width=(window.innerWidth-12)+'px';
        win.style.height=(window.innerHeight-40)+'px';
        win.style.maxHeight='none';
        win.dataset.maxed='1';
      }
    });

    focusWindow(win);
  }

  // open Overview at boot so people see the directory right away
  setTimeout(()=>launchPanel('overview'), 200);
})();
</script>
