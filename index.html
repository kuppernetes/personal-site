function doRain(){
  if(!raining)return;
  for(let i=0;i<6;i++){
    const x=Math.floor(Math.random()*W);
    if(grid[idx(x,0)]===EMPTY){grid[idx(x,0)]=SAND;variant[idx(x,0)]=Math.random()*8|0;wake3(x,0);pixDirty(x,0);}
  }
}
// ambient drift: a few motes of pollen rising from the ground, always on,
// so the place feels alive even before anyone touches it
function doAmbient(){
  if(Math.random()<0.45){
    const x=Math.floor(Math.random()*W);
    for(let d=0;d<8;d++){
      const y=VH-4-d;
      if(y<0)break;
      const m=grid[idx(x,y)];
      if(m===GRASS||m===PLANT||m===MOSS||m===DIRT){
        const ty=y-1;
        if(ty>=0&&grid[idx(x,ty)]===EMPTY){grid[idx(x,ty)]=POLLEN;variant[idx(x,ty)]=Math.random()*8|0;wake3(x,ty);pixDirty(x,ty);break;}
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════
   BIRDS — boids flocking (separation / alignment / cohesion).
   Birds aren't grid cells: they're free-flying agents drawn
   on a 2D overlay canvas above the sim, so they don't fight
   the cellular automaton's dirty-rect/upload pipeline.
═══════════════════════════════════════════════════════ */
const birds=[];
const BIRD_MAX=350;
const birdCanvas=document.getElementById('birdCanvas');
const bctx=birdCanvas.getContext('2d');

function spawnBird(x,y){
  if(birds.length>=BIRD_MAX)return;
  const a=Math.random()*Math.PI*2;
  birds.push({x,y,vx:Math.cos(a)*0.9,vy:Math.sin(a)*0.9,flap:Math.random()*100|0,fed:0});
}

// terrain birds avoid colliding with — any solid stamp counts
function isSolidForBird(x,y){
  if(x<0||x>=W||y<0||y>=H)return true; // walls
  const m=grid[idx(x,y)];
  return m===STONE||m===DIRT||m===GRASS||m===WOOD||m===BRICK||m===THATCH||
         m===LEAF||m===BERRY||m===GLASS||m===MASK||m===RIGID||m===FUSE||m===BOMB;
}

// spatial hash for neighbour queries: bin birds into perception-radius cells
// (linked lists over two Int32Arrays) so flocking is O(n·k), not O(n²) —
// 350 birds went from ~122k pair tests per step to a few hundred
const BOID_CELL=18;
let boidHead=null,boidNext=null,boidGW=0,boidGH=0;
function updateBoids(){
  const n=birds.length;
  if(!n)return;
  const perc=18,perc2=perc*perc,sepR=5,sep2=sepR*sepR;
  const maxSpeed=1.15,maxForce=0.045;
  const gw=((W/BOID_CELL)|0)+1,gh=((H/BOID_CELL)|0)+1;
  if(!boidHead||boidGW!==gw||boidGH!==gh){boidHead=new Int32Array(gw*gh);boidGW=gw;boidGH=gh;}
  if(!boidNext||boidNext.length<n)boidNext=new Int32Array(Math.max(n*2,64));
  boidHead.fill(-1);
  for(let i=0;i<n;i++){
    const b=birds[i];
    let cx=(b.x/BOID_CELL)|0,cy=(b.y/BOID_CELL)|0;
    if(cx<0)cx=0;else if(cx>=gw)cx=gw-1;
    if(cy<0)cy=0;else if(cy>=gh)cy=gh-1;
    const c=cy*gw+cx;
    boidNext[i]=boidHead[c];boidHead[c]=i;
  }
  for(let i=0;i<n;i++){
    const b=birds[i];
    let alX=0,alY=0,coX=0,coY=0,sepX=0,sepY=0,nA=0,nS=0;
    const cx0=Math.max(0,((b.x-perc)/BOID_CELL)|0),cx1=Math.min(gw-1,((b.x+perc)/BOID_CELL)|0);
    const cy0=Math.max(0,((b.y-perc)/BOID_CELL)|0),cy1=Math.min(gh-1,((b.y+perc)/BOID_CELL)|0);
    for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){
      for(let j=boidHead[cy*gw+cx];j!==-1;j=boidNext[j]){
        if(j===i)continue;
        const o=birds[j];
        const dx=o.x-b.x,dy=o.y-b.y,d2=dx*dx+dy*dy;
        if(d2<perc2){
          alX+=o.vx;alY+=o.vy;
          coX+=o.x;coY+=o.y;
          nA++;
          if(d2<sep2&&d2>0.01){
            const d=Math.sqrt(d2);
            sepX-=dx/d;sepY-=dy/d;nS++;
          }
        }
      }
    }
    let ax=0,ay=0;
    if(nA>0){
      alX/=nA;alY/=nA;
      let m=Math.hypot(alX,alY);
      if(m>0){alX=alX/m*maxSpeed-b.vx;alY=alY/m*maxSpeed-b.vy;}
      coX=coX/nA-b.x;coY=coY/nA-b.y;
      let cm=Math.hypot(coX,coY);
      if(cm>0){coX=coX/cm*maxSpeed-b.vx;coY=coY/cm*maxSpeed-b.vy;}
      ax+=alX*0.9+coX*0.55;
      ay+=alY*0.9+coY*0.55;
    }
    if(nS>0){
      let m=Math.hypot(sepX,sepY);
      if(m>0){sepX=sepX/m*maxSpeed-b.vx;sepY=sepY/m*maxSpeed-b.vy;}
      ax+=sepX*1.7;ay+=sepY*1.7;
    }
    // terrain avoidance: look ahead, pull away from solid + bias upward
    const lookX=(b.x+b.vx*8)|0,lookY=(b.y+b.vy*8)|0;
    if(isSolidForBird(lookX,lookY)){
      ax-=b.vx*0.4;ay-=b.vy*0.4;ay-=0.35;
    }
    // also avoid fire and open melt below
    {
      const hm=grid[idx(Math.max(0,Math.min(W-1,b.x|0)),Math.max(0,Math.min(H-1,(b.y+3)|0)))];
      if(hm===FIRE||hm===LAVA)ay-=0.6;
    }
    // soft bounds — keep birds in the upper two-thirds and away from walls
    if(b.x<8)ax+=0.12;
    if(b.x>W-8)ax-=0.12;
    if(b.y<6)ay+=0.12;
    const floorPref=VH*0.72;
    if(b.y>floorPref)ay-=0.10;
    if(b.y>VH-8)ay-=0.4;
    // clamp + integrate
    const fm=Math.hypot(ax,ay);
    if(fm>maxForce){ax=ax/fm*maxForce;ay=ay/fm*maxForce;}
    b.vx+=ax;b.vy+=ay;
    const sm=Math.hypot(b.vx,b.vy);
    if(sm>maxSpeed){b.vx=b.vx/sm*maxSpeed;b.vy=b.vy/sm*maxSpeed;}
    if(sm<0.25){b.vx*=1.4;b.vy*=1.4;} // don't stall
    b.x+=b.vx;b.y+=b.vy;
    b.flap++;
    // hard bounds
    if(b.x<1){b.x=1;b.vx=Math.abs(b.vx);}
    if(b.x>W-2){b.x=W-2;b.vx=-Math.abs(b.vx);}
    if(b.y<1){b.y=1;b.vy=Math.abs(b.vy);}
    if(b.y>VH-2){b.y=VH-2;b.vy=-Math.abs(b.vy);}
    forage(b);
  }
}

// A berry brushed in flight gets eaten; a few seconds later the bird drops the
// pip wherever the flock has drifted to. Plants fruit on their own, so the
// birds close the loop: thicket → berry → bird → seed → thicket, somewhere else.
const PECK=[[0,0],[1,0],[-1,0],[0,1],[0,-1]];
function forage(b){
  const sx=b.x|0,sy=b.y|0;
  if(b.fed>0){
    if(--b.fed===0&&eFree(sx,sy+1))setMat(sx,sy+1,SEED);
    return;
  }
  if(sx<1||sx>=W-1||sy<1||sy>=H-1)return;
  for(const[ox,oy]of PECK){
    const px=sx+ox,py=sy+oy,pi=idx(px,py);
    if(grid[pi]!==BERRY)continue;
    grid[pi]=EMPTY;variant[pi]=0;frozen[pi]=0;
    updated[pi]=frameId;wake3(px,py);pixDirty(px,py);
    b.fed=200+(Math.random()*280|0);
    return;
  }
}

function drawBirds(){
  if(birdCanvas.width!==W)return; // skip mid-resize
  // One camera translate for the whole overlay. Birds, cats and the chest all
  // think in world cells; this is the only place that has to know about camY,
  // and the transform persists on the context through drawCats/updateEvil.
  bctx.setTransform(1,0,0,1,0,-camY);
  bctx.clearRect(0,camY,W,VH);
  if(!birds.length)return;
  bctx.fillStyle='#1c1a22';
  for(const b of birds){
    const x=b.x|0,y=b.y|0;
    // pick a shape based on flight direction + flap phase
    const dirRight=b.vx>=0;
    const up=((b.flap>>2)&1)===0;
    // tiny chevron: ▴ (wings up) or ◜◝ (wings down). 1px scale.
    if(up){
      // wings raised: a peak
      bctx.fillRect(x,   y,   1,1);
      bctx.fillRect(x-1, y-1, 1,1);
      bctx.fillRect(x+1, y-1, 1,1);
      bctx.fillRect(x-2, y,   1,1);
      bctx.fillRect(x+2, y,   1,1);
    } else {
      // wings lowered: a flat M
      bctx.fillRect(x-2, y-1, 1,1);
      bctx.fillRect(x-1, y,   1,1);
      bctx.fillRect(x,   y-1, 1,1);
      bctx.fillRect(x+1, y,   1,1);
      bctx.fillRect(x+2, y-1, 1,1);
    }
    // direction tick — a single pixel ahead of the bird
    if(dirRight)bctx.fillRect(x+3,y,1,1); else bctx.fillRect(x-3,y,1,1);
  }
}


/* ═══════════════════════════════════════════════════════
   GHOSTS — the vaults' residents

   Snap's ghost, haunting the room that holds the Snap work. Agents on the same
   overlay canvas the birds and cats use, so they cost the cellular automaton
   nothing and are not subject to it.

   Deliberately NOT boids. Flocking is a description of birds — separation,
   alignment, cohesion, a shared heading — and a crypt full of ghosts moving in
   formation reads as a flock of sheets. These drift independently on a slow
   bob, mind only two things (the walls of their room and the cursor), and are
   otherwise unaware of each other.

   They are also drawn rather than stamped. A ghost in the grid would be a
   material, and every material here is something you can burn, dissolve or
   pile sand on; the one thing a ghost should be is untouchable.
═══════════════════════════════════════════════════════ */
const ghosts=[];
const GHOST_HW=6;              // half-width of the body, in cells
const GHOST_H=17;              // total height, in cells
const GHOST_HEM=4;             // how many bottom rows ripple

function spawnGhost(x,y){
  ghosts.push({
    x,y,
    vx:(Math.random()<0.5?-1:1)*(0.10+Math.random()*0.13),
    vy:(Math.random()-0.5)*0.06,
    // Per-ghost phase AND rate. A shared rate makes every hem in the room
    // ripple on the same beat, which reads as one animation playing six times
    // rather than as six things.
    phase:Math.random()*Math.PI*2,
    rate:0.020+Math.random()*0.018,
  });
}
/* Populate the vaults. Spread across the room's width at staggered heights so
   they are not a row; the count scales with how wide the window actually is,
   because six ghosts in a narrow room is a crowd and in a wide one is a
   scattering. */
function spawnGhosts(){
  ghosts.length=0;
  const box=ROOM_BOX.crypt;
  if(!box)return;
  const n=Math.max(3,Math.min(8,Math.round((box.x1-box.x0)/46)));
  for(let k=0;k<n;k++){
    const fx=(k+0.5)/n;
    spawnGhost(box.x0+(box.x1-box.x0)*fx,
               box.ceil+(box.floor-box.ceil)*(0.22+0.5*Math.random()));
  }
}

function updateGhosts(){
  const box=ROOM_BOX.crypt;
  if(!box||!ghosts.length)return;
  const bx0=box.x0+GHOST_HW+2, bx1=box.x1-GHOST_HW-2;
  const by0=box.ceil+GHOST_H+1, by1=box.floor-3;
  for(const g of ghosts){
    g.phase+=g.rate;
    g.x+=g.vx;
    g.y+=g.vy+Math.sin(g.phase*0.8)*0.075;

    /* ── what a ghost will not pass through ──
       Brick, yes: drifting through a pillar is the entire point, and it is the
       one thing in this world that can. The work, no. The panels are stamped
       into the grid as MASK, and a translucent sprite crossing body copy is a
       legibility bug wearing a costume — so MASK is the one material a ghost
       turns around at. Sampled a body-width ahead so the turn happens before
       any part of it is over the text. */
    const ax=(g.x+(g.vx>=0?1:-1)*(GHOST_HW+3))|0, ay=g.y|0;
    if(ax>0&&ax<W&&ay>0&&ay<H&&grid[idx(ax,ay)]===MASK)g.vx=-g.vx;
    const ny=(g.y+(g.vy>=0?1:-1)*(GHOST_H*0.6))|0, nx=g.x|0;
    if(nx>0&&nx<W&&ny>0&&ny<H&&grid[idx(nx,ny)]===MASK)g.vy=-g.vy;

    // ── spooked ──
    // Shy away from the cursor, so sweeping through the room scatters them and
    // they settle again a moment later. The only handle the visitor gets on
    // something they otherwise cannot touch.
    const dx=g.x-mouseSimX, dy=g.y-mouseSimY, d2=dx*dx+dy*dy;
    if(d2<1200&&d2>1){
      const d=Math.sqrt(d2), push=0.055*(1-d/34.6);
      g.vx+=dx/d*push; g.vy+=dy/d*push;
    }

    // Bleed the scare off and hold a slow drift. Without the floor on |vx| a
    // ghost that gets pushed to a standstill just hangs there.
    g.vx*=0.985; g.vy*=0.965;
    g.vx=Math.max(-0.55,Math.min(0.55,g.vx));
    g.vy=Math.max(-0.40,Math.min(0.40,g.vy));
    if(Math.abs(g.vx)<0.07)g.vx=g.vx>=0?0.07:-0.07;

    if(g.x<bx0){g.x=bx0;g.vx=Math.abs(g.vx);}
    if(g.x>bx1){g.x=bx1;g.vx=-Math.abs(g.vx);}
    if(g.y<by0){g.y=by0;g.vy=Math.abs(g.vy);}
    if(g.y>by1){g.y=by1;g.vy=-Math.abs(g.vy);}
  }
}

/* Draw one ghost as rows rather than as a bitmap.

   The silhouette is Snap's: a dome that widens over the first few rows, then
   straight sides, then a hem that ripples. Rows are one fillRect each — a
   per-pixel loop would be ~220 rects per ghost, and the hem is the only part
   that actually needs per-column work.

   The hem is a sine in x offset by the ghost's own phase, so the bottom edge
   travels sideways as it ripples instead of pulsing in place. */
function drawGhost(g){
  const x=g.x|0, y=g.y|0;                 // y is the ghost's BOTTOM row
  const top=y-GHOST_H+1;
  const hemTop=y-GHOST_HEM+1;
  for(let r=top;r<hemTop;r++){
    const t=(r-top)/5;
    // dome: quarter-sine to full width over the first five rows
    const hw=t<1 ? Math.max(1,Math.round(GHOST_HW*Math.sin(t*Math.PI*0.5))) : GHOST_HW;
    bctx.fillRect(x-hw,r,hw*2+1,1);
  }
  for(let dx=-GHOST_HW;dx<=GHOST_HW;dx++){
    const wave=Math.sin(dx*0.85+g.phase*2.1);
    const edge=y-Math.round(1.7*(1+wave));
    if(edge>=hemTop)bctx.fillRect(x+dx,hemTop,1,edge-hemTop+1);
  }
  // eyes, punched back out of the body
  bctx.save();
  bctx.globalCompositeOperation='destination-out';
  bctx.fillRect(x-4,top+5,2,3);
  bctx.fillRect(x+3,top+5,2,3);
  bctx.restore();
}
function drawGhosts(){
  if(birdCanvas.width!==W||!ghosts.length)return;
  bctx.save();
  for(const g of ghosts){
    // cheap cull: the overlay is one screenful and most ghosts are not on it
    if(g.y<camY-GHOST_H||g.y>camY+VH+GHOST_H)continue;
    // Breathe the opacity, out of phase with the hem so a ghost is never at
    // once at its faintest and at its stillest.
    bctx.globalAlpha=0.34+0.20*Math.sin(g.phase*0.55+1.1);
    bctx.fillStyle='#cfe4ff';
    drawGhost(g);
  }
  bctx.restore();
}

/* ═══════════════════════════════════════════════════════
   CATS — small ground-roaming critters. They walk on top of
   whatever terrain is currently there (sand/grass/dirt/sprite
   debris all count), spring up ledges, leap narrow liquid/fire
   hazards (turning back from wide ones), and pick wandering
   targets within a "home" range so they hang around the village.
   When boxed in they give up and sit; idle cats sometimes sit
   for a long stretch, and occasionally sprint in a burst of
   zoomies with playful hops.
═══════════════════════════════════════════════════════ */
const cats=[];
function isAvoidForCat(m){return m===WATER||m===OIL||m===ACID||m===FIRE||m===SMOKE||m===LAVA||m===STEAM;}
// MASK is invisible HTML-collision — cats shouldn't stand on the title letters
function isSupportForCat(m){return m!==EMPTY&&m!==MASK&&!isAvoidForCat(m);}
// surface y at column x: first cell from the top whose contents would
// support a paw. Returns H if there's no ground (column is all sky/liquid).
function catGround(x,fromY){
  if(x<0||x>=W)return H;
  // start a few cells above the cat's current head so material painted
  // up in the sky doesn't yank the cat upward; default to top for spawn
  const y0=Math.max(0,(fromY===undefined?0:(fromY|0)-3));
  for(let y=y0;y<H;y++){
    if(isSupportForCat(grid[idx(x,y)])&&!inWordmark(x,y))return y;
  }
  return H;
}
// Is this column's footing under water (or under fire)? catGround only ever
// returns something a paw could rest on, so a pond never shows up in the
// material it reports — the hazard is whatever is sitting on top of that
// footing. Without this a cat reads the bed of a lake as perfectly good
// ground and strolls straight in. Fire counts the moment it appears; water
// needs two cells of it, because a cat will wade a puddle and a rained-on
// meadow would otherwise be a wall of hazards.
function drowned(x,g){
  if(g<1||g>=H)return false;
  const a=grid[idx(x,g-1)];
  if(a===FIRE||a===LAVA||a===SMOKE||a===STEAM)return true;
  return isLiq(a)&&g>1&&isLiq(grid[idx(x,g-2)]);
}
// Standing in a body of water rather than under a passing one: the cell plus
// most of the space beneath it. Rain sheeting past a cat on a rooftop is not
// a swim, and without the depth test the cat starts paddling in mid-air.
function inDrink(x,y){
  if(!isLiq(mat(x,y)))return false;
  let n=0;
  for(let k=1;k<=3;k++)if(isLiq(mat(x,y+k)))n++;
  return n>=2;
}
// Waterline in this column, looked for around the cat's own body rather than
// from the top of the world — a cat swimming under an overhang or beside a
// waterfall should ride the pond it is actually in. -1 when the column is dry.
function waterSurfaceNear(x,y){
  if(x<0||x>=W)return -1;
  const y0=Math.max(0,y-2),y1=Math.min(H-1,y+3);
  for(let yy=y0;yy<=y1;yy++){
    if(isLiq(grid[idx(x,yy)])){
      let s=yy;
      while(s-1>=0&&isLiq(grid[idx(x,s-1)]))s--;
      return s;
    }
  }
  return -1;
}
function spawnCat(x,y,opts){
  opts=opts||{};
  cats.push({
    x:x, y:y,
    vx:0, vy:0, dir:Math.random()<0.5?-1:1,
    exitT:0, // grace frames after hauling out, so the scramble isn't re-wetted
    dryT:0,  // consecutive frames clear of the water while swimming
    homeMin:opts.homeMin!==undefined?opts.homeMin:Math.max(2,x-60),
    homeMax:opts.homeMax!==undefined?opts.homeMax:Math.min(W-3,x+60),
    target:x,
    state:'pause', stateT:30+Math.random()*60|0,
    step:0, // walk-cycle phase
    air:false, // mid-leap
    blocked:0, // consecutive turnarounds — give up and sit when boxed in
  });
}
function updateCats(){
  for(const c of cats){
    c.step++;
    if(c.stateT>0)c.stateT--;
    if(c.exitT>0)c.exitT--;

    // ── in the drink? Going in takes the shoulder cell or the chin above it,
    // and mid-leap only the shoulder counts, so clearing a pond by a whisker
    // still reads as a clean jump. Staying in also accepts the cell under the
    // paws, which is what keeps a cat that has bobbed up to the waterline from
    // deciding it is back on land and sinking to the bed — but only once it is
    // already swimming, or dropping onto a log with water below would trip it.
    const wx=c.x|0,wy=c.y|0;
    const inWater=c.air?inDrink(wx,wy):(inDrink(wx,wy)||inDrink(wx,wy-1));
    const wet=inWater||(c.state==='swim'&&inDrink(wx,wy+1));
    if(wet&&c.exitT<=0){
      c.dryT=0;
      if(c.state!=='swim'){
        c.state='swim';c.stateT=0;c.blocked=0;c.vy=0;c.vx=0;c.air=false;
      }
    }else if(c.state==='swim'){
      // a bob can lift the whole cat clear for a single frame; wait for a few
      // dry ones before believing it, or the pose flickers on every swell
      if(++c.dryT>4){c.state='shake';c.stateT=45+Math.random()*35|0;}
    }

    // ── airborne: ballistic hop; land on the first support while falling
    if(c.air){
      c.vy+=0.1;
      c.x+=c.vx; c.y+=c.vy;
      if(c.x<2)c.x=2;
      if(c.x>W-3)c.x=W-3;
      const g=catGround(c.x|0,c.y);
      if(c.vy>0&&(c.y>=g-1||c.y>H-2)){
        c.y=Math.min(g-1,H-1);
        c.air=false; c.vy=0;
      }
      continue;
    }

    // ── swimming: ride the waterline, head clear, and paddle for the nearest
    // dry footing. Cats hate this and will take the first bank on offer.
    if(c.state==='swim'){
      const cxi=c.x|0;
      const surf=waterSurfaceNear(cxi,c.y|0);
      if(surf>=0){
        // the shoulder cell sits on the surface so the head rides above it;
        // the sine is the swell of the cat's own paddling
        const t=surf+Math.sin(c.step*0.16)*0.35;
        c.y+=(t-c.y)*0.3;
      }
      // Nearest shore either way. The column's top surface is what matters —
      // not the first thing under the cat's nose, which in a steep-sided pool
      // is the wall's flank rather than anything it could stand on. Footing
      // only counts when the cell above it is out of the water and it sits
      // near the cat's own level, so a canopy overhead isn't mistaken for
      // land. A floating log passes both tests, which is exactly right.
      // Both directions expand together so the nearest wins, and each stops at
      // the first wall across the swim lane: the meadow on the far side of a
      // steep bank is not somewhere the cat can paddle to, and steering at it
      // anyway pins the cat against the stone forever.
      let sd=0,blocked=[false,false];
      for(let j=1;j<=45&&!sd;j++){
        for(let s=-1;s<=1;s+=2){
          const b=s<0?0:1;
          if(blocked[b])continue;
          const sx=cxi+s*j;
          if(sx<2||sx>W-3){blocked[b]=true;continue;}
          const g=catGround(sx);
          if(g>=H||g<1){blocked[b]=true;continue;}
          // footing has to be dry and near the waterline, or the cat heads for
          // a wall top it could never climb
          if(!isLiq(grid[idx(sx,g-1)])&&g>=(c.y|0)-6&&g<=(c.y|0)+3){sd=s;break;}
          const lane=grid[idx(sx,c.y|0)];
          if(lane!==EMPTY&&!isLiq(lane))blocked[b]=true;
        }
      }
      if(sd)c.dir=sd;
      // dry footing in the very next column, within a scramble: haul out
      const ah=cxi+c.dir;
      if(ah>=2&&ah<=W-3){
        const g=catGround(ah);
        if(g<H&&g>=1&&!isLiq(grid[idx(ah,g-1)])&&g>=(c.y|0)-4&&g<=(c.y|0)+3){
          c.air=true;c.vy=-1.0;c.vx=c.dir*0.4;
          c.state='shake';c.stateT=60;c.exitT=30;
          // head inland once dry, or the next target picked across the pond
          // walks it straight back off the bank it just climbed
          c.target=Math.max(2,Math.min(W-3,(c.x+c.dir*(20+Math.random()*30))|0));
          // swept downstream of the patrol: stretch home rather than snap back
          if(c.x<c.homeMin)c.homeMin=Math.max(2,c.x|0);
          if(c.x>c.homeMax)c.homeMax=Math.min(W-3,c.x|0);
          continue;
        }
      }
      // otherwise keep paddling along the surface
      const nx=c.x+c.dir*0.22;
      const ni=Math.max(2,Math.min(W-3,nx|0));
      const nm=grid[idx(ni,c.y|0)];
      if(nm===EMPTY||isLiq(nm))c.x=Math.max(2,Math.min(W-3,nx));
      else c.dir=-c.dir;
      continue;
    }

    // settle to the ground under our nose
    const gy=catGround(c.x|0,c.y);
    if(gy>=H){ // nothing to stand on, drift down till we find something
      c.y+=0.5;
      if(c.y>H-1){c.y=H-1;}
      continue;
    }
    // glue paws to the surface; small jumps are absorbed by stepping
    c.y+=(gy-1-c.y)*0.5;

    // wringing out on the bank before getting back to the patrol
    if(c.state==='shake'){
      c.vx=0;
      if(c.stateT<=0){
        c.dir=c.target>c.x?1:-1;
        c.state='walk';c.stateT=120+Math.random()*120|0;c.blocked=0;
      }
      continue;
    }

    if(c.state==='pause'||c.state==='sit'){
      c.vx=0;
      if(c.stateT<=0){
        if(c.state==='pause'&&Math.random()<0.3){
          // settle in for a long sit
          c.state='sit'; c.stateT=300+Math.random()*600|0;
        }else{
          // pick a new target somewhere in home range
          const span=c.homeMax-c.homeMin;
          c.target=c.homeMin+(Math.random()*span)|0;
          c.dir=c.target>c.x?1:-1;
          const r=Math.random();
          c.state=r<0.12?'zoom':(r<0.55?'run':'walk'); // occasional zoomies
          c.stateT=120+Math.random()*240|0;
        }
      }
      continue;
    }

    // walk / trot / zoom toward target
    const speed=c.state==='zoom'?0.95:(c.state==='run'?0.55:0.28);
    c.vx=c.dir*speed;

    // obstacle check on the next column: hazard pit, cliff, or rising wall?
    const cx=c.x|0;
    const ahead=cx+c.dir;
    const aheadGround=catGround(ahead,c.y);
    let turn=false;

    if(ahead<2||ahead>W-3){
      turn=true;
    }else{
      const am=aheadGround<H?grid[idx(ahead,aheadGround)]:EMPTY;
      if(aheadGround>=H||isAvoidForCat(am)||drowned(ahead,aheadGround)){
        // hazard underfoot ahead — look for safe footing to leap to
        let leapt=false;
        for(let j=3;j<=6;j++){
          const lx=cx+c.dir*j;
          if(lx<2||lx>W-3)break;
          const lg=catGround(lx,c.y);
          if(lg>=H)continue;
          if(isAvoidForCat(grid[idx(lx,lg)])||drowned(lx,lg))continue;
          if(lg<gy-4)continue; // landing is up a wall — can't clear it
          c.air=true; c.vy=-1.05; c.vx=c.dir*(j/21);
          leapt=true; break;
        }
        if(!leapt)turn=true;
      }else{
        const rise=gy-aheadGround; // positive = ground climbs ahead
        if(rise>2){
          if(rise<=7){
            // spring up the ledge
            c.air=true; c.vy=-Math.sqrt(0.2*(rise+2)); c.vx=c.dir*0.3;
          }else turn=true;
        }
      }
    }

    if(turn){
      c.blocked++;
      if(c.blocked>=3){
        // boxed in — stop fighting the terrain and settle down here
        c.state='sit'; c.stateT=240+Math.random()*360|0; c.blocked=0;
      }else{
        c.dir=-c.dir;
        c.target=c.dir>0?c.homeMax:c.homeMin;
        // small pause to look around
        c.state='pause'; c.stateT=15+Math.random()*30|0;
      }
      continue;
    }
    if(c.air)continue; // just launched into a hop

    c.x+=c.vx;
    // zoomies come with playful little hops
    if(c.state==='zoom'&&Math.random()<0.02){
      c.air=true; c.vy=-0.65;
    }
    // clamp to home range with a turnaround
    if(c.x<c.homeMin){c.x=c.homeMin;c.dir=1;}
    if(c.x>c.homeMax){c.x=c.homeMax;c.dir=-1;}

    // arrived?
    if(Math.abs(c.x-c.target)<1.5){
      c.state='pause';
      c.stateT=40+Math.random()*120|0;
      c.blocked=0; // made it somewhere — clearly not boxed in
    }
  }
}
function drawCats(){
  if(!cats.length)return;
  bctx.fillStyle='#0a0a0e';
  for(const c of cats){
    const x=c.x|0,y=c.y|0,d=c.dir;
    // origin (x,y) = shoulder cell; body extends behind
    // facing right: body is to the LEFT of head; tail further left
    // facing left:  body is to the RIGHT of head
    const px=(dx,dy)=>{const xx=x+dx*d,yy=y+dy;if(xx>=0&&xx<W&&yy>=0&&yy<H)bctx.fillRect(xx,yy,1,1);};

    if(c.air){
      // mid-leap: body stretched long, paws out fore and aft, tail swept back
      px(0,0); px(-1,0); px(-2,0); px(-3,0);
      px(-1,-1); px(-2,-1); px(-3,-1);
      px(0,-1); px(1,-1); px(2,-1);
      px(0,-2); px(1,-2); px(2,-2);
      px(0,-3); px(2,-3);
      px(-4,-1); px(-5,-2);
      px(1,0); px(-4,0);
      continue;
    }

    if(c.state==='swim'){
      // only the head, ears and the crest of the back clear the water; the
      // forepaw churns at the surface and the tail streams out in the wake
      const ph=((c.step/3)|0)&1;
      const fo=(c.step>>2)&1;
      bctx.fillStyle='rgba(224,242,255,0.55)';   // foam either side of the wake
      px(3+fo,0); px(-5-fo,0); px(-7,0);
      bctx.fillStyle='#0a0a0e';
      px(0,-3); px(2,-3);                        // ears
      px(0,-2); px(1,-2); px(2,-2);              // head, held high and dry
      px(0,-1); px(1,-1); px(2,-1);
      px(0,0); px(-1,0); px(-2,0); px(-3,0);     // back along the waterline
      px(-4,0);                                  // tail trailing behind
      if(ph)px(1,0); else px(-1,-1);             // paddle stroke / recovery
      continue;
    }

    if(c.state==='shake'){
      // planted low and juddering side to side, throwing off droplets
      const j=(((c.step/2)|0)&1)?1:0;
      const pj=(dx,dy)=>px(dx+j,dy);
      pj(0,0); pj(-1,0); pj(-2,0); pj(-3,0);     // body
      pj(-1,-1); pj(-2,-1); pj(-3,-1);
      pj(0,-1); pj(1,-1); pj(2,-1);              // head
      pj(0,-2); pj(1,-2); pj(2,-2);
      pj(0,-3); pj(2,-3);                        // ears
      pj(-4,-1); pj(-5,-2);                      // tail flung out flat
      pj(0,1); pj(-3,1);                         // braced paws
      bctx.fillStyle='rgba(224,242,255,0.5)';
      px(3-j,-3); px(-6+j,-4); px(-2,-5);        // flying droplets
      bctx.fillStyle='#0a0a0e';
      continue;
    }

    if(c.state==='sit'){
      // sitting: haunches down, chest up, tail wrapped down the back
      px(0,-3); px(2,-3);                      // ears
      px(0,-2); px(1,-2); px(2,-2);            // head
      px(-1,-1); px(0,-1); px(1,-1); px(2,-1); // head + sloping back
      px(-2,0); px(-1,0); px(0,0); px(1,0);    // body
      px(-2,1); px(-1,1); px(1,1);             // haunch + front paw
      px(-3,0); px(-3,1);                      // tail
      continue;
    }

    const moving=c.state!=='pause';
    // walk cycle: legs alternate every few frames; faster when running
    const phaseRate=c.state==='zoom'?2:(c.state==='run'?3:5);
    const ph=((c.step/phaseRate)|0)&1;
    // body (4 wide, 2 tall), raised head (3 wide, 2 tall) with pointy ears,
    // upright curved tail behind
    // body block
    px(0,0); px(-1,0); px(-2,0); px(-3,0);
    px(-1,-1); px(-2,-1); px(-3,-1);
    // head — 3 wide, raised above the body so the chin clears the ground
    px(0,-1); px(1,-1); px(2,-1);
    px(0,-2); px(1,-2); px(2,-2);
    // ears — two pointy tufts with a notch between them
    px(0,-3); px(2,-3);
    // tail — question-mark curve rising off the rump
    px(-4,-1); px(-5,-2); px(-5,-3);
    if(moving){
      // wag: tip flicks with the step phase
      px(ph?-4:-6,-4);
    } else {
      px(-5,-4);
    }
    // legs — alternate pairs; when paused just front + back so it reads as standing
    if(moving){
      if(ph){
        px(0,1); px(-3,1); // front-right + back-left forward
      } else {
        px(-1,1); px(-2,1);
      }
    } else {
      px(0,1); px(-3,1);
    }
  }
}

let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    // a hidden/collapsed viewport reports 0, which would floor the grid to 0x0
    // and blank the canvas until the next resize — keep the current world
    if(!window.innerWidth||!window.innerHeight)return;
    // the canvas has been tracking the viewport in CSS the whole drag; only pay
    // for a realloc + rebuild if the cell grid actually changed dimensions
    if(!computeDims())return;
    // VH moved, so every zone boundary moved with it
    packZoneUniforms();
    syncScrollHeight();syncCamFromScroll();syncWorldLayer();
    allocArrays();allocChunks();allocTexture();allocLight();
    spawnContent();buildBodies();syncBrushRing();
  },200);
});

/* ═══════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════ */
// wait one frame so the DOM resume has been laid out before we measure & stamp
requestAnimationFrame(()=>{
  spawnContent();
  buildBodies();
  physicsOn=true;btnP.textContent='⏸ physics';btnP.classList.add('on');
});

let lastSim=0,simAcc=0,frameNo=0;
// Rolling estimate of what one sim step costs, in ms. A busy world (a big acid
// spill, a field on fire) can push a single step past 10ms, and the fixed
// 4-step catch-up below would then run all four every frame — 40ms+ of sim in a
// 16ms budget, so the whole page drops to ~17fps. Budgeting by measured cost
// instead spends the slowdown on sand speed, which nobody notices, rather than
// on frame rate, which everybody does. Seeded low so a fast machine starts at
// the full four steps.
let stepCostMs=0.5;
const SIM_BUDGET_MS=10;
function loop(ts){
  gTime=ts*0.001; // sky clock keeps clouds & sun drifting even when paused
  dayPhase+=(2*Math.PI/DAY_PERIOD)*Math.min(0.1,(ts-lastSim)*0.001);
  if(dayWarp>0){const step=Math.min(dayWarp,0.09);dayPhase+=step;dayWarp-=step;}
  if((frameNo++&1)===0)buildLight();
  if(physicsOn){
    // DOM reads (querySelectorAll + getBoundingClientRect per window) are the
    // costly part here — a 4-frame cadence is invisible at sand speed
    // cheap no-op unless the camera actually moved
    restampDOMMasks();
    if((frameNo&3)===0)updateWindowMasks();
    updateBodies();
    restampBodies();
    updateSpriteBodies();
    simAcc+=ts-lastSim;
    const stepMs=14/simSpeed;
    // floor the divisor: on an idle world the EMA decays toward zero, and a
    // huge quotient would wrap to 0 through the Int32 conversion — clamping a
    // fast machine down to one step, the exact opposite of the intent
    const maxN=Math.max(1,Math.min(4,Math.floor(SIM_BUDGET_MS/Math.max(0.25,stepCostMs))));
    const simStart=performance.now();
    let n=0;
    // The estimate lags sudden bursts. Check elapsed work too, while always
    // allowing one step so a heavy simulation continues to make progress.
    while(simAcc>=stepMs&&n<maxN&&(n===0||performance.now()-simStart<SIM_BUDGET_MS)){
      const t0=performance.now();
      doRain();doAmbient();simulate();updateChunks();updateBoids();updateGhosts();updateCats();
      stepCostMs+=((performance.now()-t0)-stepCostMs)*0.15; // EMA, ~15 frames to settle
      simAcc-=stepMs;n++;
    }
    if(simAcc>stepMs*maxN)simAcc=0;
    // keep pouring while the button is held even if the cursor isn't moving
    if(painting&&!dragBody&&lastPX>=0)paint(lastPX,lastPY,strokeMat);
    applyHoverFreeze();
  }
  lastSim=ts;
  updateBurns(ts); // push fresh burn holes into the DOM even while paused
  renderAll();
  drawBirds();
  drawGhosts();
  drawCats();
  updateEvil();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  const TASKBAR_H = 30;

  /* Where a window's top-left corner is allowed to sit.
     The old clamp let a window's LEFT edge roam to innerWidth-40, which on a
     phone parked the entire title bar — close button included — off the right
     side. Instead clamp against the window's own size: when it fits, it stays
     fully on screen; when it is wider or taller than the viewport (a maximised
     window, a long panel) the range inverts so you can still pan to the far
     edge rather than being pinned. */
  function clampWinPos(win, x, y){
    const w = win.offsetWidth, h = win.offsetHeight;
    const spareX = window.innerWidth - w;
    const spareY = window.innerHeight - TASKBAR_H - h;
    return [
      Math.max(Math.min(0, spareX), Math.min(Math.max(0, spareX), x)),
      Math.max(Math.min(0, spareY), Math.min(Math.max(0, spareY), y)),
    ];
  }

    if(win.classList.contains('r-block')){
      const h3 = win.querySelector('h3');

        // h3's first text node is the section title (e.g. "EXPERIENCE")
        for(const n of h3.childNodes){
          if(n.nodeType===3 && n.textContent.trim()) return n.textContent.trim();
        }
      }
      return 'Window';

    return t ? t.textContent : 'Window';

    'agent-center': { title:'agent-center // OSS', icon:'gear', theme:'terminal', html:`
      <h2>agent-center</h2>

      <video class="shot-clip" src="images/projects/agent-center.mp4" poster="images/projects/agent-center-poster.webp" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="Agent Center demo"></video>
      <p>A spatial UI for running coding agents from the glasses. Each agent is a robot avatar you can place in the room; its animation is its status, so a glance tells you who is working and who is waiting on you.</p>

      <ul>
        <li>multi-agent management — claude, codex, cursor cloud, openclaw</li>
        <li>voice or text in, with on-device speech recognition</li>
        <li>pinch-to-capture a frame and hand it to an agent as context</li>
        <li>agents are draggable avatars, themeable (cat, owl, ghost, axolotl, CRT, robot)</li>

        <li><b>lens</b> — the AR interface on Spectacles</li>

        <li><b>supabase</b> — auth, messaging and the realtime channel between the two</li>

      <div class="meta">Lens Studio v5.15.1+ · Spectacles OS v5.64+ · Node 18+ · pair with a 6-digit code</div>

    rsg: { title:'RemoteServiceGateway // OSS', icon:'gear', theme:'terminal', html:`
      <h2>RemoteServiceGateway</h2>
      <div class="sub">// open source · Lens Studio package</div>
      <img class="shot" loading="lazy" src="images/projects/remote-service-gateway.webp" alt="RemoteServiceGateway">
      <p>The generative-AI layer for Lens Studio: one interface in front of every model a lens can call, so a developer doesn't stand up their own backend to ship an AI experience. Both the AI Playground and Music Gen samples run on it.</p>
      <p>It exists because these APIs are used <em>alongside user-sensitive data</em> — the camera frame, location, microphone. Routing them through a gateway is what makes that publishable.</p>
      <h3>integrations</h3>
      <ul>
        <li><b>OpenAI</b> — chat completions (GPT-5, GPT-4o, GPT-4.1-nano), DALL&middot;E image generation and edit, text-to-speech, and the Realtime websocket</li>
        <li><b>Google</b> — Gemini and Gemini Live, Imagen for images, Lyria for music</li>
        <li><b>Snap-hosted</b> — DeepSeek with R1 reasoning, and Snap3D for text-to-3D in GLB</li>
      </ul>
      <h3>how developers get it</h3>
      <p>The package sits in the Lens Studio Asset Library under Spectacles. A Token Generator plugin issues per-account tokens for the Snap, OpenAI and Google services; they don't expire and carry across projects.</p>
      <div class="meta">Lens Studio v5.10.1+ · Spectacles OS v5.062+ · these APIs run on device only</div>
      <p><a href="https://developers.snap.com/spectacles/about-spectacles-features/apis/remoteservice-gateway" target="_blank" rel="noopener">Developer documentation →</a> · <a href="https://github.com/specs-devs/packages" target="_blank" rel="noopener">github.com/specs-devs/packages →</a></p>
      <div class="tags"><span class="tag">OpenAI</span><span class="tag">Gemini</span><span class="tag">Lyria</span><span class="tag">Snap3D</span><span class="tag">DeepSeek</span></div>
    `},
    catiator: { title:'★ CATIATOR ★', icon:'cat', theme:'vapor', html:`
      <h2>CATIATOR</h2>

      <p>Interactive VR game to learn American Sign Language through finger-tracked gesture combat. Battle waves of fierce-but-chonky catiator warriors by signing the corresponding letters.</p>
      <blockquote>"Signs are to eyes as words are to ears."</blockquote>
      <h3>★ INSPIRATION ★</h3>
      <p>~36 million hard-of-hearing and deaf people live in the US. Learning ASL means you can communicate with 17% more of the population. Inspired by typing-trainer games (TypeRacer, Typing of the Dead), we built one for sign language — wrapped in a Roman-vaporwave cat-gladiator aesthetic.</p>
      <h3>★ FEATURES ★</h3>
      <ul>
        <li><b>Multi-mode gameplay.</b> Duolingo-style ASL lessons before "play mode."</li>
        <li><b>Custom signs.</b> Define gestures via debug mode — Quizlet flashcards in 3D.</li>
        <li><b>Hand tracking</b> on Oculus Quest for direct, controller-free play.</li>
      </ul>
      <h3>★ MY ROLE ★</h3>
      <p>Gesture detection, Unity programming, environment and prop modelling, lighting, game design.</p>
      <h3>★ BUILT WITH ★</h3>
      <ul>
        <li>Oculus Quest · Unity3D · C#</li>
        <li>Autodesk Maya · Photoshop · Procreate</li>
        <li>Figma · Unity2D/3D</li>
      </ul>
      <h3>★ TEAM ★</h3>
      <ul>
        <li><b>Nancy Zuo</b> — UX, graphics, branding, 3D texturing, gesture mapping</li>
        <li><b>Ryan Davis</b> — character design, modelling, rigging, UV maps, animation</li>
        <li><b>Mitchell Kuppersmith</b> — gesture detection, Unity, environments, lighting</li>
        <li><b>Olivia</b> — UI element design</li>
      </ul>
      <h3>★ CHALLENGES ★</h3>
      <ul>
        <li>Crossed-finger signs (M vs N) hit the limits of Oculus' finger tracking.</li>
        <li>ASL uses facial expressions — no face tracking on Quest 1, so we focused on the manual alphabet.</li>
        <li>Hardware diversity across the team (PC + Quest required to debug live in Unity).</li>
      </ul>
      <h3>★ WHAT'S NEXT ★</h3>
      <ul>
        <li>More lessons, and gesture definition without dropping into debug mode</li>
        <li>Two-handed signs — the manual alphabet is only the entry point</li>
        <li>Further mini-games for drilling ASL</li>
      </ul>
      <p><a href="https://devpost.com/software/catiator" target="_blank" rel="noopener">Devpost →</a> · <a href="https://trisol.itch.io/catiators" target="_blank" rel="noopener">itch.io →</a></p>
      <div class="tags"><span class="tag">VR</span><span class="tag">Hand tracking</span><span class="tag">ASL</span><span class="tag">Unity</span><span class="tag">Oculus</span></div>

    intarnet: { title:'IntARnet', icon:'globe', theme:'spatial', html:`

    larp: { title:'lARp — mushroom AR', icon:'mushroom', theme:'forest', html:`
      <h2>lARp</h2>
      <div class="sub">Best Art and Gaming Hack · HooHacks 2021</div>
      <video class="shot-clip" src="images/projects/larp.mp4" poster="images/projects/larp-poster.webp" autoplay muted loop playsinline preload="metadata" disablepictureinpicture aria-label="lARp demo"></video>
      <p>A mushroom-themed AR fitness game that promotes physical activity through gamification — battle or befriend procedurally generated mushroom NPCs while GPT-3 powers open-ended dialogue.</p>

      <ul>
        <li><b>Limitless narrative.</b> GPT-3 lets players say whatever they want. Combined with 9,702 procedural mushroom permutations, every playthrough tells a different story.</li>
        <li><b>Fight or befriend.</b> Battle for XP or talk your way into friendship.</li>
        <li><b>Step-count missions.</b> Tracked via pedometer so treadmill players join in — you shouldn't need good weather to level up.</li>
      </ul>
      <h3>How We Built It</h3>
      <p>Unity + ARFoundation for mobile AR, C# for gameplay, OpenAI GPT-3 for NPC dialogue. The novel work was procedural character generation paired with prompt design so mushroom characters stayed in their whimsical lane while handling whatever players threw at them.</p>
      <ul>
        <li><b>AR:</b> Unity 3D · C# · ARFoundation</li>
        <li><b>AI:</b> OpenAI GPT-3</li>
        <li><b>3D &amp; animation:</b> Autodesk Maya · Photoshop</li>
        <li><b>UI/UX:</b> Figma · Photoshop</li>
      </ul>
      <h3>Accomplishments</h3>
      <ul>
        <li>Shipped a fully functional mobile AR app in a weekend</li>
        <li>Procedural mushroom characters with thousands of permutations</li>
        <li>Got GPT-3 dialogue running in Unity in 2021 — and had some very questionable conversations</li>
        <li>Pixel art in AR, plus an animated Devpost thumbnail</li>
      </ul>
      <h3>My Role</h3>
      <p>Unity/AR development and the GPT-3 integration.</p>
      <h3>Team</h3>
      <ul>
        <li><b>Ryan Davis</b> — character randomization, pixel art, 3D modelling, animation</li>
        <li><b>Mitchell Kuppersmith</b> — Unity/AR development, GPT-3 integration</li>
        <li><b>Nancy Zuo</b> — UI/UX design, illustration, character design</li>
        <li><b>Aidan Riedman</b> — Unity and GPT-3 development</li>
      </ul>
      <h3>What Was Hard</h3>
      <ul>
        <li>Prompt design — keeping a mushroom in character while a player says anything at all to it</li>

      <div class="tags"><span class="tag">AR</span><span class="tag">GPT-3</span><span class="tag">Unity</span><span class="tag">Fitness</span><span class="tag">Procedural</span></div>
    `},

  const startMenu = document.getElementById('startMenu');
  const startMenuBody = document.getElementById('startMenuBody');

  const openWindows = new Map(); // id -> { el, taskBtn }
  let zTop = 100;

  function buildMenu(items, container){
    items.forEach(it=>{
      if(it.type==='sep'){
        const s=document.createElement('div'); s.className='smenu-sep'; container.appendChild(s); return;
      }
      const row=document.createElement('div');
      row.className='smenu-item'+(it.type==='cat'?' smenu-cat':'');
      row.innerHTML = `<span class="smenu-ico">${ico(it.icon,'pxi-sm')}</span><span>${it.label}</span>`;
      if(it.type==='item'){
        row.addEventListener('click', e=>{
          e.stopPropagation();
          if(it.href){
            window.open(it.href, '_blank', 'noopener');
          } else {
            launchPanel(it.id);
          }
          closeStartMenu();
        });
      } else if(it.type==='cat'){
        const sub=document.createElement('div'); sub.className='smenu-sub';
        buildMenu(it.items, sub);
        row.appendChild(sub);
        // Align submenu's top with parent row so a purely horizontal cursor
        // move lands on the first submenu item, then clamp into viewport.
        function placeSub(){
          const rRect = row.getBoundingClientRect();
          const menuRect = startMenu.getBoundingClientRect();
          sub.style.left = menuRect.right + 'px';
          sub.style.top  = rRect.top + 'px';
          sub.style.bottom = 'auto';
          // measure once the submenu is actually displayed
          requestAnimationFrame(()=>{
            const sRect = sub.getBoundingClientRect();
            const taskbarTop = window.innerHeight - 30;
            let top = rRect.top;
            if(top + sRect.height > taskbarTop) top = Math.max(2, taskbarTop - sRect.height);
            if(top < 2) top = 2;
            sub.style.top = top + 'px';
            // On a phone the menu is 240 wide and the submenu 220 — parking it
            // at menuRect.right puts it past the edge. Flip it back over the
            // parent menu (Win95 does the same when it runs out of room).
            let left = menuRect.right;
            if(left + sRect.width > window.innerWidth - 2){
              left = Math.max(2, window.innerWidth - sRect.width - 2);
            }
            sub.style.left = left + 'px';
          });
        }
        row.addEventListener('mouseenter', placeSub);
        // Touch has no hover, so the CSS rule never fires and these rows would
        // be inert. A tap on the row (not on a child item) toggles it open.
        row.addEventListener('click', e=>{
          if(e.target.closest('.smenu-sub')) return;   // let child items through
          e.stopPropagation();
          const wasOpen = row.classList.contains('is-open');
          container.querySelectorAll(':scope > .smenu-cat.is-open')
                   .forEach(r=>r.classList.remove('is-open'));
          if(!wasOpen){ row.classList.add('is-open'); placeSub(); }
        });
      }
      container.appendChild(row);
    });
  }

  function openStartMenu(){

  function toggleStartMenu(){
